# FceRI (IgE receptor) gamma-chain signaling -- STOCHASTIC (Gillespie SSA).
#
# Real-world example, PyBNF 2019 paper corpus (Mitra et al., iScience 2019). The benchmark
# is from Gupta & Mendes 2018 (Computation 6:9); synthetic data were generated at known
# ground-truth parameters and the fit tries to recover them. Edition-2 twin of the classic
# examples/fceri_gamma/fceri_gamma.conf.
#
# The network is expanded once (BNG2.pl) and every simulation is a Gillespie SSA run
# (method: ssa) -- the deterministic ODE path would miss the discrete, noisy dynamics of
# the small molecule counts. smoothing averages replicate SSA trajectories per parameter
# set to give the optimizer a less noisy objective.
#
# Run from the repo root:
#   pybnf -c examples/real-world/fceri_gamma/fceri_gamma.conf

output_dir = output/real-world/fceri_gamma

edition = 2
bngl_backend = bngsim

model: fceri_gamma2.bngl

#######################
### Fitting Options ###
#######################

# Scatter Search (as the classic conf).
job_type = ss

# Synthetic data carry no _SD columns -> sum of squares.
objective = sos

max_iterations = 50
population_size = 12
verbosity = 2

# Average 3 replicate SSA trajectories per parameter set to smooth the stochastic objective.
smoothing = 3

# Refine the best fit with a local Simplex search (as the classic conf).
refine = 1
simplex_max_iterations = 20

###################
### Experiment ###
###################

# One stochastic experiment: the network is simulated with the Gillespie SSA (method: ssa)
# on the data's time grid. fceri_gamma2.exp's columns (LynFree, RecMon, RecPbeta, RecPgamma,
# RecSyk, RecSykPS) ARE the model observable names.
experiment: fceri_gamma2, method: ssa, data: fceri_gamma2.exp

##################
### Parameters ###
##################

# The 20 free rate/probability constants, bound by id (ADR-0034), on random log scales
# (as the classic conf). Rate constants:
loguniform_var = kp1 1e-6 1e2
loguniform_var = kp2 1e-6 1e2
loguniform_var = kpL 1e-6 1e2
loguniform_var = kmL 1e-6 1e2
loguniform_var = kpLs 1e-6 1e2
loguniform_var = kmLs 1e-6 1e2
loguniform_var = kpS 1e-6 1e2
loguniform_var = kmS 1e-6 1e2
loguniform_var = kpSs 1e-6 1e2
loguniform_var = kmSs 1e-6 1e2
# Phosphorylation/dephosphorylation constants:
loguniform_var = pLb 1e-4 1e4
loguniform_var = pLbs 1e-4 1e4
loguniform_var = pLg 1e-4 1e4
loguniform_var = pLgs 1e-4 1e4
loguniform_var = pLS 1e-4 1e4
loguniform_var = pLSs 1e-4 1e4
loguniform_var = pSS 1e-4 1e4
loguniform_var = pSSs 1e-4 1e4
loguniform_var = dm 1e-4 1e4
loguniform_var = dc 1e-4 1e4
