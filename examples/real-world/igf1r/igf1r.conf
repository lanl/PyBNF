# IGF1R activation -- deterministic ODE, competition dose-response (parameter scan).
#
# Real-world example, PyBNF 2019 paper corpus (Mitra et al., iScience 2019; originally
# Erickson et al., fit with BioNetFit 1). Edition-2 twin of examples/igf1r/igf1r.conf.
#
# A radioligand competition assay: labelled ("hot") IGF1 is held fixed while unlabelled
# ("cold") IGF1 is titrated; the readout is hot-ligand binding vs. cold dose. The fit
# recovers the two site affinities K1, K2 and the cross-site cooperativity K1prime.
# Expressed as a parameter scan over the cold-ligand concentration IGF1_cold_conc (the
# data's independent-variable column), each dose run to a fixed endpoint t_end = 14400 s.
#
# The classic model reset+re-asserted the hot-ligand copy number (8852) before the scan;
# that equals the model's own seed default (7 pM -> 8852.5 copies), so the edition-2 model
# simply carries no actions block and the scan starts from the seed state each dose.
#
# Run from the repo root:
#   pybnf -c examples/real-world/igf1r/igf1r.conf

output_dir = output/real-world/igf1r

edition = 2
bngl_backend = bngsim

model: igf1r.bngl

#######################
### Fitting Options ###
#######################

# Scatter Search (as the classic conf).
job_type = ss

# F5B.exp carries per-point _SD columns -> chi_sq.
objective = chi_sq

# Normalize the simulated observable to its initial value before comparison (the data are
# reported relative to the no-competitor baseline). Whole-fit form (every observable).
normalization = init

max_iterations = 50
population_size = 12
verbosity = 2

# Refine the best fit with a local Simplex search (as the classic conf).
refine = 1
simplex_max_iterations = 20

###################
### Experiment ###
###################

# Dose-response: a parameter scan over IGF1_cold_conc (the data's independent-variable
# column), each dose integrated to t_end = 14400 s. Observable IGF1_hot_bound.
experiment: F5B, type: parameter_scan, t_end: 14400, data: F5B.exp

##################
### Parameters ###
##################

# The two site affinities (M) and the cross-site cooperativity (dimensionless), bound by
# id (ADR-0034), on a random log scale (as the classic conf).
loguniform_var = K1 1e-15 1
loguniform_var = K2 1e-15 1
loguniform_var = K1prime 1e-15 1
