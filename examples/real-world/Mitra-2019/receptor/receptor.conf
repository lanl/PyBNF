# Ligand/receptor binding + phosphorylation -- deterministic ODE with pre-equilibration.
#
# Real-world example, PyBNF 2019 paper corpus (Mitra et al., iScience 2019; the same
# problem as BioNetFit 1, example 5), on the edition-2 surface. Twin of the classic
# examples/receptor/receptor.conf.
#
# The receptor equilibrates WITHOUT ligand (receptors dimerize and phosphorylate even
# before ligand is added, so receptor.exp's t=0 pR = 3670 is not a no-op), then ligand
# is added for the measured phase. Two conditions name those two states; the experiment
# equilibrates under `noligand` (unmeasured, to steady state) and measures under
# `withligand`. PyBNF synthesizes the two-phase action (steady-state equilibration ->
# setParameter -> measurement over the data grid; state carried across the phases with
# no reset -- ADR-0052).
#
# Run from the repo root:
#   pybnf -c examples/real-world/Mitra-2019/receptor/receptor.conf

output_dir = output

# Opt into the edition-2 config language.
edition = 2

# In-process bngsim backend.
bngl_backend = bngsim

# The model (no `begin actions` block -- the pre-equilibration protocol is synthesized).
model: receptor.bngl

# Ligand binding is gated by the model parameter Ligand_isPresent (0 during equilibration,
# 1 for the measured phase). Two conditions name those two states.
condition: noligand,   perturbations: Ligand_isPresent = 0
condition: withligand, perturbations: Ligand_isPresent = 1

# One experiment: pre-equilibrate (noligand) -> perturb to withligand -> measure receptor.exp.
# receptor.exp's columns (RLbonds, pR) ARE the model observable names; its time column is the grid.
experiment: receptor, preequilibrate: noligand, condition: withligand, data: receptor.exp

#######################
### Fitting Options ###
#######################

# Scatter Search (as the classic conf).
job_type = ss

# receptor.exp carries NO _SD columns, so the objective is sum of squares.
objective = sos

max_iterations = 50
population_size = 12
verbosity = 2

##################
### Parameters ###
##################

# The 6 free rate constants, on a random log scale between 0.001 and 1000 (as receptor.conf).
# Under edition 2 they bind to the model parameter ids by name (ADR-0034) -- no __FREE marker.
loguniform_var = KD1 0.001 1000
loguniform_var = km1 0.001 1000
loguniform_var = K2RT 0.001 1000
loguniform_var = km2 0.001 1000
loguniform_var = kphos 0.001 1000
loguniform_var = kdephos 0.001 1000
