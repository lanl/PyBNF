# EGFR activation & clustering (Kozer et al. 2013) -- NETWORK-FREE (NFsim).
#
# Real-world example, PyBNF 2019 paper corpus (Mitra et al., iScience 2019; the same problem
# as BioNetFit 1, example 2). Edition-2 twin of examples/egfr_nf/egfr_nf.conf, and the
# network-free (NFsim) sibling of examples/real-world/egfr_ode (which is ODE).
#
# EGFR forms unbounded ectodomain-crosslinked oligomers, so the model is simulated network-free
# with NFsim (method: nf). The same two datasets are fit as in egfr_ode:
#   * timecourse   -- cluster density (pre2_time) and phospho-EGFR (pre4_time) vs. time at 30 nM.
#   * doseresponse -- a parameter scan over the ligand dose LT_nM: cluster density (pre1_dose)
#                     and phospho-EGFR (pre3_dose) vs. EGF dose, each dose run to t_end = 600 s.
# Both data files carry per-point _SD columns -> the chi_sq objective.
#
# Run from the repo root:
#   pybnf -c examples/real-world/egfr_nf/egfr_nf.conf

output_dir = output/real-world/egfr_nf

edition = 2
bngl_backend = bngsim

model: egfr_nf.bngl

#######################
### General Options ###
#######################

delete_old_files = 1
wall_time_sim = 3600

#######################
### Fitting Options ###
#######################

# Scatter Search (as the classic conf).
job_type = ss

# Gaussian noise, sigma read per point from the _SD columns.
objective = chi_sq

max_iterations = 50
population_size = 12
verbosity = 2

# Refine the best fit with a local Simplex search (as the classic conf).
refine = 1
simplex_max_iterations = 20

###################
### Experiments ###
###################

# Time course (independent variable `time`), simulated network-free: pre2_time, pre4_time at 30 nM.
# gml / complex are NFsim options (raise the global molecule limit and track molecular complexes)
# the large EGFR clustering state space needs, as the classic model set them.
experiment: timecourse, method: nf, gml: 1000000, complex: 1, data: timecourse.exp

# Dose-response: a network-free parameter scan over LT_nM (the data's independent-variable
# column), each dose run to t_end = 600 s. Observables pre1_dose, pre3_dose.
experiment: doseresponse, type: parameter_scan, method: nf, t_end: 600, gml: 1000000, complex: 1, data: doseresponse.exp

##################
### Parameters ###
##################

# Scaling factors, generated on a linear scale from 0x to 200x the published value.
uniform_var = alpha1_pre 0 5.12581E-05
uniform_var = alpha2_pre 0 5.66338E-05
uniform_var = alpha3_pre 0 8.99271E-05
uniform_var = alpha4_pre 0 5.60084E-05

# Rate constants, generated on a uniform log scale between 0.01x and 100x the published values.
loguniform_var = k_o 0.06 600
loguniform_var = k_c 0.016 160
loguniform_var = kaf 0.154 1540
loguniform_var = kar 0.0889 889
loguniform_var = chi_r 437 4370000
