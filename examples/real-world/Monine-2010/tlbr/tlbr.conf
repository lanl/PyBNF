# Trivalent-ligand / bivalent-receptor aggregation -- NETWORK-FREE (NFsim), dose-response.
#
# Real-world example, PyBNF 2019 paper corpus (Mitra et al., iScience 2019; the same problem
# as BioNetFit 1, example 3). Edition-2 twin of examples/tlbr/tlbr.conf.
#
# The trivalent-ligand model has no finite reaction network (aggregates grow unboundedly), so
# it is simulated network-free with NFsim (method: nf). The readout FL (bound-ligand fraction,
# scaled by 1/alpha) is measured across a titration of total ligand LTconc -- a parameter scan
# run to steady state at each dose.
#
# NOTE: the published fit used differential evolution with population_size = 250 on a cluster
# (each point is a network-free steady-state sim); this committed conf uses a smaller
# population so it runs on a workstation. Raise population_size to reproduce the paper.
#
# Run from the repo root:
#   pybnf -c examples/real-world/Monine-2010/tlbr/tlbr.conf

output_dir = output

edition = 2
bngl_backend = bngsim

model: tlbr.bngl

#######################
### General Options ###
#######################

# Kill a simulation and move on without it if it goes over 20 minutes.
wall_time_sim = 1200
delete_old_files = 1
output_every = 10

#######################
### Fitting Options ###
#######################

# Differential evolution (as the classic conf).
job_type = de

# Sum of squares (the scaled FL data carry no _SD columns).
objective = sos

max_iterations = 50
population_size = 50
verbosity = 2

# Average 3 network-free replicate runs per parameter set (stochastic NFsim output).
smoothing = 3

###################
### Experiment ###
###################

# Dose-response: a parameter scan over LTconc (the data's independent-variable column),
# each dose simulated network-free (method: nf) to a fixed endpoint t_end = 5000 s. (The
# classic model used steady_state=>1; NFsim cannot do a steady-state solve, so we integrate
# to t_end = 5000 s, the horizon the classic run used to reach steady state.)
experiment: tlbr, type: parameter_scan, method: nf, t_end: 5000, data: tlbr.exp

##################
### Parameters ###
##################

# Free parameters bound by id (ADR-0034). alpha (the FL scaling) on a linear scale; the two
# affinities K1, K2 on log scales (0.01x-100x the published values).
uniform_var = alpha 0.5 1.5
loguniform_var = K1 0.00467 46.7
loguniform_var = K2 0.8703 8703
