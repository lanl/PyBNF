# Ligand/receptor binding + phosphorylation -- NETWORK-FREE (NFsim), pre-equilibration.
#
# Real-world example, PyBNF 2019 paper corpus (Mitra et al., iScience 2019; the same problem
# as BioNetFit 1, example 6). Edition-2 twin of examples/receptor_nf/receptor_nf.conf, and
# the network-free (NFsim) sibling of examples/real-world/receptor (which is ODE).
#
# The receptor equilibrates WITHOUT ligand binding, then ligand is switched on for the
# measured phase. The classic model added ligand mid-protocol with setConcentration; edition-2
# conditions carry only setParameter, so receptor_nf.bngl instead gates ligand binding by the
# Ligand_isPresent parameter (0 -> 1). PyBNF synthesizes the two-phase action (network-free
# steady-state equilibration -> setParameter -> measurement over the data grid; ADR-0052).
#
# Run from the repo root:
#   pybnf -c examples/real-world/receptor_nf/receptor_nf.conf

output_dir = output/real-world/receptor_nf

edition = 2
bngl_backend = bngsim

model: receptor_nf.bngl

# Ligand binding is gated by Ligand_isPresent (0 during equilibration, 1 for the measured
# phase). Two conditions name those states.
condition: noligand,   perturbations: Ligand_isPresent = 0
condition: withligand, perturbations: Ligand_isPresent = 1

# One experiment: pre-equilibrate network-free (noligand) -> perturb to withligand -> measure.
# receptor_nf.exp's columns (RLbonds, pR) ARE the model observable names; method: nf selects NFsim.
# NFsim has no steady-state solve, so the equilibration runs for a FIXED 600 s (equil_t_end: 600) --
# the interval the classic model used -- rather than to steady state.
experiment: receptor_nf, preequilibrate: noligand, condition: withligand, method: nf, equil_t_end: 600, data: receptor_nf.exp

#######################
### Fitting Options ###
#######################

# Scatter Search (as the classic conf).
job_type = ss

# receptor_nf.exp carries no _SD columns -> sum of squares.
objective = sos

max_iterations = 50
population_size = 12
verbosity = 2

# Average 2 network-free replicate runs per parameter set (stochastic NFsim output).
smoothing = 2

##################
### Parameters ###
##################

# The 6 free rate constants, bound by id (ADR-0034), on a random log scale (as the classic conf).
loguniform_var = KD1 0.01 100
loguniform_var = km1 0.01 100
loguniform_var = K2RT 0.01 100
loguniform_var = km2 0.01 100
loguniform_var = kphos 0.01 100
loguniform_var = kdephos 0.01 100
