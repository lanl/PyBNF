# EGFR activation (Kozer et al. 2013) -- deterministic ODE, network-generating.
#
# Real-world example, PyBNF 2019 paper corpus (Mitra et al., "PyBioNetFit and the
# Biological Property Specification Language", iScience 2019), expressed on the
# edition-2 (new-era) config surface (ADR-0028/0034/0046). Twin of the classic
# examples/egfr_ode/egfr_ode.conf.
#
# The EGFR model is fit to BOTH a time course and a dose-response in one job:
#   * timecourse   -- cluster density (pre2_time) and phospho-EGFR (pre4_time) vs.
#                     time at fixed ligand dose LT = 30 nM.
#   * doseresponse -- a parameter scan over the ligand dose LT (ADR-0046): cluster
#                     density (pre1_dose) and phospho-EGFR (pre3_dose) vs. EGF dose,
#                     each dose run to a fixed endpoint t_end = 1200 s.
# Both data files carry per-point _SD columns -> the chi_sq objective.
#
# Run from the repo root:
#   pybnf -c examples/real-world/egfr_ode/egfr_ode.conf

output_dir = output/real-world/egfr_ode

# Opt into the edition-2 config language (PEtab-aligned experiment:/condition:/data:).
edition = 2

# In-process bngsim backend (the new-era default).
bngl_backend = bngsim

# The model (no `begin actions` block -- the experiments below synthesize the sims).
model: egfr_ode.bngl

#######################
### General Options ###
#######################

delete_old_files = 1
wall_time_sim = 3600

#######################
### Fitting Options ###
#######################

# Differential evolution (the paper compares DE/aDE/PSO/SS; DE here).
job_type = de

# Gaussian noise, sigma read per point from the _SD columns.
objective = chi_sq

max_iterations = 50
population_size = 12
verbosity = 2

###################
### Experiments ###
###################

# Time course (independent variable `time`): observables pre2_time, pre4_time at LT = 30 nM.
experiment: timecourse, data: timecourse.exp

# Dose-response: a parameter scan over the ligand dose LT (the data's independent-variable
# column). Each dose runs to a fixed endpoint t_end = 1200 s. Observables pre1_dose, pre3_dose.
experiment: doseresponse, type: parameter_scan, t_end: 1200, data: doseresponse.exp

##################
### Parameters ###
##################

# Scaling factors, generated on a linear scale from 0x to 200x the published value.
uniform_var = alpha2_pre 0 60.428898
uniform_var = alpha4_pre 0 57.459326
uniform_var = alpha1_pre 0 52.4578514
uniform_var = alpha3_pre 0 82.9043918

# Rate constants, generated on a uniform log scale between 0.01x and 100x the published values.
loguniform_var = k_o 0.06 600
loguniform_var = k_c 0.016 160
loguniform_var = kaf 0.154 1540
loguniform_var = kar 0.0889 889
loguniform_var = chi_r 437 4370000
