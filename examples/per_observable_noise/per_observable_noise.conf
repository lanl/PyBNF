# Per-observable noise models (PyBNF >= 1.5; issue #410)
#
# This example shows how to give different observables their own noise model in a
# single fit. The parabola model outputs two observables, x and y; we score them
# with two DIFFERENT noise models:
#
#   x : ordinary Gaussian (chi-square) noise, with sigma supplied per data point
#       in the x_SD column of par1.exp.
#   y : Laplace (heavy-tailed, outlier-robust) noise, with its scale b estimated
#       as a free parameter during the fit.
#
# Run from the PyBNF root directory:  pybnf -c examples/per_observable_noise/per_observable_noise.conf

# The directory to which job output will be written
output_dir = output/per_observable_noise

# Model specification
model = parabola.bngl : par1.exp

# BNG command - uncomment and edit if you have not set the BNGPATH environment variable
# bng_command = /path/to/bng2/BNG2.pl

# Algorithm and the GLOBAL (default) objective function. objfunc applies to every
# observable that is not overridden by a noise_model key below.
fit_type = de
objfunc = chi_sq

# --- Per-observable noise overrides (issue #410) ----------------------------
#
# Syntax:  noise_model <observable> = <family>, <parameter> = <source>
#
#   <family>    : normal | lognormal | laplace | neg_bin
#   <parameter> : the family's standard name -- sigma (normal/lognormal),
#                 scale (laplace), or dispersion (neg_bin)
#   <source>    : read_exp_file <suffix>   read it per point from the data column
#                                          <observable><suffix> (conventionally _SD)
#               | fit <name>__FREE         estimate it as a free parameter
#               | fix_at <number>          hold it at a fixed constant
#
# x: spell out the global chi_sq default explicitly -- Gaussian noise with sigma
#    read from the x_SD column. (This line is optional; without it x would use the
#    objfunc default, which is the same thing.)
noise_model x = normal,  sigma = read_exp_file _SD

# y: outlier-robust Laplace noise whose scale b_y is fit as a free parameter.
#    (You could instead write `scale = fix_at 2.0` for a fixed scale, or
#    `scale = read_exp_file _SD` to read it per point from a y_SD column.)
noise_model y = laplace, scale = fit b_y__FREE

# --- Free parameters --------------------------------------------------------
# The three parabola coefficients (these appear as v#__FREE in parabola.bngl):
uniform_var = v1__FREE 0 10
uniform_var = v2__FREE 0 10
uniform_var = v3__FREE 0 10

# The Laplace noise scale for y, referenced by the noise_model key above. It is a
# free parameter like any other (declared in both this file and the model file):
uniform_var = b_y__FREE 0.1 5

# Differential Evolution parameters
population_size = 20
max_iterations = 30

# Print output to the command line
verbosity = 2
