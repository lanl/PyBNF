# Per-observable noise models on the new-era (edition 2) config surface
# (issue #410, ADR-0021/0022; the new-era surface is ADR-0028).
#
# This is the edition-2 twin of per_observable_noise.conf: the same fit -- two
# observables (x, y) scored with two DIFFERENT noise models in a single run --
# written on the modern surface (`model:` / `experiment:` / `data:`, `job_type`
# not `fit_type`, `objective` not `objfunc`, free parameters bound by id).
#
#   x : ordinary Gaussian (chi-square) noise, sigma supplied per data point in
#       the x_SD column of par1.exp.
#   y : Laplace (heavy-tailed, outlier-robust) noise, scale b_y estimated as a
#       free parameter during the fit.
#
# Run from the PyBNF root directory:
#   pybnf -c examples/per_observable_noise/per_observable_noise_v2.conf

# The directory to which job output will be written
output_dir = output/per_observable_noise_v2

# Opt into the new era (select-and-freeze; ADR-0031)
edition = 2

# Model declaration (no data binds here; data is introduced by the experiment below).
# parabola_v2.bngl is parabola.bngl with bare-id parameters and no `begin actions`
# block -- the simulation is synthesized from the experiment.
model: parabola_v2.bngl

# Algorithm and the GLOBAL (default) objective function. objective applies to every
# observable that is not overridden by a noise_model key below.
job_type = de
objective = chi_sq

# Experiment: a named simulation bound to its measurement file (a wildtype time
# course; the experiment name is the PEtab experimentId; simulation times come
# from the data's time column).
experiment: par1, data: par1.exp

# --- Per-observable noise overrides (issue #410) ----------------------------
#
# Syntax:  noise_model <observable> = <family>, <parameter> = <source>
#
# x: spell out the global chi_sq default explicitly -- Gaussian noise with sigma
#    read from the x_SD column. (Optional; without it x uses the objective default,
#    which is the same thing.)
noise_model x = normal,  sigma = read_exp_file _SD

# y: outlier-robust Laplace noise whose scale b_y is fit as a free parameter.
noise_model y = laplace, scale = fit b_y

# --- Free parameters --------------------------------------------------------
# The three parabola coefficients (bound by id to v1/v2/v3 in parabola_v2.bngl):
uniform_var = v1 0 10
uniform_var = v2 0 10
uniform_var = v3 0 10

# The Laplace noise scale for y, referenced by the noise_model key above. It is a
# free parameter like any other, but a pure observation-layer nuisance (not a model
# parameter) -- declared here only, never in the model file.
uniform_var = b_y 0.1 5

# Differential Evolution parameters
population_size = 20
max_iterations = 30

# Print output to the command line
verbosity = 2
