# The SBML demo fitting job, written entirely on the new-era (edition 2) config surface
# (ADR-0028) -- the twin of demo_bng_v2.conf for the SBML path, and the install check the
# Quick Start runs. The model is declared with `model:`, its data is introduced by a named
# `experiment:`, the run is named with `job_type` (not the legacy `fit_type`) and the
# objective with `objective` (not the legacy `objfunc`). demo_xml.conf is the legacy
# (edition 1) form of this same job, kept for reference.

# The directory to which job output will be written
output_dir=output/demo_xml_v2

# Opt into the new era (select-and-freeze; ADR-0031)
edition = 2

# Model declaration (no data binds here; data is introduced by the experiment below)
model: parabola.xml

# Algorithm and objective (modern surface: `job_type` not `fit_type`, `objective` not
# `objfunc`)
job_type = de
objective = chi_sq

# Experiment: a named simulation bound to its measurement file. The data's columns are the
# SBML species `x` and `y`, and its time points become the simulation's output points --
# so, unlike the legacy demo_xml.conf, no separate `time_course` line is needed.
experiment: par1, data: par1.exp

# Parameters (each free parameter binds to the model parameter of the same id)
uniform_var = v1 0 10
uniform_var = v2 0 10
uniform_var = v3 0 10

# Differential Evolution Parameters
population_size = 20
max_iterations = 30

# Print output to command line
verbosity = 2
