# The demo fitting job, written on the new-era (edition 2) config surface: the
# objective is named with the modern `objective` key instead of the legacy `objfunc`.
# This is the form the PEtab v2 exporter accepts (PEtab v2 interop is a new-era
# feature; see ADR-0031). The fitter runs this identically to demo_bng.conf.

# The directory to which job output will be written
output_dir=output/demo_bng_v2

# Opt into the new era (select-and-freeze; ADR-0031)
edition = 2

# Model specification
model = parabola.bngl : par1.exp

# Algorithm and objective (modern surface: `objective`, not `objfunc`)
fit_type = de
objective = chi_sq

# Parameters
uniform_var = v1__FREE 0 10
uniform_var = v2__FREE 0 10
uniform_var = v3__FREE 0 10

# Differential Evolution Parameters
population_size = 20
max_iterations = 30

# Print output to command line
verbosity = 2
