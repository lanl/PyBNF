# The demo fitting job, written entirely on the new-era (edition 2) config surface
# (ADR-0028): the model is declared with `model:`, the data is bound through a named
# `experiment:` carrying its `data:` files, the run is named with `job_type` (not the
# legacy `fit_type`), and the objective with `objective` (not the legacy `objfunc`). This
# is the form the PEtab v2 exporter reads as transcription (experiment: -> Experiment,
# data: -> measurements), and the shape the future PEtab importer generates. The fitter
# runs it identically to demo_bng.conf: the simulation is synthesized from the experiment
# (its data's time points become the output points), so the model needs no `begin
# actions` block (parabola_v2.bngl is parabola.bngl without one).

# The directory to which job output will be written
output_dir=output/demo_bng_v2

# Opt into the new era (select-and-freeze; ADR-0031)
edition = 2

# Model declaration (no data binds here; data is introduced by the experiment below)
model: parabola_v2.bngl

# Algorithm and objective (modern surface: `job_type` not `fit_type`, `objective` not
# `objfunc`)
job_type = de
objective = chi_sq

# Experiment: a named simulation bound to its measurement file (a wildtype time course;
# the experiment name is the PEtab experimentId; simulation times come from the data)
experiment: par1, data: par1.exp

# Parameters (new-era binds each free parameter to the model parameter of the same id;
# no `__FREE` marker -- ADR-0034)
uniform_var = v1 0 10
uniform_var = v2 0 10
uniform_var = v3 0 10

# Differential Evolution Parameters
population_size = 20
max_iterations = 30

# Print output to command line
verbosity = 2
