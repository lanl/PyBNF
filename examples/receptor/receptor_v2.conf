# receptor_v2.conf -- edition-2 (new-era) form of receptor.conf (ADR-0052, #440).
#
# The same fit as BioNetFit 1, example 5 (and receptor.conf), but expressed on the new-era
# experiment:/condition: surface. The pre-equilibration protocol receptor.bngl kept in a
# hand-written `begin actions` block (equilibrate ~600 s WITHOUT ligand to steady state ->
# setParameter("Ligand_isPresent",1) -> measure 60 s) is now SYNTHESIZED from the
# `experiment: ... preequilibrate: noligand, condition: withligand` line below: PyBNF emits a
# two-phase action (steady-state equilibration -> setParameter -> measurement over the data grid).

#############
### PATHS ###
#############

# The directory to which job output will be written
output_dir=output/receptor_v2

#######################
### New-era surface ###
#######################

# Opt into the edition-2 config language (PEtab-aligned experiment:/condition:/data:).
edition = 2

# The model (no `begin actions` block -- the simulation is synthesized from the experiment).
model: receptor_v2.bngl

# The receptor equilibrates WITHOUT ligand (the model default Ligand_isPresent=0), then ligand
# is added for the measured phase. Two conditions name those two states; the experiment
# equilibrates under `noligand` (unmeasured, to steady state) and measures under `withligand`.
condition: noligand,   perturbations: Ligand_isPresent = 0
condition: withligand, perturbations: Ligand_isPresent = 1

# One experiment: pre-equilibrate (noligand) -> perturb to withligand -> measure receptor.exp.
# receptor.exp's columns (RLbonds, pR) ARE the model observable names, so no observable: override
# is needed; its time column is the measurement grid.
experiment: receptor, preequilibrate: noligand, condition: withligand, data: receptor.exp

#######################
### Fitting Options ###
#######################

# bngsim backend (the new-era default assumes in-process bngsim).
bngl_backend = bngsim

# Which algorithm to use -- Scatter Search (as receptor.conf).
job_type = ss

# receptor.exp carries NO _SD columns, so the objective is sum of squares (not chi_sq).
objective = sos

# The maximum number of iterations to run.
max_iterations = 50

# Scatter search maintains a population of size 12 (12*11 = 132 simulations per iteration).
population_size = 12

# Print verbose output to the command line
verbosity = 2

# The 6 free rate constants, on a random log scale between 0.001 and 1000 (as receptor.conf).
# Under edition 2 they bind to the model parameter ids by name (ADR-0034) -- no __FREE marker.
loguniform_var = KD1 0.001 1000
loguniform_var = km1 0.001 1000
loguniform_var = K2RT 0.001 1000
loguniform_var = km2 0.001 1000
loguniform_var = kphos 0.001 1000
loguniform_var = kdephos 0.001 1000
