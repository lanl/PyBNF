# =============================================================================
#  One model, many conditions: fit a wildtype AND a knockout with ONE model file
# =============================================================================
#  You measured the same reaction A <-> B in two biological conditions: wildtype
#  cells (both rates active) and a knockout that ablates the reverse reaction. The
#  old way was to copy the model file once per genotype (reversible.bngl,
#  knockout.bngl, ...) and fit them as separate models. The PEtab-aligned way --
#  edition-2 "Mechanism A" -- keeps ONE model and names each condition as a
#  `condition:` perturbation, then binds each experiment to its condition:
#
#      condition:  ko, perturbations: kr = 0        # the reverse-reaction knockout
#      experiment: wildtype,               data: wildtype.exp   # no condition -> as written
#      experiment: knockout, condition: ko, data: knockout.exp  # kr forced to 0
#
#  Both experiments share the fitted (kf, kr). The wildtype relaxation sees kf+kr
#  and the equilibrium ratio; the knockout runs irreversibly to A0 at rate kf --
#  together they pin both rates from ONE model.
#
#  Only the scored (experiment, its own condition) pairs are simulated: `wildtype`
#  under no condition and `knockout` under `ko`. PyBNF does NOT run the off-diagonal
#  combinations (wildtype-under-ko, knockout-under-nothing) -- they are never scored,
#  so they are never computed (lanl/PyBNF#484).
#
#        pybnf -c condition_perturbations.conf
# -----------------------------------------------------------------------------

output_dir = output/condition_perturbations

edition = 2
model: reversible_conversion.bngl
bngl_backend = bngsim

job_type = de
objective = chi_sq

# The reverse-reaction knockout, as a named perturbation on the one model.
condition: ko, perturbations: kr = 0

# Two experiments on the one model: the wildtype (the reaction as written) and the
# knockout (measured with the reverse reaction ablated). Each is its own time course
# of Obs_B; both share the fitted (kf, kr).
experiment: wildtype,               data: wildtype.exp
experiment: knockout, condition: ko, data: knockout.exp

uniform_var = kf  0.05  3.0
uniform_var = kr  0.02  2.0

population_size = 24
max_iterations = 60
refine = 1
verbosity = 1
