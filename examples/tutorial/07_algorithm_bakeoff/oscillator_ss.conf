# =============================================================================
#  Bake-off entrant 6/6:  Scatter Search                    job_type = ss
# =============================================================================
#  SCATTER SEARCH keeps a small, deliberately DIVERSE "reference set" of good and
#  scattered solutions, systematically combines pairs of them, and locally
#  improves each combination. Because every combination is polished by a built-in
#  local search, it does much more work per iteration than the other five -- so it
#  needs a far smaller nominal budget to reach the same answer (note the reduced
#  population_size / max_iterations below). It is the most methodical searcher of
#  the six, trading raw iterations for structure.
#
#        pybnf -c oscillator_ss.conf
# -----------------------------------------------------------------------------

output_dir = output/oscillator_ss

edition = 2
model: oscillator.bngl
bngl_backend = bngsim

job_type = ss
objective = sos

experiment: timecourse, data: oscillator.exp

uniform_var = alpha  0.1  5.0
uniform_var = gamma  0.1  5.0

# Smaller budget than the other five: scatter search's per-iteration local
# improvement makes each iteration much more expensive (and more effective).
population_size = 10
max_iterations = 16
refine = 1
verbosity = 1
