# =============================================================================
#  Bake-off entrant 1/6:  Differential Evolution            job_type = de
# =============================================================================
#  Six optimizers, one oscillatory landscape (see README.md). Each .conf here is
#  IDENTICAL except for the `job_type` line and the search budget -- so you can
#  run them side by side and watch how different global search strategies handle
#  the same rugged (alpha, gamma) error surface.
#
#  DIFFERENTIAL EVOLUTION keeps a population of candidate parameter sets and
#  proposes each child by adding the scaled difference of two random members to a
#  third. It is the robust, general-purpose default -- no gradients, few knobs.
#
#        pybnf -c oscillator_de.conf
# -----------------------------------------------------------------------------

output_dir = output/oscillator_de

edition = 2
model: oscillator.bngl
bngl_backend = bngsim

job_type = de
objective = sos

experiment: timecourse, data: oscillator.exp

uniform_var = alpha  0.1  5.0
uniform_var = gamma  0.1  5.0

population_size = 24
max_iterations = 50
refine = 1
verbosity = 1
