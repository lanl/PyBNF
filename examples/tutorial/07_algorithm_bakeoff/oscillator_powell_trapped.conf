# =============================================================================
#  Bake-off addendum:  Powell from a BAD start  --  trapped       job_type = powell
# =============================================================================
#  Same local optimizer as oscillator_powell.conf, started from a guess in the
#  WRONG basin (var = alpha 3.0, gamma 3.0 -- a frequency far from the truth).
#  Powell descends into the nearest local minimum and STAYS there: it lands on an
#  aliased-frequency solution, nowhere near (alpha, gamma) = (1.2, 0.8).
#
#  This is the cautionary half of the Powell story, and the whole motivation for
#  the six global methods above: a local optimizer is only as good as its starting
#  point on a landscape like this. Run it and compare the recovered (alpha, gamma)
#  with oscillator_powell.conf's.
#
#        pybnf -c oscillator_powell_trapped.conf
# -----------------------------------------------------------------------------

output_dir = output/oscillator_powell_trapped

edition = 2
model: oscillator.bngl
bngl_backend = bngsim

job_type = powell
objective = sos

experiment: timecourse, data: oscillator.exp

# A start point in the WRONG basin -- Powell cannot climb out.
var = alpha  3.0
var = gamma  3.0

population_size = 1
max_iterations = 50
verbosity = 1
