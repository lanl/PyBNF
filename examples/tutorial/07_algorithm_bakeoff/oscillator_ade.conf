# =============================================================================
#  Bake-off entrant 2/6:  Asynchronous Differential Evolution   job_type = ade
# =============================================================================
#  Same differential-evolution moves as `de`, but ASYNCHRONOUS: instead of
#  evaluating a whole generation and then moving on, it updates the population as
#  soon as each individual simulation finishes. On a busy cluster that keeps every
#  worker fed (no waiting for the slowest member of a generation), so it often
#  reaches a good fit in less wall-clock time than synchronous `de`.
#
#        pybnf -c oscillator_ade.conf
# -----------------------------------------------------------------------------

output_dir = output/oscillator_ade

edition = 2
model: oscillator.bngl
bngl_backend = bngsim

job_type = ade
objective = sos

experiment: timecourse, data: oscillator.exp

uniform_var = alpha  0.1  5.0
uniform_var = gamma  0.1  5.0

population_size = 24
max_iterations = 50
refine = 1
verbosity = 1
