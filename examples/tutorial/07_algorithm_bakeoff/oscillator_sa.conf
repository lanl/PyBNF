# =============================================================================
#  Bake-off entrant 5/6:  Simulated Annealing              job_type = sa
# =============================================================================
#  SIMULATED ANNEALING is the odd one out: not a population but a single walker
#  that proposes a random step and accepts it always if it improves the fit, or
#  with a temperature-dependent probability if it worsens it. Early on (hot) it
#  wanders freely across the ridges; as the temperature cools it settles into a
#  basin. The willingness to go uphill is exactly what lets it escape a local
#  minimum at a wrong frequency.
#
#        pybnf -c oscillator_sa.conf
# -----------------------------------------------------------------------------

output_dir = output/oscillator_sa

edition = 2
model: oscillator.bngl
bngl_backend = bngsim

job_type = sa
objective = sos

experiment: timecourse, data: oscillator.exp

uniform_var = alpha  0.1  5.0
uniform_var = gamma  0.1  5.0

# For annealing, `population_size` is the number of independent walkers and
# `max_iterations` the steps each takes as the temperature cools.
population_size = 24
max_iterations = 50
refine = 1
verbosity = 1
