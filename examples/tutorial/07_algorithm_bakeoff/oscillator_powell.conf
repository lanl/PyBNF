# =============================================================================
#  Bake-off addendum:  Powell  --  the LOCAL contrast            job_type = powell
# =============================================================================
#  The six confs above (de/ade/pso/cmaes/sa/ss) are GLOBAL metaheuristics: they
#  scatter a population across the whole (alpha, gamma) box and climb back out of
#  wrong-frequency local minima. POWELL is the opposite kind of optimizer -- a
#  LOCAL, derivative-free method (conjugate-direction line searches, a cousin of
#  Simplex). It starts from a SINGLE point and descends. Fast and frugal, but it
#  has no way to escape the basin it starts in.
#
#  So a start-point optimizer takes a single initial GUESS per parameter with
#  `var` (not a search range with `uniform_var`):
#
#        var = alpha 1.3        # one starting value, not a box
#        var = gamma 0.9
#
#  From a guess already in the right basin, Powell walks straight to the true
#  optimum (alpha = 1.2, gamma = 0.8) in a handful of evaluations -- cheaper than
#  any of the global searches. But from a guess in the wrong basin it gets TRAPPED
#  at an aliased frequency: see oscillator_powell_trapped.conf. That is the whole
#  reason the bake-off uses global methods -- and why Powell is most useful as a
#  fast REFINER after a global search has found the basin (it is a valid
#  `refine_method`), or when you already have a good starting estimate.
#
#        pybnf -c oscillator_powell.conf
# -----------------------------------------------------------------------------

output_dir = output/oscillator_powell

edition = 2
model: oscillator.bngl
bngl_backend = bngsim

job_type = powell
objective = sos

experiment: timecourse, data: oscillator.exp

# A start-point optimizer: ONE initial value per parameter (var), in the right
# basin. (uniform_var search ranges are for the global optimizers above.)
var = alpha  1.3
var = gamma  0.9

population_size = 1     # Powell is single-start (it evaluates one point at a time)
max_iterations = 50     # cycle budget
verbosity = 1
