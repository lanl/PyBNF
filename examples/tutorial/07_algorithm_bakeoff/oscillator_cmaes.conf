# =============================================================================
#  Bake-off entrant 4/6:  CMA-ES                            job_type = cmaes
# =============================================================================
#  COVARIANCE MATRIX ADAPTATION EVOLUTION STRATEGY samples each generation from a
#  multivariate Gaussian, then adapts that Gaussian's mean, scale, and -- crucially
#  -- its full covariance to the shape of the local landscape. It effectively
#  learns the correlation between alpha and gamma (both feed the frequency
#  sqrt(alpha*gamma)), so it can march efficiently along a diagonal valley that
#  axis-aligned methods cross awkwardly. Often the most sample-efficient of the six
#  on a smooth-but-correlated basin.
#
#        pybnf -c oscillator_cmaes.conf
# -----------------------------------------------------------------------------

output_dir = output/oscillator_cmaes

edition = 2
model: oscillator.bngl
bngl_backend = bngsim

job_type = cmaes
objective = sos

experiment: timecourse, data: oscillator.exp

uniform_var = alpha  0.1  5.0
uniform_var = gamma  0.1  5.0

population_size = 24
max_iterations = 50
refine = 1
verbosity = 1
