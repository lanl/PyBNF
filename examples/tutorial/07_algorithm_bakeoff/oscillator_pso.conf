# =============================================================================
#  Bake-off entrant 3/6:  Particle Swarm Optimization       job_type = pso
# =============================================================================
#  PARTICLE SWARM flies a swarm of candidates through parameter space, each pulled
#  toward its own best-seen position and the swarm's global best, with momentum.
#  The momentum lets particles coast across the oscillatory ridges of this
#  landscape instead of getting trapped in the first dip they meet -- a different
#  escape mechanism from DE's difference vectors.
#
#        pybnf -c oscillator_pso.conf
# -----------------------------------------------------------------------------

output_dir = output/oscillator_pso

edition = 2
model: oscillator.bngl
bngl_backend = bngsim

job_type = pso
objective = sos

experiment: timecourse, data: oscillator.exp

uniform_var = alpha  0.1  5.0
uniform_var = gamma  0.1  5.0

population_size = 24
max_iterations = 50
refine = 1
verbosity = 1
