# =============================================================================
#  Adaptive Metropolis on a correlated posterior            job_type = am
# =============================================================================
#  Lesson 26 ran the two NON-adaptive samplers (mh, pt): you choose one `step_size`
#  and it serves every parameter for the whole run. That crawls on a TILTED
#  posterior, where a good step along one axis is a bad step along the correlated
#  diagonal. ADAPTIVE METROPOLIS (`am`) fixes this: after a warm-up it estimates
#  the covariance of the draws it has taken so far and proposes new moves from THAT
#  covariance -- so its proposals run along the ridge instead of across it. You set
#  an initial `step_size`; the covariance adaptation does the rest.
#
#  The posterior here is deliberately correlated. We fit the two-species harmonic
#  oscillator's constant fluxes k4 (S1 removal) and k6 (S2 synthesis). Both shift
#  the oscillation's DC baseline (S1_offset = (k6-k4)/kd, S2_offset = k4/k2 -
#  S1_offset), so the data pins their COMBINATION far tighter than either alone:
#  a long, tilted, positively-correlated (k4, k6) ridge.
#
#  am writes raw draws to Results/A_MCMC/Runs/params_<chain>.txt (NOT samples.txt),
#  and -- unlike mh/pt -- writes NO credible intervals. To diagnose convergence you
#  build an ArviZ InferenceData BY HAND from those per-chain files and read R-hat /
#  ESS; see README.md for the ~10-line recipe.
#
#        pybnf -c adaptive_covariance.conf
# -----------------------------------------------------------------------------

output_dir = output/adaptive_covariance

edition = 2
model: two_species_oscillator.bngl
bngl_backend = bngsim

job_type = am
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: two_species_oscillator.exp

# Uniform priors on the two constant fluxes (truth k4 = 41.77, k6 = 92.2).
uniform_var = k4  30.0  55.0
uniform_var = k6  75.0  110.0

# --- Sampler settings ---
population_size = 8       # 8 independent chains (R-hat compares between chains)
max_iterations  = 3000    # steps per chain
burn_in         = 1000    # discard warm-up; covariance adaptation begins here
adaptive        = 800     # length of the covariance-adaptation window
sample_every    = 3       # thin every 3rd post-burn-in step
step_size       = 0.2     # INITIAL proposal scale -- am adapts away from it

# PyBNF's own native R-hat/ESS diagnostics (ADR-0009); set the threshold to let a
# run stop early once the chains agree. The lesson reads R-hat/ESS via ArviZ too.
rhat_threshold  = 1.05

verbosity   = 0
random_seed = 1234
