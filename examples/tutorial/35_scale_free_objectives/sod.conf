# =============================================================================
#  Scale-free objectives -- sod
# =============================================================================
#  Fit the decay rate k from data spanning three orders of magnitude with 15%
#  MULTIPLICATIVE noise. This conf uses:
#
#        objective = sod
#
#  sum of ABSOLUTE differences (L1) -- a linear penalty, less dominated by large residuals than L2.
#
#  Compare the recovered k across sos.conf / norm_sos.conf / sod.conf /
#  ave_norm_sos.conf: only a per-point RELATIVE objective (norm_sos) uses the
#  informative small-magnitude tail, so only it recovers k = 0.4 cleanly. See the
#  README for what each objective does and when to reach for it.
#
#        pybnf -c sod.conf
# -----------------------------------------------------------------------------

output_dir = output/sod

edition = 2
model: decay.bngl
bngl_backend = bngsim

job_type = de
objective = sod

experiment: timecourse, data: decay.exp

uniform_var = k  0.02  3.0

population_size = 24
max_iterations  = 60
refine = 1

verbosity = 0
random_seed = 1234
