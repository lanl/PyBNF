# Lesson 50: forecasting counts as they arrive with the Liu–West filter (job_type = lwf).
# Before each day's count the filter moves every particle's free parameters by the kernel,
# integrates the particle's own model state over the day and weighs it by the likelihood of
# the count; after the last row it forecasts. The output is a forecasting sample of a model
# whose free parameters drift at each row, not a posterior (for that, use am; lesson 39).
#
#     pybnf -c liu_west_filter.conf

output_dir = output/liu_west_filter

edition = 2
model: sir_outbreak.bngl
# A segment starts from a carried state, which bngsim can do and BNG2.pl cannot.
bngl_backend = bngsim

job_type = lwf

# The whole-fit line edition 2 requires, and the column's own line, whose cumulative flag
# (lesson 28) scores each row against the increase of `cases` over that day.
noise_model = neg_bin, dispersion = fit r, location = mean
noise_model cases = neg_bin, dispersion = fit r, location = mean, cumulative

# One time course: rows one day apart, the first one day after t = 0.
experiment: outbreak, data: cases.exp

# The prior. Each parameter keeps its box (reflecting bounds) for the whole run.
loguniform_var = beta  0.1  2
loguniform_var = I0    1    200
loguniform_var = r     1    100

lwf_particles = 2000

# h is part of the model sampled: how fast each free parameter may drift. 0.15 is the
# default; r gets a smaller h of its own.
lwf_jitter = 0.15
lwf_parameter_jitter = r 0.05

# Resample when the weight ESS falls below half the particles; forecast a week.
lwf_resample_threshold = 0.5
lwf_forecast_intervals = 7

# Every draw comes from this seed, through streams keyed on each row's time.
random_seed = 1
