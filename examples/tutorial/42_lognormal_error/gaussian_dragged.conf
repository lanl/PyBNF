# =============================================================================
#  The cautionary contrast:  a Gaussian fit on multiplicative-error data
#                                                     noise_model = normal
# =============================================================================
#  This is lognormal.conf with ONE line changed: an ordinary Gaussian noise model
#  (constant sigma on the LINEAR scale) instead of lognormal. It is the wrong model
#  for multiplicative error, and it is DRAGGED off the truth.
#
#        noise_model = normal, sigma = fix_at 1
#
#  A constant-sigma Gaussian scores the residual (prediction - data) on the linear
#  scale, so its sum-of-squares is dominated by the LARGE-magnitude points -- here
#  the plateau around 30, whose 20% multiplicative noise is +/-6 in absolute terms.
#  The informative washout tail (values near 0.05, whose absolute scatter is tiny)
#  is effectively ignored -- yet the tail's slope is exactly what pins the
#  elimination rate `kel`. So the Gaussian fit chases the noisy plateau and misses
#  kel, while lognormal.conf weights every point equally in log space and recovers it.
#
#  Run both and compare the fitted kel.
#
#        pybnf -c gaussian_dragged.conf
# -----------------------------------------------------------------------------

output_dir = output/gaussian_dragged

edition = 2
model: infusion_washout.bngl
bngl_backend = bngsim

job_type = de

# An ordinary Gaussian with a constant (linear-scale) sigma -- unweighted least
# squares, dominated by the large-magnitude points.
noise_model = normal, sigma = fix_at 1

experiment: timecourse, data: infusion_washout.exp

uniform_var = kel  0.05  3.0

population_size = 24
max_iterations = 50
refine = 1
verbosity = 1
random_seed = 1234
