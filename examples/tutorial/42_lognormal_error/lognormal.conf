# =============================================================================
#  Multiplicative measurement error:  the lognormal noise model
#                                                     noise_model = lognormal
# =============================================================================
#  Lesson 08 covered additive noise families (gaussian / laplace / student_t):
#  the scatter is the same SIZE at every point. But many measurements -- assays,
#  concentrations, anything read across orders of magnitude -- have scatter that
#  is a constant FRACTION of the value: a 20% error means +/-6 on a reading of 30
#  and +/-0.01 on a reading of 0.05. That is MULTIPLICATIVE (lognormal) error, and
#  it is the natural model for data spanning orders of magnitude.
#
#        noise_model = lognormal, sigma = fix_at 0.2, location = mean
#
#  `lognormal` is the Gaussian family moved onto the LOG10 scale: it scores the
#  residual between log10(prediction) and log10(data), so a constant `sigma` there
#  is a constant RELATIVE error (here sigma = 0.2 on a log10 scale, ~ a factor of
#  10**0.2 = 1.6). Every point -- the tall plateau and the tiny tail alike -- gets
#  equal weight, because in log space they have the same spread.
#
#  `location = mean` (STRONGLY RECOMMENDED, as for neg_bin): the ODE computes the
#  MEAN of the measurement, but the lognormal is right-skewed so its mean and median
#  differ, and the family DEFAULTS to `median`. Saying `location = mean` applies the
#  mean-alignment correction (mu = log10(pred) - sigma^2*ln10/2) so the prediction is
#  read as the data's mean -- the correct interpretation for real work. (The effect
#  grows with sigma; pin it explicitly rather than rely on the median default.)
#
#  THE DATA is a one-compartment infusion+washout PK curve (see infusion_washout.bngl)
#  whose amount spans nearly three orders of magnitude, with 20% multiplicative noise.
#  The elimination rate `kel` is set by the washout tail's slope -- exactly the small,
#  low-noise-in-absolute-terms points a Gaussian fit under-uses. This lognormal fit
#  recovers kel; gaussian_dragged.conf (a constant-sigma Gaussian) is pulled off.
#
#  The model's piecewise `if()` infusion makes it non-differentiable, so fit it with
#  a gradient-free method (de), not trf/lbfgs.
#
#        pybnf -c lognormal.conf
# -----------------------------------------------------------------------------

output_dir = output/lognormal

edition = 2
model: infusion_washout.bngl
bngl_backend = bngsim

job_type = de

# Lognormal (multiplicative) error: a constant relative scatter (sigma on the
# log10 scale), with the prediction read as the mean (location = mean).
noise_model = lognormal, sigma = fix_at 0.2, location = mean

experiment: timecourse, data: infusion_washout.exp

uniform_var = kel  0.05  3.0

population_size = 24
max_iterations = 50
refine = 1
verbosity = 1
random_seed = 1234
