# =============================================================================
#  MCMC samplers 1/2:  Metropolis-Hastings                       job_type = mh
# =============================================================================
#  Lesson 17 sampled a posterior with DREAM, whose chains adapt their proposals to
#  the posterior's shape. This lesson shows the two other MCMC samplers PyBNF ships,
#  starting with the classic: METROPOLIS-HASTINGS.
#
#  MH runs a set of independent Markov chains. Each step proposes a move (a Gaussian
#  perturbation of size `step_size`), then accepts or rejects it by the Metropolis
#  rule. It is simple and unbiased, but non-adaptive: you pick the step size, and
#  the same step has to work for every parameter -- so it mixes best when the
#  parameters are on a similar scale (both rates here are O(1)). Run several chains
#  (`population_size`) so R-hat can diagnose convergence.
#
#  It samples the same posterior as lesson 17 and writes the same outputs -- unlike
#  Adaptive_MCMC (`am`), whose histogram step is a no-op, MH writes real credible
#  intervals:
#
#     Results/credible68.0_final.txt / credible95.0_final.txt   -- per-parameter CIs
#     Results/Histograms/<param>.txt                            -- marginal posteriors
#
#        pybnf -c mh_posterior.conf
# -----------------------------------------------------------------------------

output_dir = output/mh_posterior

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

job_type = mh
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: bateman_chain.exp

# Uniform priors on the two rates (both O(1), so one step_size mixes them).
uniform_var = k1  0.05  3.0
uniform_var = k2  0.02  2.0

# --- Sampler settings ---
population_size = 8       # 8 independent Metropolis-Hastings chains
max_iterations  = 1000
burn_in         = 300     # discard the chains' warm-up
sample_every    = 2       # thin every 2nd step
step_size       = 0.1     # Gaussian proposal scale (fixed -- MH does not adapt)

credible_intervals = 68 95
hist_bins = 20
output_hist_every = 2000
verbosity = 0
random_seed = 1234
