# =============================================================================
#  MCMC samplers 2/2:  Parallel Tempering                        job_type = pt
# =============================================================================
#  Plain Metropolis-Hastings can get trapped: a chain that finds one mode of a
#  multi-modal posterior may never cross the low-probability valley to another.
#  PARALLEL TEMPERING fixes this by running the same posterior at several
#  "temperatures" at once.
#
#  Each chain samples the likelihood raised to a power `beta` in (0, 1]:
#     * beta = 1     -- the true posterior (the "cold" chain we actually report)
#     * beta < 1     -- a flattened, "hotter" posterior that crosses valleys easily
#  Every `exchange_every` iterations, neighbouring-temperature chains attempt to
#  SWAP states (a Metropolis-accepted replica exchange). Hot chains discover distant
#  modes and hand them down the ladder to the cold chain, which still samples the
#  correct posterior. Credible intervals are taken from the cold (beta = 1) chain.
#
#  The temperature ladder is set by `beta` (an ascending list ending at 1.0) and
#  `reps_per_beta` (how many chains share each temperature). Here 4 betas x 2 reps
#  = population_size 8.
#
#        pybnf -c pt_posterior.conf
#
#  Same outputs as mh_posterior.conf (credible{68,95}_final.txt + Histograms/).
# -----------------------------------------------------------------------------

output_dir = output/pt_posterior

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

job_type = pt
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: bateman_chain.exp

uniform_var = k1  0.05  3.0
uniform_var = k2  0.02  2.0

# --- Sampler settings ---
population_size = 8            # 4 temperatures x reps_per_beta 2 = 8 chains
reps_per_beta   = 2
beta            = 0.25 0.5 0.75 1.0   # temperature ladder (1.0 = the true posterior)
exchange_every  = 20          # attempt a replica exchange every 20 iterations

max_iterations  = 1000
burn_in         = 300
sample_every    = 2
step_size       = 0.1

credible_intervals = 68 95
hist_bins = 20
output_hist_every = 2000
verbosity = 0
random_seed = 1234
