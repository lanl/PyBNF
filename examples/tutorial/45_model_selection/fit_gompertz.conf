# =============================================================================
#  Model selection:  fit candidate 3/4  --  Gompertz
# =============================================================================
#  An asymmetric S-curve with a DIFFERENT fixed skew (the ln(K/N) form, no free
#  shape parameter). It captures a different asymmetry than Richards, so it too fits
#  this Richards data worse. See fit_richards.conf.
#
#        pybnf -c fit_gompertz.conf
# -----------------------------------------------------------------------------

output_dir = output/fit_gompertz

edition = 2
model: gompertz.bngl
bngl_backend = bngsim

job_type = de
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: growth.exp

uniform_var = r  0.1  3.0
uniform_var = K  50   200

population_size = 24
max_iterations = 50
refine = 1
verbosity = 1
random_seed = 1234
