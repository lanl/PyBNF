# =============================================================================
#  Model selection:  fit candidate 1/4  --  Richards      (the TRUE model)
# =============================================================================
#  When you don't know which growth LAW your data follows, you fit several
#  candidate models to the SAME data and compare them. This folder fits four growth
#  laws to one noisy growth curve (growth.exp) -- this conf is the Richards model,
#  the generalized logistic with an extra shape exponent `b`.
#
#  All four confs are IDENTICAL except for the `model:` line and the parameters each
#  law has. Each scores the fit with the SAME weighted least-squares objective --
#
#        noise_model = normal, sigma = read_exp_file _SD
#
#  -- so the best objective (a chi-square) is directly comparable ACROSS models. To
#  compare models with DIFFERENT numbers of parameters fairly, rank them by the
#  Akaike Information Criterion:
#
#        AIC = chi_square + 2*k        (k = number of fitted parameters)
#
#  The `+2*k` penalty is what stops a more flexible model from "winning" just by
#  having more knobs. Here Richards (k=3) fits the asymmetric curve so much better
#  than logistic/gompertz/von_bertalanffy (k=2) that its extra parameter is more
#  than paid for -- it has the lowest AIC, and it IS the law the data came from.
#
#        for m in richards logistic gompertz von_bertalanffy; do pybnf -c fit_$m.conf; done
#
#  See the README for how to read the four best-fit objectives off the results and
#  turn them into an AIC ranking.
# -----------------------------------------------------------------------------

output_dir = output/fit_richards

edition = 2
model: richards.bngl
bngl_backend = bngsim

job_type = de
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: growth.exp

uniform_var = r  0.1  3.0
uniform_var = K  50   200
uniform_var = b  0.5  6.0

population_size = 24
max_iterations = 50
refine = 1
verbosity = 1
random_seed = 1234
