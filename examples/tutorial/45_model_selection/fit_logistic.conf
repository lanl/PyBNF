# =============================================================================
#  Model selection:  fit candidate 2/4  --  Logistic
# =============================================================================
#  The ordinary logistic (Richards with the shape exponent b fixed at 1): a
#  SYMMETRIC S-curve. It has one fewer parameter than Richards, but it cannot bend
#  to the data's asymmetric approach to K -- so its best fit is worse, and even
#  after the AIC parameter-count credit it ranks below Richards. See fit_richards.conf.
#
#        pybnf -c fit_logistic.conf
# -----------------------------------------------------------------------------

output_dir = output/fit_logistic

edition = 2
model: logistic.bngl
bngl_backend = bngsim

job_type = de
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: growth.exp

uniform_var = r  0.1  3.0
uniform_var = K  50   200

population_size = 24
max_iterations = 50
refine = 1
verbosity = 1
random_seed = 1234
