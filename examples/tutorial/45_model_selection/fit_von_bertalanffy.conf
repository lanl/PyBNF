# =============================================================================
#  Model selection:  fit candidate 4/4  --  von Bertalanffy
# =============================================================================
#  A surface-area-limited growth law (a*N^(2/3) - b*N), a different saturating
#  shape again. Another candidate that the data does not actually follow -- it fits
#  worst here. See fit_richards.conf.
#
#        pybnf -c fit_von_bertalanffy.conf
# -----------------------------------------------------------------------------

output_dir = output/fit_von_bertalanffy

edition = 2
model: von_bertalanffy.bngl
bngl_backend = bngsim

job_type = de
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: growth.exp

uniform_var = a  0.5  10.0
uniform_var = b  0.05  2.0

population_size = 24
max_iterations = 50
refine = 1
verbosity = 1
random_seed = 1234
