# =============================================================================
#  An analytical ODE solution AS the likelihood -- sampled by HMC/NUTS
# =============================================================================
#  Some ODE models have an exact closed-form solution. When they do, you do not
#  need a simulator at all: the solution y(t; theta) can be written directly as
#  the model prediction, the Gaussian log-likelihood becomes a plain algebraic
#  expression, and PyBNF's gradient-based sampler (`job_type = hmc`, blackjax
#  NUTS) can differentiate it and sample the posterior.
#
#  The model here is HIV viral load after antiretroviral therapy starts at t=0.
#  Post-therapy, production stops and the virus is cleared first-order:
#
#        dV/dt = -c * V        =>        V(t) = V0 * exp(-c * t)
#
#  So the ENTIRE model is the one line `V0*exp(-c*time)`. There is no .bngl, no
#  network generation, no ODE solve -- just the closed form.
#
#  ## How the likelihood is built
#  `objective = expression` turns a math expression into a per-observation
#  negative log-likelihood. `data = viral_decay.exp` binds the data file; its
#  column headers (`time`, `Vobs`) become symbols alongside the free parameters
#  (`V0`, `c`). PyBNF evaluates the expression once per data row and SUMS it:
#
#        expression = 0.5 * ((Vobs - V0*exp(-c*time)) / sigma)^2
#
#  That is exactly the Gaussian sum-of-squared-residuals NLL (sigma fixed here at
#  the known noise level, so its constant term is dropped). Because every symbol
#  is differentiable, HMC gets an exact gradient of the log-density for free.
#
#  ## Why HMC here
#  `job_type = hmc` needs a JAX-traceable analytical target -- an `expression`
#  (or a built-in menu target, see lesson 37). It REFUSES a simulated BNGL/SBML
#  model, whose solver is not differentiable in-graph. The reward is a gradient-
#  based No-U-Turn sampler: it explores the posterior far more efficiently than a
#  random-walk sampler, and returns full posterior draws (not just a point fit).
#
#        pybnf -c viral_decay_hmc.conf
#
#  The `uniform_var` bounds below are a flat (uninformative) prior, so the
#  posterior mean lands at the maximum-likelihood estimate: V0 ~ 100, c ~ 0.6
#  (the truth the data was generated from). Swap in `normal_var`/`lognormal_var`
#  for an informative prior and you get the full Bayesian posterior instead.
#  Posterior draws are written to output/.../Results/samples.txt; set
#  `output_inference_data = 1` (needs `pip install pybnf[arviz]`) to also emit an
#  ArviZ InferenceData for trace/pair/posterior plots.
# -----------------------------------------------------------------------------

output_dir = output/viral_decay_hmc

edition = 2

# The closed-form model IS the likelihood expression -- no model file.
objective  = expression
expression = 0.5*((Vobs - V0*exp(-c*time))/2.5)^2
data       = viral_decay.exp

job_type = hmc

# Free parameters (flat priors) -- `time` and `Vobs` are supplied by the data.
uniform_var = V0  10   400
uniform_var = c   0.01 3

# NUTS controls: warmup adapts the step size / mass matrix; then we draw samples.
num_warmup      = 500
num_samples     = 1000
population_size = 4        # number of independent chains
max_iterations  = 1000     # globally required; HMC drives off num_samples

verbosity   = 0
random_seed = 2024
