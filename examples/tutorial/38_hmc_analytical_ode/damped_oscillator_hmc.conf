# =============================================================================
#  A richer closed form:  the damped harmonic oscillator, sampled by HMC
# =============================================================================
#  The companion viral-decay lesson showed the mechanic on a mono-exponential.
#  Here the closed form is oscillatory and has THREE correlated parameters, so
#  the posterior geometry is genuinely non-trivial -- the case where a gradient
#  sampler like NUTS really earns its keep over a random walk.
#
#  Underdamped harmonic oscillator (started from rest at t=0, phase 0):
#
#        x'' + 2a x' + (a^2 + w^2) x = 0     =>     x(t) = C * exp(-a t) * cos(w t)
#
#  `a` is the damping rate (envelope decay), `w` the damped angular frequency,
#  `C` the initial amplitude. As with viral decay, the whole "model" is this one
#  differentiable line -- no simulator. (Catalog model: damped_harmonic_oscillator.)
#
#  ## The likelihood
#  Same construction as the decay lesson: `objective = expression` + `data`. The
#  expression is the per-point Gaussian NLL, summed over the rows of the bound
#  `.exp` (columns `time`, `xobs`); `sigma` is fixed at the known noise level.
#  cos/exp are differentiable, so HMC gradients the log-density exactly.
#
#        expression = 0.5*((xobs - C*exp(-a*time)*cos(w*time))/sigma)^2
#
#        pybnf -c damped_oscillator_hmc.conf
#
#  ## What to look at
#  The posterior recovers C ~ 5, a ~ 0.35, w ~ 3. Amplitude and damping are
#  positively correlated (an early amplitude can be traded against a slower
#  decay), so a pair plot of C vs a shows a tilted ridge -- precisely the
#  correlated geometry NUTS traverses well. Turn on `output_inference_data = 1`
#  (`pip install pybnf[arviz]`) and load Results/ into ArviZ to see it, plus
#  R-hat / effective sample size for convergence.
# -----------------------------------------------------------------------------

output_dir = output/damped_oscillator_hmc

edition = 2

objective  = expression
expression = 0.5*((xobs - C*exp(-a*time)*cos(w*time))/0.15)^2
data       = damped_oscillation.exp

job_type = hmc

uniform_var = C  1    10
uniform_var = a  0.01 2
uniform_var = w  0.5  6

num_warmup      = 600
num_samples     = 1000
population_size = 4
max_iterations  = 1000

verbosity   = 0
random_seed = 99
