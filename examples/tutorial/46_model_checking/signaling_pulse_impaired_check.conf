# =============================================================================
#  The same check, on the IMPAIRED model      job_type = check  (the FAIL case)
# =============================================================================
#  Identical to signaling_pulse_check.conf except the model: here we check the
#  impaired-clearance circuit against the SAME pulse.prop. Because clearance is
#  crippled, the pulse overshoots the ceiling and never clears, so two properties
#  fail:
#
#        pybnf -c signaling_pulse_impaired_check.conf
#
#        Objective value is <nonzero>
#        Satisfied 3 out of 5 constraints
#
#  Open Simulations/qualitative_constraint_eval.txt to see WHICH: it has one line
#  per property (in file order), 0 for satisfied and a positive penalty for
#  violated. Lines 3 (`Obs_R < 75 always`) and 5 (`Obs_R < 10 between ...`) are
#  nonzero -- the ceiling breach and the failure to clear.
# -----------------------------------------------------------------------------

output_dir = output/signaling_pulse_impaired_check

edition = 2
model: signaling_pulse_impaired.bngl
bngl_backend = bngsim

job_type = check
objective = sos

# The SAME specification as the healthy check -- a bare observable (Obs_R) in a
# .prop resolves to whichever model the experiment runs, so one spec serves both.
experiment: qualitative, data: pulse.prop, t_end: 12, n_steps: 60

verbosity = 1
