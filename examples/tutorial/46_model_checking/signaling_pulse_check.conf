# =============================================================================
#  Model checking: does the model satisfy the spec?          job_type = check
# =============================================================================
#  `check` takes a model AS GIVEN -- its built-in parameter values, no free
#  parameters -- and reports how many properties of a `.prop` specification hold.
#  It runs ONE simulation and does no fitting or searching. (It evaluates a
#  single deterministic trajectory, so it is a tool for ODE models: there is no
#  satisfaction *fraction* over stochastic replicates, just pass/fail per
#  property on the one trajectory.)
#
#        pybnf -c signaling_pulse_check.conf
#
#  This is the HEALTHY circuit. It satisfies all five properties:
#
#        Objective value is 0.0
#        Satisfied 5 out of 5 constraints
#
#  Its impaired sibling, checked against the SAME spec, satisfies only 3 of 5
#  (signaling_pulse_impaired_check.conf) -- so `check` is a pass/fail QA gate.
# -----------------------------------------------------------------------------

output_dir = output/signaling_pulse_check

edition = 2
model: signaling_pulse.bngl
bngl_backend = bngsim

# The checking "algorithm": evaluate constraint satisfaction, no fitting.
job_type = check
objective = sos

# Attach the qualitative spec. A constraint-only experiment (no .exp) states its
# own timing with t_end / n_steps, the new-era home for what a legacy .prop job
# kept in the model's `begin actions` block. The fine grid resolves the pulse
# peak and the tail the properties check.
experiment: qualitative, data: pulse.prop, t_end: 12, n_steps: 60

# No free parameters: `check` evaluates the model exactly as written.

verbosity = 1
