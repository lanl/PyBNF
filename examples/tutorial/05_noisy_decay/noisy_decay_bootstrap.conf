# =============================================================================
#  Uncertainty by bootstrapping                            bootstrap = N
# =============================================================================
#  A single fit gives one best value per parameter. But the data is noisy, so how
#  much would those values wobble if we'd drawn a different noisy sample?
#  Bootstrapping answers empirically: resample the data (with replacement) many
#  times, refit each replicate, and look at the SPREAD of the resulting fits.
#
#  Here we fit a decay `dA/dt = -k*A` to noisy data and bootstrap it. The N
#  replicate best-fits are written to Results/bootstrapped_parameter_sets.txt;
#  their spread is a confidence region for (k, A0).
#
#        pybnf -c noisy_decay_bootstrap.conf
# -----------------------------------------------------------------------------

output_dir = output/noisy_decay_bootstrap

edition = 2
model: noisy_decay.bngl
bngl_backend = bngsim

# Any optimizer works; differential evolution + a Simplex polish is a robust
# default for the per-replicate fits.
job_type = de
objective = chi_sq          # the data carries _SD columns -> chi-square likelihood

experiment: timecourse, data: noisy_decay.exp

uniform_var = k   0.05  3.0
uniform_var = A0  20    400

population_size = 12
max_iterations = 30
refine = 1

# Bootstrapping: refit this many resampled replicates. Each writes an accepted
# best-fit row to Results/bootstrapped_parameter_sets.txt. (Use more replicates —
# 100+ — for a real analysis; 8 keeps the tutorial quick.)
bootstrap = 8

# Reject (and retry) any replicate whose objective exceeds this -- guards against
# a replicate that lands in a bad local optimum polluting the spread. Good fits
# here score well under 20.
bootstrap_max_obj = 30

verbosity = 1
