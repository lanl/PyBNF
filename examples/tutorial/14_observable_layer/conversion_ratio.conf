# =============================================================================
#  The measurement layer, part 2: a RATIO you never simulate directly
# =============================================================================
#  Sometimes the measured quantity is not any single species but a COMBINATION of
#  them -- a fraction, a ratio, a normalized signal. Classic examples: the
#  fraction of a protein that is phosphorylated, or a FRET ratio. The model does
#  not (and should not) carry a species for "the fraction"; you compute it from
#  the species it does carry, as a measurement model:
#
#        observable: obs_fracB, formula: Obs_B / (Obs_A + Obs_B)
#
#  With A + B conserved, this fraction is simply 1 - exp(-k t) -- a clean,
#  dimensionless, self-normalizing readout (the unknown total A0 cancels out). We
#  recover k from it, having fit a quantity the simulator never output as a column.
#
#        pybnf -c conversion_ratio.conf
# -----------------------------------------------------------------------------

output_dir = output/conversion_ratio

edition = 2
model: conversion.bngl
bngl_backend = bngsim

job_type = de
objective = sos

# The derived readout. Both Obs_A and Obs_B are model observables; the formula
# combines them into a fraction that is materialized post-simulation and scored
# against the `obs_fracB` column in the data.
observable: obs_fracB, formula: Obs_B / (Obs_A + Obs_B)

experiment: timecourse, data: conversion_ratio.exp

# Only the rate is free -- a fraction has no scale to fit (it is self-normalizing).
uniform_var = k  0.05  3.0

population_size = 24
max_iterations = 60
refine = 1
verbosity = 1
