# =============================================================================
#  The measurement layer, part 1: an unknown SCALE      observableFormula
# =============================================================================
#  Real instruments rarely report a species count directly -- they report it
#  through an unknown gain: fluorescence intensity, a luminometer reading, an
#  antibody signal. The number you measure is `scale * (true amount)`, and the
#  scale is itself unknown and must be fitted.
#
#  PyBNF models this with a MEASUREMENT MODEL (a PEtab `observableFormula`): a
#  formula, evaluated AFTER simulation, that maps the model's output to what the
#  instrument reports. You declare it in the .conf, never in the model file:
#
#        observable: obs_scaled, formula: scale * Obs_B
#
#  Here `scale` is an "observation-layer nuisance" -- a free parameter that lives
#  ONLY in the fit, not in the model (the model has no `scale`). PyBNF resolves it
#  from the parameter set at scoring time. We recover both the reaction rate `k`
#  AND the instrument gain `scale` from the scaled data.
#
#        pybnf -c conversion_scaling.conf
# -----------------------------------------------------------------------------

output_dir = output/conversion_scaling

edition = 2
model: conversion.bngl
bngl_backend = bngsim

# A gradient-free global optimizer. (The measurement-layer nuisance `scale` is
# not a model parameter, so the bngsim sensitivity engine can't provide its
# derivative -- de needs no derivatives, so it fits this cleanly.)
job_type = de
objective = sos

# THE MEASUREMENT MODEL. `obs_scaled` is a NEW observable, computed as
# `scale * Obs_B` from the simulated Obs_B and the fitted `scale`. The data file
# has a matching `obs_scaled` column, and that -- not Obs_B -- is what is scored.
observable: obs_scaled, formula: scale * Obs_B

experiment: timecourse, data: conversion_scaling.exp

# The model rate...
uniform_var = k      0.05  3.0
# ...and the observation-layer nuisance. `scale` appears in NO reaction rule; it
# exists only in the measurement formula above. PyBNF recognizes it as a nuisance
# (it is not mis-flagged as an orphan free parameter) and recovers its true 2.0.
uniform_var = scale  0.1   10.0

population_size = 24
max_iterations = 60
refine = 1
verbosity = 1
