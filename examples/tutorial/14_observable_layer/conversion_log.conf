# =============================================================================
#  The measurement layer, part 3: a LOG-TRANSFORMED readout
# =============================================================================
#  A measurement model can also change the SCALE on which you compare model to
#  data. Concentrations that span orders of magnitude (a decay from 10 down to
#  ~0.03 here) are often measured -- and fit -- on a log scale, so that the small
#  values at the tail carry as much weight as the large ones at the start
#  (equivalently: fitting relative rather than absolute error):
#
#        observable: obs_logA, formula: log(Obs_A)
#
#  `log` is the natural logarithm. The data column is the log of the simulated
#  Obs_A, and the residuals are taken in log space. We still recover the true k.
#
#        pybnf -c conversion_log.conf
#
#  (Tip: for a base-10 log, write `log(Obs_A)/log(10)` -- the two-argument
#  `log10(...)` form is not supported by the formula compiler in this build.)
# -----------------------------------------------------------------------------

output_dir = output/conversion_log

edition = 2
model: conversion.bngl
bngl_backend = bngsim

job_type = de
objective = sos

# Transform the readout: score log(Obs_A), not Obs_A, against the data.
observable: obs_logA, formula: log(Obs_A)

experiment: timecourse, data: conversion_log.exp

uniform_var = k  0.05  3.0

population_size = 24
max_iterations = 60
refine = 1
verbosity = 1
