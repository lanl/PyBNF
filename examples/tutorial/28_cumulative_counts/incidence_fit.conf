# =============================================================================
#  Cumulative -> incident count observables  (the `cumulative` flag + neg_bin)
# =============================================================================
#  The model tracks R() as a running CUMULATIVE count of recoveries. But the data
#  is INCIDENCE -- new recoveries reported each day, not the running total. Rather
#  than post-process the model output, we tell PyBNF that Obs_R's prediction is a
#  cumulative count with the per-observable `cumulative` flag: before scoring, it
#  differences Obs_R row-to-row into per-interval increments (row 0 keeps its raw
#  value), so the model's cumulative R is compared against incident data directly.
#
#  Both channels are integer COUNTS, so we score them with the negative-binomial
#  likelihood (`neg_bin`, lesson 18) -- over-dispersed count noise, no _SD column:
#
#     * Obs_I  (current infectious -- a prevalence): the whole-fit base noise_model,
#              scored as counts directly.
#     * Obs_R  (incident recoveries): a per-observable OVERRIDE that adds the
#              `cumulative` flag, so the same neg_bin family scores the DIFFERENCED
#              prediction. (`cumulative` is per-observable ONLY -- a whole-fit
#              cumulative would mean "every column is cumulative", and is rejected.)
#
#  Incubation (sigma) is well characterized clinically, so it is held fixed; the
#  fit recovers beta_eff (transmission) and gamma (recovery) from the two channels.
#  The prevalence Obs_I pins the growth rate (hence beta_eff), and the ratio of
#  incident recoveries to prevalence pins gamma -- neither is well determined alone.
#
#        pybnf -c incidence_fit.conf
# -----------------------------------------------------------------------------

output_dir = output/incidence_fit

edition = 2
model: linearized_seir.bngl
bngl_backend = bngsim

job_type = de

# Base likelihood: negative-binomial counts. `location = mean` is REQUIRED -- the ODE
# gives the MEAN count and the data is generated at the mean, while neg_bin defaults to
# the median (lesson 18). `dispersion = fix_at 50` fixes the over-dispersion r (jointly
# fitting dispersion with the count scale is weakly identified -- lesson 18).
noise_model = neg_bin, dispersion = fix_at 50, location = mean

# Per-observable override for Obs_R: same neg_bin family, plus the `cumulative` flag that
# differences the cumulative Obs_R prediction into per-interval incident recoveries.
noise_model Obs_R = neg_bin, dispersion = fix_at 50, location = mean, cumulative

experiment: timecourse, data: seir_counts.exp

# Fit the two identifiable rates; sigma stays fixed at its model value (0.5).
uniform_var = beta_eff  0.2  3.0
uniform_var = gamma     0.1  2.0

population_size = 30
max_iterations = 60
refine = 1

verbosity = 0
