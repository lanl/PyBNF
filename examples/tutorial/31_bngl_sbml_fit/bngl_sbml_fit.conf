# =============================================================================
#  One fit, two model languages: a BNGL model AND an SBML model together
# =============================================================================
#  A joint fit does not care what LANGUAGE each experiment's model is written in.
#  Here two conditions of the same binding reaction A + B <-> C are fit at once:
#
#     * low_ligand  -- modeled in BNGL   (binding_low.bngl,  B starts at 75)
#     * high_ligand -- modeled in SBML   (binding_high.xml,  B starts at 150)
#
#  Both models share the rate constants kf and kr (bound by bare name, as in the
#  multi-model joint fit of lesson 16), and the fit recovers both from the two
#  binding curves together. The BNGL model runs on the `bngl_backend`, the SBML
#  model on the `sbml_backend`; both are bngsim, so a single fit drives both.
#
#  ONE naming detail to know (see lesson 11): the bngsim SBML path reports RAW
#  SPECIES (A, B, C), while a BNGL model reports its declared observables
#  (Obs_A, Obs_C, ...). So each experiment's data column is named to match ITS
#  model's output -- `Obs_C` for the BNGL experiment, `C` for the SBML one.
#
#        pybnf -c bngl_sbml_fit.conf
# -----------------------------------------------------------------------------

output_dir = output/bngl_sbml_fit

edition = 2

# Declare both models. One is BNGL, one is SBML; each backend is bngsim.
model: binding_low.bngl
model: binding_high.xml
bngl_backend = bngsim
sbml_backend = bngsim

job_type = de
objective = sos

# Two experiments, each naming the model it simulates (multi-model, lesson 16).
# The data column matches the model's output: Obs_C (BNGL) vs C (SBML species).
experiment: low_ligand,  model: binding_low.bngl,  data: bind_low.exp
experiment: high_ligand, model: binding_high.xml, data: bind_high.exp

# Shared fitted rates -- declared once, bound in BOTH models by bare name.
uniform_var = kf  0.0002  0.05
uniform_var = kr  0.02    3.0

population_size = 24
max_iterations = 60
refine = 1
verbosity = 1
