# =============================================================================
#  Bayesian uncertainty: a posterior and its credible intervals  (job_type=dream)
# =============================================================================
#  The optimizers in the other lessons return a single BEST parameter set. This
#  one returns a whole POSTERIOR DISTRIBUTION -- what the data (plus your priors)
#  say about how the parameters are jointly plausible, uncertainty and all.
#
#  We sample the posterior with DREAM (`job_type = dream`) -- DiffeRential
#  Evolution Adaptive Metropolis. A population of Markov chains explores parameter
#  space together, proposing moves from the differences between chains, so it
#  adapts to the posterior's shape and mixes well without hand-tuned step sizes.
#  From the collected samples PyBNF writes, for each parameter, a histogram (the
#  marginal posterior) and CREDIBLE INTERVALS -- the Bayesian analogue of a
#  confidence interval: a 95% credible interval is a range the parameter lies in
#  with 95% posterior probability.
#
#  The likelihood needs a noise scale, so the data carries a constant `_SD`
#  column and we read it as the Gaussian sigma. The two rates are both order-one.
#
#        pybnf -c bateman_posterior.conf
#
#  Look in output/bateman_posterior/Results/ afterward:
#     credible68.0_final.txt / credible95.0_final.txt  -- credible intervals per parameter
#     Histograms/<param>.txt                           -- each parameter's marginal posterior
#     samples.txt                                      -- every posterior draw
# -----------------------------------------------------------------------------

output_dir = output/bateman_posterior

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

# DREAM -- a posterior sampler, not a point optimizer.
job_type = dream

# The likelihood: a Gaussian around the model with sigma read from the data's _SD
# column. (The noise_model line IS the objective specifier -- see lesson 8.)
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: bateman_chain.exp

# The parameters to infer. For a Bayesian fit these bounds are a (uniform) PRIOR:
# every value in range is a priori equally plausible. Both rates are O(1).
uniform_var = k1  0.05  3.0
uniform_var = k2  0.02  2.0

# --- Sampler settings -------------------------------------------------------
population_size = 8       # number of chains in the DREAM population
max_iterations  = 1500    # generations
burn_in         = 500     # discard the first steps (the chains finding the bulk)
sample_every    = 2       # thin: keep every 2nd step (reduces autocorrelation)
step_size       = 0.1     # base proposal scale (DREAM adapts around it)

# What to report: 68% (~1 sigma) and 95% credible intervals, and 20-bin marginals.
credible_intervals = 68 95
hist_bins = 20
output_hist_every = 2000

verbosity = 0
random_seed = 1234
