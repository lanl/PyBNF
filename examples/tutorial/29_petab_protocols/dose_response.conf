# =============================================================================
#  A dose-response job -- the SOURCE for a PEtab round-trip   (parameter_scan)
# =============================================================================
#  This is an ordinary PyBNF dose-response job (the same design as lesson 9): it
#  sweeps the stimulus strength k_prod across doses and reads the STEADY-STATE
#  level A_ss = k_prod/k_deg at each. PyBNF infers the parameter scan from the
#  data's independent-variable column (`k_prod`, not time), and runs each dose to
#  steady state.
#
#  Lesson 29 is about what happens when you EXPORT this job to PEtab v2. A
#  dose-response has no home in a plain measurements table, so it takes the
#  conditions/experiments shape (ADR-0046): each dose becomes a PEtab *Condition*
#  (k_prod = <dose>) and an *Experiment*, measured at time = inf (steady state).
#  Exporting and re-importing recovers a runnable dose-response job. See README.md.
#
#        # in Python (there is no --petab CLI flag):
#        from pybnf.petab import export_job, import_job
#        export_job("dose_response.conf", "petab_out")
#        import_job("petab_out/problem.yaml", "back", job_type="de")
# -----------------------------------------------------------------------------

output_dir = output/dose_response

edition = 2
model: inducible_gene.bngl
bngl_backend = bngsim

job_type = de
objective = sos

# Independent variable is `k_prod` (a model parameter, not time) -> a steady-state
# dose-response scan. On export, each dose row becomes a Condition + Experiment.
experiment: doseresponse, data: dose_response.exp

uniform_var = k_deg  0.1  10.0

population_size = 12
max_iterations = 30
refine = 1
verbosity = 1
