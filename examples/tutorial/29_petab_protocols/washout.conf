# =============================================================================
#  A two-phase washout job -- the SOURCE for a PEtab round-trip  (preequilibrate)
# =============================================================================
#  An ordinary PyBNF pre-equilibration job (the washout from lesson 9): equilibrate
#  with the stimulus ON, then switch it OFF and watch the species relax, with state
#  carried across the switch. Two `condition:` lines set the stimulus; the
#  experiment names one as its `preequilibrate:` phase and one as its measurement
#  `condition:`.
#
#  This is the protocol that round-trips through PEtab most faithfully. On export,
#  each condition becomes a PEtab *Condition*, and the experiment becomes two
#  *periods*: the pre-equilibration phase at PEtab time = -inf (Stimulus_isOn = 1)
#  and the measurement period at time = 0 (Stimulus_isOn = 0). Re-importing rebuilds
#  the `preequilibrate: stim_on, condition: stim_off` experiment exactly. See README.md.
# -----------------------------------------------------------------------------

output_dir = output/washout

edition = 2
model: inducible_gene.bngl
bngl_backend = bngsim

job_type = de
objective = sos

# Two conditions (stimulus ON to equilibrate, OFF to measure).
condition: stim_on,  perturbations: Stimulus_isOn = 1
condition: stim_off, perturbations: Stimulus_isOn = 0

# Equilibrate under stim_on to steady state, then measure under stim_off; state
# carries across the switch. On export -> PEtab periods at time = -inf and time = 0.
experiment: washout, preequilibrate: stim_on, condition: stim_off, data: washout.exp

uniform_var = k_deg  0.1  10.0

population_size = 12
max_iterations = 30
refine = 1
verbosity = 1
