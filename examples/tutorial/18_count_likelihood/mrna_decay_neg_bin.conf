# =============================================================================
#  Fitting COUNT data with a count likelihood      (the negative binomial)
# =============================================================================
#  The data here are molecule COUNTS: non-negative integers, and OVER-DISPERSED
#  (their scatter grows with the mean, wider than a Poisson would give). Two
#  instincts to resist:
#
#    * least squares (a Gaussian with constant sigma) assumes symmetric, constant-
#      width noise -- but count noise is skewed near zero and grows with the mean;
#    * a plain Poisson pins the variance equal to the mean, and real counts are
#      almost always noisier than that (biological over-dispersion).
#
#  The negative binomial is the natural fit: a count distribution whose variance,
#  mean + mean^2/r, EXCEEDS the mean, with a dispersion parameter r that says by
#  how much. In edition 2 you select it with one line --
#
#        noise_model = neg_bin, dispersion = fix_at 40, location = mean
#
#  -- and the fit maximizes the negative-binomial likelihood of the counts given
#  the model's predicted mean A(t). The early points pin the starting count N0 and
#  the slope pins the rate k_deg, so both come back from the noisy counts.
#
#        pybnf -c mrna_decay_neg_bin.conf
#
#  `dispersion = fix_at 40` PINS the over-dispersion r at a value calibrated ahead
#  of time (in practice, from replicate measurements) -- pinning it is what keeps
#  the rate well determined, because estimating r jointly with the count SCALE is
#  weakly identified (a bigger N0 with a wider assumed spread looks much the same).
#  To estimate it anyway, write `dispersion = fit r_disp` and declare `r_disp` as a
#  free parameter. `location = mean` says the model's A(t) is the MEAN count, which
#  is what the deterministic ODE computes; the negative binomial is right-skewed so
#  its mean and median differ, and neg_bin defaults to `median`, so we say `mean` to
#  match how the counts were measured. Note there is NO `_SD` column in the data and
#  none is needed: a count likelihood sets its own scale.
# -----------------------------------------------------------------------------

output_dir = output/mrna_decay_neg_bin

edition = 2
model: mrna_decay.bngl
bngl_backend = bngsim

job_type = de

# The count likelihood, with the over-dispersion pinned at its calibrated value
# (`fix_at 40`) and A(t) read as the mean count (`location = mean`). The counts
# carry no _SD column -- a count likelihood sets its own scale.
noise_model = neg_bin, dispersion = fix_at 40, location = mean

experiment: timecourse, data: mrna_decay.exp

uniform_var = k_deg  0.02  2.0
uniform_var = N0     20    1000

population_size = 30
max_iterations = 60
refine = 1
verbosity = 1
