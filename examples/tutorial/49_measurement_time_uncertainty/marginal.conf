# =============================================================================
#  Marginalizing the latent measurement time     time_error = truncated_normal
# =============================================================================
#  Same data, same noise -- but now the reported time t_k is treated as an
#  UNCERTAIN version of the true sampling time tau_k ~ TruncNormal(t_k, sigma_t).
#  Instead of scoring x(t_k), the likelihood is INTEGRATED over tau_k:
#
#     z_k = integral over [t0, tmax] of  N(y_k | x(tau), sigma)  p(tau | t_k)  d tau
#
#  PyBNF computes each z_k by quadrature over the simulated trajectory, so the
#  fit accounts for the timing spread instead of blaming it on the rate. The
#  recovered k (~1.06) is close to the truth k = 1 -- the bias is gone.
#
#  Because the latent time is integrated over the whole support, the model must
#  be simulated DENSELY over [t0, tmax], not just at the reported times: give the
#  experiment a `t_end:` (the support tmax, set past the last data point so the
#  timing prior is not truncated) and an `n_steps:` (the quadrature resolution).
#
#        pybnf -c marginal.conf
# -----------------------------------------------------------------------------
output_dir = output/marginal

edition = 2
model: decay.bngl
bngl_backend = bngsim

job_type = de
# Gaussian measurement noise, PLUS a known timing uncertainty of sigma_t = 0.5.
noise_model = gaussian, sigma = fix_at 0.05, time_error = truncated_normal, sigma_t = fix_at 0.5
# Dense grid over the support [0, 10] (decoupled from the sparse reported times).
experiment: timecourse, data: decay.exp, t_end: 10, n_steps: 250

uniform_var = k 0.2 3.0
population_size = 16
max_iterations = 25
verbosity = 1
