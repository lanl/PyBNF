# =============================================================================
#  Ignoring measurement-time uncertainty        (the biased baseline)
# =============================================================================
#  The data below were sampled at times that drift from the reported ones (a
#  sample-handling delay, imperfect synchronization). This fit does what every
#  standard fit does: it trusts the reported times exactly, scoring x(t_k) at
#  each reported t_k. On a curved trajectory that mis-attributes the timing
#  spread to the decay rate, so the recovered k is BIASED (here ~1.36, well
#  above the truth k = 1).
#
#        pybnf -c standard.conf
# -----------------------------------------------------------------------------
output_dir = output/standard

edition = 2
model: decay.bngl
bngl_backend = bngsim

job_type = de
# A plain Gaussian likelihood at the reported times (known measurement noise).
noise_model = gaussian, sigma = fix_at 0.05
experiment: timecourse, data: decay.exp

uniform_var = k 0.2 3.0
population_size = 16
max_iterations = 25
verbosity = 1
