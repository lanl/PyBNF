# =============================================================================
#  Estimating the timing uncertainty too         sigma_t = fit sigma_t__FREE
# =============================================================================
#  In practice you may not know sigma_t. Because the timing spread leaves a
#  signature in the data, it can be ESTIMATED jointly with the rate -- one extra
#  search dimension, not one per data point (that is the whole point of
#  marginalizing rather than fitting each latent time). The fit recovers
#  k ~ 0.98 and sigma_t ~ 0.7: a clearly NON-ZERO timing error, which is how you
#  detect that the reported times cannot be trusted.
#
#        pybnf -c estimate_sigma_t.conf
# -----------------------------------------------------------------------------
output_dir = output/estimate_sigma_t

edition = 2
model: decay.bngl
bngl_backend = bngsim

job_type = de
noise_model = gaussian, sigma = fix_at 0.05, time_error = truncated_normal, sigma_t = fit sigma_t__FREE
experiment: timecourse, data: decay.exp, t_end: 10, n_steps: 250

uniform_var = k 0.2 3.0
uniform_var = sigma_t__FREE 0.05 2.0
population_size = 20
max_iterations = 30
verbosity = 1
