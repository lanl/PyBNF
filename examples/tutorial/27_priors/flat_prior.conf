# =============================================================================
#  Priors, part 1 of 2: a FLAT prior on a weakly-identified parameter
# =============================================================================
#  Every fit in this tutorial has quietly used a prior already: `uniform_var`.
#  In a Bayesian fit the two numbers after a `uniform_var` are not just search
#  bounds -- they are a FLAT (uniform) prior, the statement "before seeing the
#  data, every value in this range is equally plausible, and none outside it."
#
#  This conf makes that explicit and sets up the comparison. We sample the
#  posterior of the Bateman chain with DREAM, giving BOTH rates a flat prior:
#
#        uniform_var = k1  0.05 3.0      (flat)
#        uniform_var = k2  0.02 2.0      (flat)
#
#  The data has two channels of different quality: a PRECISE Obs_A (_SD 3) and
#  an IMPRECISE Obs_C (_SD 25). Because A(t) depends only on k1, the tight Obs_A
#  pins k1 sharply. But k2's only handle is the noisy Obs_C -- so with nothing but
#  a flat prior, k2's posterior comes out WIDE. Run this, then the informative
#  companion, and compare the 95% credible interval widths for k2:
#
#        pybnf -c flat_prior.conf
#        pybnf -c informative_prior.conf
#
#  Results to compare afterward (output/*/Results/):
#     credible95.0_final.txt   -- k2's interval is wide here, narrow there
#     Histograms/k2.txt        -- the marginal posterior of k2
#
#  IMPORTANT: priors act ONLY in a Bayesian fit (a sampler: dream/mh/pt/...).
#  A point optimizer (de, pso, trf, ...) maximizes the likelihood alone and
#  IGNORES the prior family entirely -- so this lesson has to be a sampler.
# -----------------------------------------------------------------------------

output_dir = output/flat_prior

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

# DREAM -- a posterior sampler (priors matter here; they would not to an optimizer).
job_type = dream

# The likelihood: a Gaussian around the model with each channel's sigma read from
# its own _SD column (Obs_A_SD = 3 tight, Obs_C_SD = 25 loose).
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: bateman_chain.exp

# Both parameters get a FLAT prior -- the two numbers are a uniform prior's range.
uniform_var = k1  0.05  3.0     # flat; Obs_A pins k1 regardless
uniform_var = k2  0.02  2.0     # flat; only the noisy Obs_C informs k2 -> stays wide

# --- Sampler settings (identical in both confs, so only the prior differs) ---
population_size = 10       # DREAM chains
max_iterations  = 1500     # generations
burn_in         = 500      # discard the chains' burn-in
sample_every    = 2        # thin
step_size       = 0.1      # base proposal scale (DREAM adapts around it)

credible_intervals = 68 95
hist_bins = 20
output_hist_every = 2000

verbosity = 0
random_seed = 1234
