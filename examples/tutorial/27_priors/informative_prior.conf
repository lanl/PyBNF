# =============================================================================
#  Priors, part 2 of 2: an INFORMATIVE prior on the weakly-identified parameter
# =============================================================================
#  Same model, same data, same sampler as `flat_prior.conf` -- the ONLY change is
#  k2's prior line. Suppose an earlier, independent experiment already measured
#  the B -> C step and reported k2 ~ 0.25 +/- 0.05 /day. That knowledge is exactly
#  what a prior is for: we encode it as a GAMMA prior and let this fit combine it
#  with the (weak) Obs_C data.
#
#        uniform_var = k1  0.05 3.0        (flat, unchanged -- Obs_A pins k1)
#        gamma_var   = k2  25   0.01       (informative: mean 0.25, sd 0.05)
#
#  PyBNF has a *_var keyword for every prior family it ships (normal_var,
#  lognormal_var, gamma_var, laplace_var, beta_var, ...; a `log`-prefixed twin
#  places the family in log10 space, e.g. lognormal_var). The positional numbers
#  are that family's own parameters:
#
#        uniform_var  = p  lo    hi        (flat over [lo, hi])
#        normal_var   = p  mean  sd        (Gaussian, unbounded)
#        gamma_var    = p  shape scale     (positive support; mean = shape*scale)
#        lognormal_var= p  mu    sigma     (Gaussian in log10 space)
#
#  gamma has support (0, inf), so it can never propose a negative rate. With
#  shape = 25, scale = 0.01 its mean is shape*scale = 0.25 and its sd is
#  scale*sqrt(shape) = 0.05 -- our independent estimate, centered at the truth.
#
#        pybnf -c informative_prior.conf
#
#  Compare k2 in output/informative_prior/Results/credible95.0_final.txt against
#  the flat run: the informative prior collapses k2's wide, data-starved posterior
#  onto a tight interval that still brackets the truth -- WITHOUT touching k1,
#  which the precise Obs_A already pins in both runs (strong data overrides any
#  prior). That is what a prior buys you: leverage exactly where the data is weak.
# -----------------------------------------------------------------------------

output_dir = output/informative_prior

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

job_type = dream

noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: bateman_chain.exp

# k1 keeps its flat prior; k2 gets the informative gamma prior from prior knowledge.
uniform_var = k1  0.05  3.0        # flat, unchanged
gamma_var   = k2  25    0.01       # informative: shape 25, scale 0.01 -> mean 0.25, sd 0.05

# --- Sampler settings (identical to flat_prior.conf) -------------------------
population_size = 10
max_iterations  = 1500
burn_in         = 500
sample_every    = 2
step_size       = 0.1

credible_intervals = 68 95
hist_bins = 20
output_hist_every = 2000

verbosity = 0
random_seed = 1234
