# =============================================================================
#  The gradient-friendly step: fit it (and its transition time) with trf
# =============================================================================
#  The companion to `step_input_trf_refused.conf`. Same first-order system, but
#  the input is a SMOOTH sigmoid step instead of a hard `if()`. Now bngsim can
#  form the forward sensitivities, so the gradient optimizer `trf` fits it -- and
#  because the transition is differentiable, we can even recover the transition
#  time `tau` by gradient (the sharpness `s_sharp` stays fixed).
#
#        pybnf -c step_input_smooth_trf.conf
# -----------------------------------------------------------------------------

output_dir = output/step_input_smooth_trf

edition = 2
model: step_input_smooth.bngl
bngl_backend = bngsim

# A gradient optimizer -- allowed now, because the smooth step is differentiable.
job_type = trf
objective = sos

experiment: timecourse, data: step_input_smooth.exp

# Four free parameters -- note `tau`, the transition time, is fittable here (it
# is a differentiable parameter of the sigmoid; the hard-if() model could not
# expose it to a gradient). `s_sharp` is left fixed at its model value.
uniform_var = k       0.1  3.0
uniform_var = J_base  0.1  5.0
uniform_var = J_step  0.1  6.0
uniform_var = tau     1.0  8.0

population_size = 3
max_iterations = 100
verbosity = 1
