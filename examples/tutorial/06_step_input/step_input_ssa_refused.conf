# =============================================================================
#  What a gradient optimizer still refuses: a STOCHASTIC experiment (job_type = trf)
# =============================================================================
#  Identical to `step_input_trf.conf` except that the scored experiment asks for
#  `method: ssa` -- a stochastic (Gillespie) simulation instead of ODE integration.
#
#  This one is refused, and unlike the hard `if()` step it always will be. A
#  gradient needs a derivative of the prediction with respect to the parameters;
#  an SSA trajectory is a random walk, so there is no such derivative to carry --
#  the forward-sensitivity machinery exists only for the ODE backend. That is a
#  property of stochastic simulation, not a gap in the tooling:
#
#        Model step_input: gradient-based fitting requires deterministic ODE
#        integration, but a scored simulate() action requests method='ssa'.
#        Forward output sensitivities are available only for the ODE backend;
#        run a gradient-free fit for stochastic/network-free simulation.
#
#  Try it -- the error is the lesson:
#
#        pybnf -c step_input_ssa_refused.conf
#
#  The fix is the same one Lesson 6 has always taught, just for a different
#  cause: score this experiment with a gradient-free job_type (`de`/`pso`/`ss`).
#
#  (The test suite asserts this conf is refused, not that it fits.)
# -----------------------------------------------------------------------------

output_dir = output/step_input_ssa_refused

edition = 2
model: step_input.bngl
bngl_backend = bngsim

# trf is a GRADIENT optimizer -> every SCORED action must be deterministic ODE.
job_type = trf
objective = sos

# `method: ssa` is what makes this unscorable by a gradient fit.
experiment: timecourse, method: ssa, data: step_input.exp

uniform_var = k       0.1  3.0
uniform_var = J_base  0.1  5.0
uniform_var = J_step  0.1  6.0

population_size = 3
max_iterations = 100

verbosity = 1
