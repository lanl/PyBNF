# =============================================================================
#  A hard step on the gradient path -- including the step TIME  (job_type = trf)
# =============================================================================
#  Identical to `step_input_de.conf` except that it asks for the gradient
#  optimizer `trf`, and fits one more parameter: `tau`, the time the input steps.
#
#  The input rate law is a hard `if(t < tau, ...)` -- a genuine discontinuity, not
#  a smooth approximation of one. bngsim differentiates it anyway. A jump at a
#  *known* time is no obstacle at all (the crossing does not move, so the forward
#  sensitivity just carries through it), and a jump at a *fitted* time is handled
#  by the crossing term the solver adds where the switch fires -- which is what
#  makes `tau` itself fittable here.
#
#        pybnf -c step_input_trf.conf
#
#  Compare `step_input_smooth_trf.conf`: the same fit on a sigmoid-smoothed input.
#  Both recover the truth; the contrast is what each costs the integrator, not
#  whether the gradient exists.
#
#  This conf used to be `step_input_trf_refused.conf` and this comment used to
#  explain why the fit was impossible. It became possible in bngsim 0.12.2.
# -----------------------------------------------------------------------------

output_dir = output/step_input_trf

edition = 2
model: step_input.bngl
bngl_backend = bngsim

# trf is a GRADIENT optimizer: it consumes bngsim's forward sensitivities.
job_type = trf
objective = sos

experiment: timecourse, data: step_input.exp

uniform_var = k       0.1  3.0
uniform_var = J_base  0.1  5.0
uniform_var = J_step  0.1  6.0
uniform_var = tau     2.0  7.0

population_size = 3
max_iterations = 100

verbosity = 1
