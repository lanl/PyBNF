# =============================================================================
#  A non-smooth model fits fine with a metaheuristic       job_type = de
# =============================================================================
#  dX/dt = J(t) - k*X, where the input J(t) STEPS UP at t = tau. The step is a
#  discontinuity, so the model is not smooth -- but differential evolution never
#  asks for a gradient, so smoothness is simply not its problem. It recovers the
#  parameters happily, and would whatever the input looked like.
#
#  Compare with `step_input_trf.conf` (same model, a gradient optimizer), which
#  also fits it -- and with `step_input_ssa_refused.conf`, which is what a
#  gradient optimizer genuinely cannot do.
#
#        pybnf -c step_input_de.conf
# -----------------------------------------------------------------------------

output_dir = output/step_input_de

edition = 2
model: step_input.bngl
bngl_backend = bngsim

job_type = de
objective = sos

experiment: timecourse, data: step_input.exp

# Three parameters of the input/decay dynamics (tau, the step time, is known).
uniform_var = k       0.1  3.0
uniform_var = J_base  0.1  5.0
uniform_var = J_step  0.1  6.0

population_size = 24
max_iterations = 60
refine = 1

verbosity = 1
