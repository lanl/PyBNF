# =============================================================================
#  What NOT to do: a gradient optimizer on a non-smooth model   (job_type = trf)
# =============================================================================
#  This conf is identical to `step_input_de.conf` except that it asks for the
#  gradient optimizer `trf`. The input rate law uses `if(t < tau, ...)`, and
#  bngsim's forward-sensitivity engine does not support the `if()` construct (it
#  raises "expression 'Input_X' ... uses unsupported construct: if() conditional").
#  PyBNF surfaces that as a clear refusal that points you at a gradient-free
#  algorithm. So for inputs written this way, use de / pso / ss / ... instead.
#
#  Try it -- the error is the lesson:
#
#        pybnf -c step_input_trf_refused.conf
#
#  (The test suite asserts this conf is refused, not that it fits.)
# -----------------------------------------------------------------------------

output_dir = output/step_input_trf_refused

edition = 2
model: step_input.bngl
bngl_backend = bngsim

# trf is a GRADIENT optimizer -> it requires a smooth model. This one is not.
job_type = trf
objective = sos

experiment: timecourse, data: step_input.exp

uniform_var = k       0.1  3.0
uniform_var = J_base  0.1  5.0
uniform_var = J_step  0.1  6.0

population_size = 3
max_iterations = 100

verbosity = 1
