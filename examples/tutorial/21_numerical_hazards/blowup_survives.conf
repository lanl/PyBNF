# =============================================================================
#  Numerical hazards 1/2:  a fit that SURVIVES a finite-time blowup
# =============================================================================
#  The model dX/dt = k*X^2 has the closed-form solution
#
#        X(t) = X0 / (1 - k*X0*t),
#
#  which is finite up to a POLE at t = 1/(k*X0) and then diverges to infinity.
#  With the true k = 0.5 and X0 = 0.2 the pole sits at t = 10, safely past the
#  data window (t_end = 8). But the optimizer does not know that: it samples k
#  across [0.1, 2.0], and any k > 0.625 pulls the pole INSIDE the window, so that
#  simulation blows up and the ODE solver fails partway through.
#
#  A failing simulation is not a crash. PyBNF scores it as +inf and the search
#  simply avoids that region. The two guards below make that robust:
#
#    * wall_time_sim  -- a per-simulation wall-clock cap. Near the pole the solver
#      can stall, taking vanishingly small steps forever; this bounds how long any
#      single evaluation may run before it is abandoned as a (timed-out) failure.
#    * max_failed_simulations -- how many failed simulations to tolerate before
#      concluding the model itself is broken. The fit aborts only if NOTHING has
#      succeeded yet AND this many sims have failed, so a run with some good
#      evaluations shrugs off the blowups (see blowup_aborts.conf for the flip
#      side, where every candidate fails and this guard stops the run).
#
#        pybnf -c blowup_survives.conf
#
#  Roughly a quarter of the evaluations fail, yet the fit completes and recovers
#  k to within a fraction of a percent.
# -----------------------------------------------------------------------------

output_dir = output/blowup_survives

edition = 2
model: quadratic_finite_time_growth.bngl
bngl_backend = bngsim

job_type = de
objective = sos

# --- the numerical-hazard guards ---------------------------------------------
wall_time_sim = 2             # abandon any single simulation after 2 s of wall-clock
max_failed_simulations = 100  # tolerate up to 100 failed sims before giving up

experiment: timecourse, data: quadratic_finite_time_growth.exp

# k > 0.625 makes the model blow up inside the window -- the search must steer
# clear of that region on its own.
uniform_var = k  0.1  2.0

population_size = 12
max_iterations = 12
refine = 1
verbosity = 1
