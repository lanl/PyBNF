# =============================================================================
#  Numerical hazards 2/2:  when EVERY candidate fails, fail loudly and fast
# =============================================================================
#  Same blowup model as blowup_survives.conf, but here the search range is placed
#  ENTIRELY inside the hazardous region: with k in [3.0, 5.0] and X0 = 0.2 the
#  pole t = 1/(k*X0) lands between t = 1.0 and t = 1.67, so EVERY simulation
#  diverges before it can reach the end of the data. No evaluation ever succeeds.
#
#  This is the failure mode `max_failed_simulations` exists for. Rather than
#  looping forever proposing candidates that can never score, PyBNF gives up once
#  it has seen `max_failed_simulations` failures with zero successes, and aborts
#  with a clear message:
#
#        Aborted because all jobs are failing
#
#  It is the guard telling you something is structurally wrong -- here, that the
#  entire search box is unsimulatable. In a real fit you would see this and fix
#  the model or widen the bounds, instead of waiting out a run that cannot finish.
#
#        pybnf -c blowup_aborts.conf      # exits with the abort message
#
#  (max_failed_simulations is set low here so the demonstration aborts quickly;
#  the default is 100.)
# -----------------------------------------------------------------------------

output_dir = output/blowup_aborts

edition = 2
model: quadratic_finite_time_growth.bngl
bngl_backend = bngsim

job_type = de
objective = sos

wall_time_sim = 2
max_failed_simulations = 24   # give up after 24 straight failures (2 generations)

experiment: timecourse, data: quadratic_finite_time_growth.exp

# The whole range blows up before t_end -- there is no simulatable k in here.
uniform_var = k  3.0  5.0

population_size = 12
max_iterations = 12
verbosity = 1
