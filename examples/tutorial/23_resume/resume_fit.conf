# =============================================================================
#  Checkpoint & resume:  never lose a long fitting run           pybnf -c ... -r
# =============================================================================
#  A cluster job hits its wall-time. A laptop sleeps. A run is just taking longer
#  than you budgeted for. PyBNF checkpoints every fitting run so you can pick up
#  where it left off instead of starting over.
#
#  As the fit runs, PyBNF pickles the whole algorithm state (the population, the
#  trajectory, the RNG) to `alg_backup.bp` in the output_dir, refreshed every
#  `backup_every` iterations. When the run finishes, that file is renamed to
#  `alg_finished.bp`. Either one is a complete restart point:
#
#    * Interrupted run (alg_backup.bp present):   resume and finish it --
#          pybnf -c resume_fit.conf -r
#
#    * Finished run you want to push further (alg_finished.bp present): resume and
#      add more iterations (a bare -r on a finished run is an error -- you must say
#      how many more) --
#          pybnf -c resume_fit.conf -r 10
#
#  The resumed run continues the SAME trajectory: the iteration counter, the
#  population, and the best-so-far all carry over, so `-r 10` above turns this
#  15-iteration fit into a 25-iteration one that ends at a lower objective than it
#  stopped at -- exactly as if it had run 25 iterations from the start.
#
#  A fixed random_seed makes the whole thing reproducible (and lets the checkpoint
#  restore the RNG so the continuation is deterministic, not a re-seed).
# -----------------------------------------------------------------------------

output_dir = output/resume_fit

edition = 2
model: decay.bngl
bngl_backend = bngsim

job_type = de
objective = sos
random_seed = 1234
initialization = lh

experiment: timecourse, data: decay.exp

uniform_var = k   0.05  3.0
uniform_var = A0  20    400

population_size = 20
max_iterations = 20
backup_every = 1        # checkpoint after every iteration (the default)
verbosity = 1
