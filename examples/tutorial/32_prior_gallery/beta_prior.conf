# =============================================================================
#  Prior gallery -- BETA:  beta_var = k2  alpha  beta
# =============================================================================
#  The prior for a quantity known to lie in a bounded range. A beta distribution
#  lives on [0, 1] -- the canonical prior for a FRACTION, a probability, or (as
#  here) a rate you know sits below 1 /day. Its two positional numbers are the two
#  shape parameters alpha and beta:
#
#        beta_var = k2  18.5  55.5          # mean = a/(a+b) = 0.25, sd ~ 0.05
#
#  The mean is alpha/(alpha+beta) and larger alpha+beta concentrates the mass;
#  alpha = 18.5, beta = 55.5 give mean 0.25 and sd ~ 0.05, again the same central
#  belief as normal/gamma but now hard-bounded to (0, 1). Unlike uniform, beta is
#  NOT a flat box -- its two numbers are shapes, not the support, so a value above
#  1 simply has zero prior density. (For a genuine [0,1] fraction this bound is a
#  feature; here k2 = 0.25 sits comfortably inside it.)
# -----------------------------------------------------------------------------

output_dir = output/beta_prior

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

job_type = dream
noise_model = normal, sigma = read_exp_file _SD
experiment: timecourse, data: bateman_chain.exp

uniform_var = k1  0.05  3.0
beta_var    = k2  18.5  55.5        # informative: support [0,1], mean 0.25, sd ~0.05

population_size = 8
max_iterations  = 1000
burn_in         = 300
sample_every    = 2
step_size       = 0.1

credible_intervals = 68 95
hist_bins = 20
output_hist_every = 2000

verbosity = 0
random_seed = 1234
