# =============================================================================
#  Prior gallery, the baseline: a FLAT prior on the weakly-identified k2
# =============================================================================
#  This lesson is the family GALLERY companion to Lesson 27. Lesson 27 made the
#  case for informative priors with a single family (gamma). Here we hold the
#  model, the data, and the sampler fixed and swap ONLY k2's prior line across
#  the whole catalog of families PyBNF ships -- normal, laplace, gamma, beta,
#  half_normal, and (via the new-era `parameter:` record) student_t -- so you can
#  see how each one is spelled and what shape of belief it encodes.
#
#  The substrate is the same as Lesson 27: the Bateman chain A -> B -> C, fit to
#  two channels of very different quality --
#
#        Obs_A  (_SD 3,  tight)  ->  A(t) = A0 exp(-k1 t) pins k1 hard
#        Obs_C  (_SD 25, loose)  ->  the only, noisy, handle on k2
#
#  so k1 is well identified and k2 is WEAKLY identified: exactly the parameter a
#  prior can help. This conf is the control -- a FLAT (uniform) prior on k2, the
#  "before the data, anything in this range is equally plausible" statement whose
#  two numbers are just the search bounds:
#
#        uniform_var = k2  0.02  2.0      (flat -> k2 posterior comes out WIDE)
#
#  Run this, then run each family conf, and compare k2 in the Results:
#
#        pybnf -c flat_prior.conf
#        pybnf -c normal_prior.conf        # ... and gamma_, laplace_, beta_,
#        pybnf -c student_t_prior.conf     #     half_normal_ in between
#
#  Results/credible95.0_final.txt -- k2's interval is WIDEST here; every
#  informative family collapses it onto a tighter interval that still brackets
#  the true 0.25, while k1 (pinned by Obs_A) never moves.
#
#  As always: a prior acts ONLY inside a Bayesian sampler (dream/mh/pt). A point
#  optimizer (de, pso, trf, ...) maximizes the likelihood and ignores the prior
#  family entirely -- so this whole lesson is a sampler.
# -----------------------------------------------------------------------------

output_dir = output/flat_prior

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

job_type = dream

# Likelihood: a Gaussian around the model with each channel's sigma read from its
# own _SD column (Obs_A_SD = 3 tight, Obs_C_SD = 25 loose).
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: bateman_chain.exp

# k1: flat, well identified by Obs_A -- IDENTICAL in every conf of this lesson.
uniform_var = k1  0.05  3.0
# k2: flat here. Each family conf replaces exactly this one line.
uniform_var = k2  0.02  2.0

# --- Sampler settings (IDENTICAL across every conf so only the prior differs) ---
population_size = 8
max_iterations  = 1000
burn_in         = 300
sample_every    = 2
step_size       = 0.1

credible_intervals = 68 95
hist_bins = 20
output_hist_every = 2000

verbosity = 0
random_seed = 1234
