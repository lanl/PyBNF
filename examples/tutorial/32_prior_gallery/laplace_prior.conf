# =============================================================================
#  Prior gallery -- LAPLACE:  laplace_var = k2  location  scale
# =============================================================================
#  The same idea as normal, but with heavier tails: a Laplace (double-exponential)
#  prior falls off like exp(-|k2 - loc|/b) instead of a Gaussian's exp(-z^2). Its
#  two positional numbers are the location (center) and the scale b:
#
#        laplace_var = k2  0.25  0.0354     # loc 0.25; b = sd/sqrt(2) -> sd 0.05
#
#  A Laplace's variance is 2*b^2, so to match the normal conf's sd of 0.05 we set
#  b = 0.05/sqrt(2) = 0.0354. The fatter tails make it more forgiving when the
#  prior and the data disagree: a Laplace prior pulls less hard on an outlying
#  likelihood than a normal of the same width. Support is all of R, like normal.
# -----------------------------------------------------------------------------

output_dir = output/laplace_prior

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

job_type = dream
noise_model = normal, sigma = read_exp_file _SD
experiment: timecourse, data: bateman_chain.exp

uniform_var = k1  0.05  3.0
laplace_var = k2  0.25  0.0354      # informative: double-exponential, loc 0.25, sd 0.05

population_size = 8
max_iterations  = 1000
burn_in         = 300
sample_every    = 2
step_size       = 0.1

credible_intervals = 68 95
hist_bins = 20
output_hist_every = 2000

verbosity = 0
random_seed = 1234
