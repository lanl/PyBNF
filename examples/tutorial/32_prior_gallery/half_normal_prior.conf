# =============================================================================
#  Prior gallery -- HALF-NORMAL (a ONE-parameter family):  half_normal_var = k2  scale
# =============================================================================
#  Some families take a SINGLE positional number. The half-normal is the right
#  half of a zero-centered Gaussian, folded onto (0, inf) -- the standard
#  weakly-informative prior for a non-negative magnitude or scale (Gelman). Its
#  one number is the scale (the underlying Gaussian's sigma):
#
#        half_normal_var = k2  0.313        # mean = scale*sqrt(2/pi) ~ 0.25
#
#  Note the DIFFERENCE from the two-number families above: half-normal's mode is
#  at 0, not at a central estimate. It does not say "k2 is about 0.25" so much as
#  "k2 is a small POSITIVE number, probably below ~0.6." That is a weaker, gentler
#  statement -- it still narrows the flat posterior (it rules out the large-k2 tail
#  the flat prior allowed) but leaves the data more room than the sharply-centered
#  normal/gamma do. Reach for it when you know a quantity is positive and roughly
#  scaled, but you do NOT have a precise independent estimate.
#
#  The other one-parameter families follow the same grammar: exponential_var = k s,
#  half_cauchy_var = k s, chisquare_var = k df, rayleigh_var = k s.
# -----------------------------------------------------------------------------

output_dir = output/half_normal_prior

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

job_type = dream
noise_model = normal, sigma = read_exp_file _SD
experiment: timecourse, data: bateman_chain.exp

uniform_var     = k1  0.05  3.0
half_normal_var = k2  0.313        # weakly-informative: positive, one scale param, mean ~0.25

population_size = 8
max_iterations  = 1000
burn_in         = 300
sample_every    = 2
step_size       = 0.1

credible_intervals = 68 95
hist_bins = 20
output_hist_every = 2000

verbosity = 0
random_seed = 1234
