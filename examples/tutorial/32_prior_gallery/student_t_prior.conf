# =============================================================================
#  Prior gallery -- STUDENT-T (a THREE-parameter family, via the record):
#        parameter: k2, prior: student_t, df: <n>, location: <c>, scale: <s>
# =============================================================================
#  A heavy-tailed, robust cousin of the normal prior: Student-t adds a third knob,
#  the degrees of freedom `df`, that dials the tail weight -- small df = fat tails
#  (very tolerant of a surprising value), df -> inf = an ordinary normal. Because
#  it has THREE parameters (df, location, scale), it cannot use the two-number
#  positional `*_var` grammar -- a third number would have no unambiguous slot. So
#  it is authored through the new-era `parameter:` RECORD, where every field is
#  named (ADR-0043/0057):
#
#        parameter: k2, prior: student_t, df: 4, location: 0.25, scale: 0.05, lower: 0, upper: 2
#
#  This is the general, fully-labeled way to declare ANY prior (see the edition-2
#  surface table in the tutorial README); it is the ONLY way to reach a >=3-param
#  family. `lower`/`upper` here truncate the otherwise-unbounded t to positive
#  rates. With df = 4 the tails are heavy: this prior says "k2 is near 0.25, but I
#  would not be shocked by a value well away from it" -- the robust choice when you
#  are unsure how trustworthy your independent estimate is.
#
#  (The same record spells the two-number families too, if you prefer named fields
#  over positional ones: `parameter: k2, prior: normal, mean: 0.25, sd: 0.05`.)
# -----------------------------------------------------------------------------

output_dir = output/student_t_prior

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

job_type = dream
noise_model = normal, sigma = read_exp_file _SD
experiment: timecourse, data: bateman_chain.exp

uniform_var = k1  0.05  3.0
parameter: k2, prior: student_t, df: 4, location: 0.25, scale: 0.05, lower: 0, upper: 2

population_size = 8
max_iterations  = 1000
burn_in         = 300
sample_every    = 2
step_size       = 0.1

credible_intervals = 68 95
hist_bins = 20
output_hist_every = 2000

verbosity = 0
random_seed = 1234
