# =============================================================================
#  Prior gallery -- GAMMA:  gamma_var = k2  shape  scale
# =============================================================================
#  The natural informative prior for a RATE: gamma has support (0, inf), so it can
#  never propose a negative rate, and it is right-skewed (a longer tail toward
#  large values). Its two positional numbers are the shape and the scale:
#
#        gamma_var = k2  25  0.01           # mean = shape*scale = 0.25
#                                           # sd   = scale*sqrt(shape) = 0.05
#
#  With shape 25, scale 0.01 the mean is shape*scale = 0.25 and the sd is
#  scale*sqrt(shape) = 0.05 -- the same "0.25 +/- 0.05" belief as the normal conf,
#  but expressed on the positive half-line where a rate actually lives. This is
#  the family Lesson 27 used; it is repeated here so the gallery is complete and
#  you can compare it side by side with the others. (PEtab imports its priors into
#  exactly this keyword -- see Lesson 15.)
# -----------------------------------------------------------------------------

output_dir = output/gamma_prior

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

job_type = dream
noise_model = normal, sigma = read_exp_file _SD
experiment: timecourse, data: bateman_chain.exp

uniform_var = k1  0.05  3.0
gamma_var   = k2  25    0.01        # informative: positive support, mean 0.25, sd 0.05

population_size = 8
max_iterations  = 1000
burn_in         = 300
sample_every    = 2
step_size       = 0.1

credible_intervals = 68 95
hist_bins = 20
output_hist_every = 2000

verbosity = 0
random_seed = 1234
