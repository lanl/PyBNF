# =============================================================================
#  Prior gallery -- NORMAL:  normal_var = k2  mean  sd
# =============================================================================
#  The textbook informative prior: a symmetric bell centered on an independent
#  estimate. Say an earlier experiment reported k2 = 0.25 +/- 0.05 /day. A normal
#  prior encodes that directly -- its two positional numbers ARE the mean and the
#  standard deviation, in the parameter's own units:
#
#        normal_var = k2  0.25  0.05        # mean 0.25, sd 0.05
#
#  Support is all of R (a normal has thin but non-zero tails everywhere), so it
#  places a little mass on negative rates. That is harmless here -- 0.25/0.05 = 5
#  sd from zero, so the sampler never visits it -- but for a quantity that must be
#  positive, gamma or half_normal (which cut off at 0 by construction) are the
#  more honest choice. Everything else in this conf is identical to
#  flat_prior.conf; only k2's line changed.
# -----------------------------------------------------------------------------

output_dir = output/normal_prior

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

job_type = dream
noise_model = normal, sigma = read_exp_file _SD
experiment: timecourse, data: bateman_chain.exp

uniform_var = k1  0.05  3.0
normal_var  = k2  0.25  0.05        # informative: Gaussian, mean 0.25, sd 0.05

population_size = 8
max_iterations  = 1000
burn_in         = 300
sample_every    = 2
step_size       = 0.1

credible_intervals = 68 95
hist_bins = 20
output_hist_every = 2000

verbosity = 0
random_seed = 1234
