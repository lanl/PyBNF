# =============================================================================
#  The cautionary contrast:  a naive sum-of-squares callable  objective = callable
# =============================================================================
#  This is robust_fit.conf with ONE thing changed: the callable points at `sse`
#  instead of `robust_nll` (both live in robust_mixture.py). `sse` is a plain
#  sum-of-squares on the SAME ten points -- no outlier component -- so it trusts
#  every point equally and the three gross outliers DRAG the fitted line off the
#  truth (m, b) = (2, 1). Run both and compare the best-fit (m, b).
#
#  (It also shows the flip side of `objective = callable`: you can drop in ANY
#  scoring rule you like -- robust or not -- just by naming a different function.)
#
#        pybnf -c naive_sse.conf
# -----------------------------------------------------------------------------

edition = 2

objective = callable
callable  = robust_mixture.py:sse

job_type = de

uniform_var = m   0    5
uniform_var = b  -5   10

population_size = 20
max_iterations = 50
verbosity = 1
random_seed = 1234
output_dir = output/naive_sse
