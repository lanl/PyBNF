# =============================================================================
#  Bring your own objective:  a custom Python callable       objective = callable
# =============================================================================
#  Every objective so far has been one PyBNF ships: a noise_model family (normal /
#  laplace / neg_bin / ...), a profile_objective (kl / wasserstein), an inline
#  `expression`, or a built-in target. When your scoring rule is none of those --
#  a mixture likelihood, a loop over replicate groups, a scipy.stats density -- you
#  write it as a PYTHON FUNCTION and point PyBNF at it:
#
#        objective = callable
#        callable  = robust_mixture.py:robust_nll
#
#  The `callable` value is a `<module-or-file>:<function>` reference. Here it is a
#  FILE PATH (robust_mixture.py) relative to this conf, then a colon, then the
#  function name -- the form to use for an ad-hoc script. (An installed, importable
#  module would be written `mypackage.mymodule:func` instead.)
#
#  THE CONTRACT.  PyBNF calls your function once per candidate parameter set:
#
#        def robust_nll(params, data=None) -> float
#
#  `params` is the current {name: value} map -- index it by the names you declare
#  below (`params['m']`, `params['b']`); bind-by-name, so declaration order does not
#  matter. Return the score to MINIMIZE (a negative log-likelihood). `data` is None
#  here: the target is SELF-CONTAINED -- the calibration measurements are embedded in
#  robust_mixture.py, so this fit needs no `model:` and no `experiment:`/`data:` line.
#
#  WHAT IT FITS.  robust_nll scores a straight line y = m*x + b against ten embedded
#  points -- seven on the true line y = 2x + 1, three gross outliers -- under a robust
#  two-component (inlier + wide-outlier) Gaussian MIXTURE likelihood (a logsumexp the
#  inline `expression` grammar cannot express). The wide component absorbs the
#  outliers, so `de` recovers (m, b) = (2, 1). Compare naive_sse.conf, whose plain
#  sum-of-squares is dragged off by the same three outliers.
#
#  GRADIENT-FREE.  A general Python callable is not JAX-traceable, so use a
#  gradient-free method (`de` here); `job_type = hmc` refuses a callable target.
#
#        pybnf -c robust_fit.conf
# -----------------------------------------------------------------------------

edition = 2

objective = callable
callable  = robust_mixture.py:robust_nll

job_type = de

# The line's slope and intercept -- the names robust_nll indexes out of `params`.
uniform_var = m   0    5
uniform_var = b  -5   10

population_size = 20
max_iterations = 50
verbosity = 1
random_seed = 1234
output_dir = output/robust_fit
