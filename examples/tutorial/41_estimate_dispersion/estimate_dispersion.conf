# =============================================================================
#  Estimating the over-dispersion of COUNT data      (dynamic negative binomial)
# =============================================================================
#  Lessons 18 and 28 fit integer COUNT data with the negative binomial, but with
#  the over-dispersion r PINNED (`dispersion = fix_at 40`) -- calibrated ahead of
#  time from replicate measurements. This lesson ESTIMATES it, jointly with the
#  dynamics:
#
#        noise_model = neg_bin, dispersion = fit r_disp, location = mean
#
#  `dispersion = fit r_disp` makes the over-dispersion a FREE PARAMETER you name
#  yourself (here `r_disp`) and declare like any other -- NOT a hidden token. The
#  fit then maximizes the negative-binomial likelihood over both the epidemic rate
#  and the dispersion.
#
#  THE DATA are an SIS outbreak's infected count, S + I -> 2I and I -> S (see
#  sis_epidemic.bngl). The infected count I(t) rises from 10 to an endemic plateau
#  around 660, so the counts span a wide range -- good for pinning the dynamics.
#
#  WHY THIS FIT IS IDENTIFIABLE (the hard-won design rule, learned in lesson 18):
#  estimating the dispersion jointly with the count SCALE (the population size, the
#  initial infected) is weakly identified -- a bigger outbreak with a wider assumed
#  spread looks much the same. So we DESIGN the dispersion to be identifiable:
#
#    1. The count SCALE is KNOWN and held fixed: the population N, the initial
#       susceptible/infected split S0/I0 are set in the model, not fitted.
#    2. The recovery rate `gamma` is KNOWN (1 / infectious period) and held fixed
#       -- only `beta` (transmission) is fitted, so the rate is well determined.
#    3. The data are REPLICATED: 6 independent count observations at each time
#       point. Replication is what actually pins over-dispersion -- one time course
#       barely constrains it, because the dispersion is a property of the SCATTER,
#       and you need repeats to measure scatter.
#
#  `location = mean` (MANDATORY for neg_bin): the deterministic ODE computes the
#  MEAN count, and the negative binomial is right-skewed so its mean and median
#  differ; neg_bin defaults to `median`, so we say `mean` to match how the counts
#  were measured. There is NO `_SD` column and none is needed -- a count likelihood
#  sets its own scale.
#
#        pybnf -c estimate_dispersion.conf
#
#  The fit recovers beta tightly; r_disp comes back near its true value but more
#  loosely -- a dispersion is a variance-of-variance estimate, inherently noisier
#  than a rate even with replicates.
# -----------------------------------------------------------------------------

output_dir = output/estimate_dispersion

edition = 2
model: sis_epidemic.bngl
bngl_backend = bngsim

job_type = de

# The count likelihood with the over-dispersion ESTIMATED as a free parameter
# (`fit r_disp`) and I(t) read as the mean count (`location = mean`).
noise_model = neg_bin, dispersion = fit r_disp, location = mean

experiment: timecourse, data: sis_counts.exp

# The transmission rate (fitted). gamma is NOT declared here, so it stays at the
# model's known value (0.4) -- fixing the recovery rate is what keeps the fit of
# beta + the dispersion well determined.
uniform_var = beta   0.3  3.0

# The over-dispersion, estimated. A positive scale spanning a wide range, so a
# log-scale prior is natural.
loguniform_var = r_disp  2  500

population_size = 30
max_iterations = 60
refine = 1
verbosity = 1
