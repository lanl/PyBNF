# =============================================================================
#  Island-based Differential Evolution           job_type = de  +  islands
# =============================================================================
#  Differential Evolution (lesson 07) keeps ONE population. On a rugged or
#  high-dimensional landscape that single population can converge prematurely --
#  the whole swarm collapses into one basin before it has explored the others.
#
#  ISLAND DE fixes this by splitting the population into several semi-isolated
#  sub-populations ("islands"), each evolving on its own, that periodically swap a
#  few individuals ("migration"). The islands explore different regions in
#  parallel; migration spreads good solutions between them without homogenizing
#  them too fast. It is the same `job_type = de`, turned on with three extra keys:
#
#        islands         = 4     # split population_size into 4 sub-populations ...
#        migrate_every   = 10    # ... every 10 iterations, each island ...
#        num_to_migrate  = 2     # ... sends 2 individuals to the others
#
#  population_size is divided across the islands, so 40 here means 10 individuals
#  per island (at least 3 are required per island).
#
#  The test problem is a transit-compartment pharmacokinetic model: an oral dose
#  passes through two transit compartments (k_transit), is absorbed (k_abs), and is
#  eliminated (k_elim). We observe only the central/plasma compartment. That one
#  curve pins k_elim (0.96), but its objective has TWO minima in the other two rates:
#  the true k_transit = 12.76, k_abs = 9.11, and k_transit = 10.09, k_abs = 14.65,
#  which delays the dose by almost exactly the same mean time and variance. A run
#  ends at one or the other depending on its random seed (the true pair about two
#  runs in five). The README explains why, and what data would tell them apart.
#
#        pybnf -c island_de.conf
# -----------------------------------------------------------------------------

output_dir = output/island_de

edition = 2
model: transit_pk.bngl
bngl_backend = bngsim

job_type = de
objective = sos

# Only the central (plasma) compartment is measured.
experiment: timecourse, data: transit_pk.exp

uniform_var = k_transit  1.0   30.0
uniform_var = k_abs      1.0   30.0
uniform_var = k_elim     0.1    5.0

# --- island DE -----------------------------------------------------------------
population_size = 40      # 40 / 4 islands = 10 individuals per island
islands         = 4
migrate_every   = 10
num_to_migrate  = 2

max_iterations = 80

# refine = 1 polishes the best point DE found with a local optimizer. The valley the
# two minima lie in is long and narrow, and the default Simplex polish can stop
# partway along it; trf, a gradient least-squares method (lesson 01), follows it
# down to a minimum.
refine = 1
refine_method = trf
verbosity = 1
