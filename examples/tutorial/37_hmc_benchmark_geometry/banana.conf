# =============================================================================
#  HMC / NUTS on a hard geometry:  the Rosenbrock "banana"
# =============================================================================
#  Before putting HMC on a real model (lesson 38), meet the sampler on a target
#  whose shape you already know. PyBNF ships a small MENU of built-in analytical
#  targets you can name directly -- no model, no data:
#
#        gaussian, rotated_gaussian, banana, multimodal, rotated_quartic
#
#  `banana` is the Rosenbrock distribution: a long, curved, crescent-shaped
#  valley. Its log-density is
#
#        -[ (a - x1)^2 + b * (x2 - x1^2)^2 ]
#
#  with the ridge following x2 = x1^2. The strong curvature is the classic stress
#  test for samplers: a random walk crawls along the valley, while HMC/NUTS uses
#  the gradient to follow it. The density concentrates near (x1, x2) = (1, 1.5).
#
#  ## Why this is an HMC target
#  `job_type = hmc` (blackjax NUTS) requires a JAX-traceable analytical target:
#  a menu entry like this, or your own `objective = expression` (lesson 38). It
#  cannot sample a simulated BNGL/SBML model. Here the target is the whole model
#  -- the `x1`, `x2` below are its two coordinates, declared as free parameters.
#
#        pybnf -c banana.conf
#
#  ## The two knobs that matter on a curved target
#  `num_warmup` adapts the step size and mass matrix; `target_accept` sets how
#  cautious the integrator is. On the banana a small warmup / low target_accept
#  produces "divergent transitions" (PyBNF warns and tells you the draws are not
#  trustworthy). We use a long warmup and a high target_accept (0.95) here so the
#  sampler negotiates the bend cleanly -- lower them and watch the warning appear.
#  Compare with gaussian.conf, an easy round target that samples with neither.
# -----------------------------------------------------------------------------

output_dir = output/banana

edition = 2

# A built-in benchmark target: the Rosenbrock banana (a curved valley).
objective = banana, a = 1, b = 100

job_type = hmc

# The target's two coordinates, as free parameters (wide flat box around the valley).
uniform_var = x1 -4  4
uniform_var = x2 -2 20

# Long warmup + cautious integrator so the curvature does not cause divergences.
num_warmup      = 1000
num_samples     = 1000
target_accept   = 0.95
population_size = 4
max_iterations  = 1000

verbosity   = 0
random_seed = 1234
