# =============================================================================
#  The easy baseline:  HMC on a round Gaussian
# =============================================================================
#  The companion banana.conf is a hard, curved target. This one is the opposite:
#  a standard 2-D Gaussian -- round, uncorrelated, no curvature. It is the
#  sanity-check baseline every sampler should nail, and the contrast that makes
#  the banana's difficulty concrete.
#
#        objective = gaussian, mean = 0 0, variance = 1 1
#
#  is the built-in menu target N(mean, diag(variance)). With the settings below,
#  NUTS mixes immediately: the posterior of (g1, g2) is centered at (0, 0) with
#  unit standard deviation, and there are NO divergent transitions even at a
#  modest warmup -- exactly because the geometry is trivial.
#
#        pybnf -c gaussian.conf
#
#  Run this and banana.conf back to back: same sampler, same budget, wildly
#  different geometries. That gap is why lesson 38 cares about gradient-based
#  sampling for real (correlated) model posteriors.
# -----------------------------------------------------------------------------

output_dir = output/gaussian

edition = 2

objective = gaussian, mean = 0 0, variance = 1 1

job_type = hmc

uniform_var = g1 -6 6
uniform_var = g2 -6 6

num_warmup      = 500
num_samples     = 1000
population_size = 4
max_iterations  = 1000

verbosity   = 0
random_seed = 1234
