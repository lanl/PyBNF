# =============================================================================
#  Ignore the noise:  noise_model = normal, sigma = fix_at 1  (for contrast)
# =============================================================================
#  A Gaussian with a fixed, constant sigma of 1 -- which is just plain unweighted
#  least squares (every residual counts the same). On this data (a single curve
#  with CONSTANT additive noise) it recovers the rate k perfectly well: unweighted
#  least squares is unbiased when every point has the same noise.
#
#        noise_model = normal, sigma = fix_at 1
#
#  So why reach for `read_exp_file` or `fit`? Because a fixed sigma = 1 tells you
#  NOTHING about the real noise, and the objective is not a calibrated likelihood
#  you could turn into credible intervals or a properly-weighted multi-experiment
#  fit. The other two sources give you both the rate and a noise scale; this one
#  gives you only the rate.
#
#        pybnf -c fixed_sigma.conf
#
#  (This is the noise-model spelling of the familiar `objective = sos`.)
# -----------------------------------------------------------------------------

output_dir = output/fixed_sigma

edition = 2
model: decay.bngl
bngl_backend = bngsim

job_type = de

# A Gaussian with a constant sigma = 1: plain unweighted least squares.
noise_model = normal, sigma = fix_at 1

experiment: timecourse, data: decay.exp

uniform_var = k  0.05  3.0

population_size = 30
max_iterations  = 80
refine = 1

verbosity = 0
random_seed = 1234
