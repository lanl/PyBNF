# =============================================================================
#  Ignore the noise entirely:  objective = sos  (for contrast)
# =============================================================================
#  Plain unweighted least squares -- minimize the sum of squared residuals, with no
#  notion of a measurement error at all. On this data (a single curve with CONSTANT
#  additive noise) sos recovers the rate k perfectly well: unweighted least squares
#  is unbiased when every point has the same noise.
#
#        objective = sos
#
#  So why reach for chi_sq / chi_sq_dynamic? Because sos tells you NOTHING about the
#  noise, and its objective value is not a calibrated likelihood -- you cannot turn
#  it into credible intervals or a properly-weighted multi-experiment fit. chi_sq
#  (supplied noise) and chi_sq_dynamic (estimated noise) give you both the rate and
#  a noise scale; sos gives you only the rate.
#
#        pybnf -c sos.conf
# -----------------------------------------------------------------------------

output_dir = output/sos

edition = 2
model: decay.bngl
bngl_backend = bngsim

job_type = de
objective = sos

experiment: timecourse, data: decay.exp

uniform_var = k  0.05  3.0

population_size = 30
max_iterations  = 80
refine = 1

verbosity = 0
random_seed = 1234
