# =============================================================================
#  Estimate the noise:  noise_model = normal, sigma = fit <name>
# =============================================================================
#  You have a noisy decay curve but NO measured error bars -- you never quantified
#  the assay's noise. The new-era noise-model surface handles this directly: pick a
#  Gaussian family and give its sigma the source `fit`, naming a free parameter for
#  it. The fit then estimates the noise level jointly with the rate.
#
#        noise_model = normal, sigma = fit noise_level
#        loguniform_var = noise_level 0.5 30
#
#  `noise_level` is a nuisance parameter you NAME yourself -- it is not in the model
#  (so PyBNF logs a benign "could not set free parameter noise_level" while wiring it
#  into the objective instead). It is declared like any other free parameter; a
#  loguniform range is natural for a positive scale. This is the same pattern the
#  robust-objectives lesson uses for a Laplace `scale = fit noise_scale` (lesson 8).
#
#  At the optimum `noise_level` converges to (essentially) the root-mean-square
#  residual -- the maximum-likelihood noise estimate. On this data (true noise 4) it
#  lands a little low (~3.7): the ML estimate of a standard deviation is slightly
#  biased downward, and the fitted rate absorbs a sliver of the scatter. The rate k
#  recovers cleanly regardless.
#
#        pybnf -c estimated_sigma.conf
#
#  Compare with supplied_sigma.conf (same family, but sigma READ from an _SD column):
#  same k, but there you had to know the noise; here the fit told you.
#
#  (PyBNF also accepts a legacy one-token spelling, `objective = chi_sq_dynamic`, for
#  this exact model -- but it hard-codes the nuisance name `sigma__FREE`. The new-era
#  noise-model line above lets you name the parameter, so it is the way to write it.)
# -----------------------------------------------------------------------------

output_dir = output/estimated_sigma

edition = 2
model: decay.bngl
bngl_backend = bngsim

job_type = de

# A Gaussian likelihood whose sigma is ESTIMATED -- a named, fitted nuisance.
noise_model = normal, sigma = fit noise_level

experiment: timecourse, data: decay.exp

uniform_var    = k            0.05  3.0
loguniform_var = noise_level  0.5   30     # the estimated noise level (a fitted nuisance)

population_size = 30
max_iterations  = 80
refine = 1

verbosity = 0
random_seed = 1234
