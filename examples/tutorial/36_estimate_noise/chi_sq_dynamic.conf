# =============================================================================
#  Estimate the measurement noise:  objective = chi_sq_dynamic
# =============================================================================
#  You have a noisy decay curve but NO measured error bars -- you never quantified
#  the assay's noise. `chi_sq_dynamic` handles exactly this: it is a Gaussian
#  likelihood whose standard deviation is a FITTED nuisance parameter, estimated
#  jointly with the rate. So the fit reports both the rate AND the noise level it
#  inferred from the residuals.
#
#  Two lines make it work:
#
#        objective = chi_sq_dynamic          # sigma is fit, not read from _SD
#        uniform_var = sigma__FREE 0.5 30    # you MUST declare the noise nuisance
#
#  `chi_sq_dynamic` desugars to a Gaussian with `sigma = fit sigma__FREE`, so the
#  parameter named sigma__FREE must be declared as a free variable (with a plausible
#  range). It is a NUISANCE -- not in the model -- so PyBNF logs a benign "could not
#  set free parameter sigma__FREE" while wiring it into the objective instead.
#
#  At the optimum sigma__FREE converges to (essentially) the root-mean-square
#  residual -- the maximum-likelihood noise estimate. On this data (true noise 4)
#  it lands a little low (~3.7): the ML estimate of a standard deviation is slightly
#  biased downward, and the fitted rate absorbs a sliver of the scatter. The rate k
#  recovers cleanly regardless.
#
#        pybnf -c chi_sq_dynamic.conf
#
#  Compare with chi_sq.conf (same data, but the noise SUPPLIED as an _SD column):
#  same k, but there you had to know the noise; here the fit told you.
# -----------------------------------------------------------------------------

output_dir = output/chi_sq_dynamic

edition = 2
model: decay.bngl
bngl_backend = bngsim

job_type = de

# A Gaussian likelihood whose sigma is ESTIMATED (fit sigma__FREE), not read from data.
objective = chi_sq_dynamic

experiment: timecourse, data: decay.exp

uniform_var = k           0.05  3.0
uniform_var = sigma__FREE 0.5   30     # the estimated noise level (a fitted nuisance)

population_size = 30
max_iterations  = 80
refine = 1

verbosity = 0
random_seed = 1234
