# =============================================================================
#  Supply the measurement noise:  objective = chi_sq  (the baseline)
# =============================================================================
#  The classic weighted least-squares fit: a Gaussian likelihood whose per-point
#  sigma is READ from the data's _SD column. This is the right choice when you
#  measured your error bars (e.g. from replicates). Here the committed decay.exp
#  carries a constant Obs_A_SD = 4 -- the true noise level.
#
#        objective = chi_sq                  # sigma read from the _SD column
#
#  This recovers the same rate k as chi_sq_dynamic.conf -- the difference is only
#  WHERE the noise comes from: supplied here (you had to know it), estimated there
#  (the fit inferred it). If you have trustworthy error bars, supply them; if you
#  do not, let chi_sq_dynamic estimate a single constant sigma for you.
#
#        pybnf -c chi_sq.conf
# -----------------------------------------------------------------------------

output_dir = output/chi_sq

edition = 2
model: decay.bngl
bngl_backend = bngsim

job_type = de

# A Gaussian likelihood weighted by each point's own _SD column (here a constant 4).
objective = chi_sq

experiment: timecourse, data: decay.exp

uniform_var = k  0.05  3.0

population_size = 30
max_iterations  = 80
refine = 1

verbosity = 0
random_seed = 1234
