# =============================================================================
#  Supply the noise:  noise_model = normal, sigma = read_exp_file _SD  (baseline)
# =============================================================================
#  The classic weighted least-squares fit: a Gaussian likelihood whose per-point
#  sigma is READ from the data's _SD column. This is the right choice when you
#  measured your error bars (e.g. from replicates). Here the committed decay.exp
#  carries a constant Obs_A_SD = 4 -- the true noise level.
#
#        noise_model = normal, sigma = read_exp_file _SD
#
#  Same Gaussian family as estimated_sigma.conf -- only the sigma SOURCE differs
#  (`read_exp_file` here vs `fit` there). It recovers the same rate k; the
#  difference is only WHERE the noise comes from: supplied here (you had to know
#  it), estimated there (the fit inferred it).
#
#        pybnf -c supplied_sigma.conf
#
#  (This is the noise-model spelling of the familiar `objective = chi_sq`.)
# -----------------------------------------------------------------------------

output_dir = output/supplied_sigma

edition = 2
model: decay.bngl
bngl_backend = bngsim

job_type = de

# A Gaussian likelihood weighted by each point's own _SD column (here a constant 4).
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: decay.exp

uniform_var = k  0.05  3.0

population_size = 30
max_iterations  = 80
refine = 1

verbosity = 0
random_seed = 1234
