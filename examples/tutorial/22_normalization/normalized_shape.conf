# =============================================================================
#  Normalization 1/2:  fit shape-only (normalized) data          normalization
# =============================================================================
#  Real measurements often arrive without an absolute scale: a fluorescence trace
#  in detector units, a Western blot in arbitrary intensity, a reading normalized
#  to its own baseline (dF/F0) or to its peak (% of max). The NUMBER is arbitrary;
#  only the SHAPE of the curve carries the kinetics.
#
#  `conversion.exp` is exactly that -- the A -> B conversion recorded in arbitrary
#  units and then normalized, the way an experimentalist reports it:
#    * Obs_A (the reactant) divided by its initial reading  -> starts at 1, decays
#    * Obs_B (the product)  divided by its peak reading      -> rises from 0 to 1
#  Whatever unknown detector gain multiplied the raw signal has cancelled out.
#
#  To compare the model to such data, PyBNF must normalize the SIMULATION the same
#  way before scoring. That is what the `normalization` lines below do -- one per
#  observable, because the two columns were normalized differently:
#
#        normalization Obs_A = init     # divide the simulated Obs_A by its t=0 value
#        normalization Obs_B = peak     # divide the simulated Obs_B by its maximum
#
#  Now the (unitless) simulated shape is matched against the (unitless) data shape,
#  and the one thing that shapes both -- the rate k -- is recovered, even though
#  neither A0 nor the detector gain is known or fitted.
#
#        pybnf -c normalized_shape.conf
#
#  Normalization types: `init` (divide by the first point), `peak` (divide by the
#  max), `zero` (z-score: subtract the mean, divide by the sd), `unit` (rescale to
#  [0, 1]). Whole-fit form `normalization = <type>` applies one type to every
#  observable; the per-observable form used here overrides it column by column.
# -----------------------------------------------------------------------------

output_dir = output/normalized_shape

edition = 2
model: conversion.bngl
bngl_backend = bngsim

job_type = de
objective = sos

# Normalize each simulated observable the same way the data was normalized.
normalization Obs_A = init
normalization Obs_B = peak

experiment: timecourse, data: conversion.exp

uniform_var = k  0.05  3.0

population_size = 20
max_iterations = 20
refine = 1
verbosity = 1
