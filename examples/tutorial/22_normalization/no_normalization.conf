# =============================================================================
#  Normalization 2/2:  what happens if you FORGET to normalize
# =============================================================================
#  The cautionary twin of normalized_shape.conf: the exact same normalized data
#  (Obs_A from 1 down, Obs_B from 0 up to 1), but WITHOUT the `normalization` lines.
#
#  Now the simulation is scored on its raw scale: Obs_A starts near A0 = 100 while
#  the data starts at 1, Obs_B climbs toward ~100 while the data tops out at 1. The
#  least-squares objective is dominated by that 100x magnitude gap, which no value
#  of k can close (k is not a scale). The fit drives k to whatever shrinks the raw
#  curves fastest rather than to the value that matches the shape, and lands far
#  from the truth (k = 0.5).
#
#        pybnf -c no_normalization.conf      # recovers a badly wrong k
#
#  The lesson: normalized data needs a matching `normalization` declaration so the
#  model is compared on the same footing. (The alternative is to fit an explicit
#  scale/gain nuisance instead -- see lesson 14's observableParameters.)
# -----------------------------------------------------------------------------

output_dir = output/no_normalization

edition = 2
model: conversion.bngl
bngl_backend = bngsim

job_type = de
objective = sos

# (no `normalization` line -- the mistake this conf demonstrates)

experiment: timecourse, data: conversion.exp

uniform_var = k  0.05  3.0

population_size = 20
max_iterations = 20
refine = 1
verbosity = 1
