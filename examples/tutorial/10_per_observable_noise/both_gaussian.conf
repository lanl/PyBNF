# =============================================================================
#  Per-observable noise, part 1: ONE noise model for both reporters  (the mistake)
# =============================================================================
#  Two reporters, measured together: Obs_A (clean) and Obs_C (noisy, with three
#  outliers). This fit treats them the same -- one Gaussian noise model for the
#  whole fit:
#
#        noise_model = normal, sigma = read_exp_file _SD
#
#  Obs_A pins k1 down regardless (it is clean and depends on k1 alone). But k2
#  lives in Obs_C, and the Gaussian's least-squares fit chases Obs_C's outliers --
#  dragging k2 well off its true 0.25. The clean reporter can't protect a
#  parameter it doesn't constrain.
#
#        pybnf -c both_gaussian.conf
#        pybnf -c per_observable.conf     # the fix
#
#  You'll see k1 come back near 0.8 but k2 land ~20% low. The fix is to give the
#  noisy reporter its own robust noise model -- see per_observable.conf.
# -----------------------------------------------------------------------------

output_dir = output/both_gaussian

edition = 2
model: two_reporter.bngl
bngl_backend = bngsim

job_type = de

# ONE noise model applied to every observable: Gaussian, sigma from the data's
# _SD columns. Fine for Obs_A; wrong for the outlier-ridden Obs_C.
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: reporters.exp

uniform_var = k1  0.05  3.0
uniform_var = k2  0.02  2.0

population_size = 30
max_iterations = 60
refine = 1
verbosity = 1
