# =============================================================================
#  Per-observable noise, part 2: each reporter its own noise model   (the fix)
# =============================================================================
#  Same two reporters, but now we describe each one's noise HONESTLY. Obs_A is
#  clean, so it keeps a Gaussian model. Obs_C carries outliers, so it gets a
#  heavy-tailed Laplace model that shrugs them off (see Lesson 8 for why Laplace
#  is robust). The whole-fit line sets the default; a per-observable line
#  OVERRIDES it for one observable:
#
#        noise_model = normal, sigma = read_exp_file _SD    # default (Obs_A)
#        noise_model Obs_C = laplace, scale = fit b_C       # override for Obs_C
#
#  Now k2 -- which lives in Obs_C -- is recovered too, because its reporter's
#  outliers no longer dominate the fit. You get robustness EXACTLY where you need
#  it, without throwing away the clean reporter's precision.
#
#        pybnf -c per_observable.conf
# -----------------------------------------------------------------------------

output_dir = output/per_observable

edition = 2
model: two_reporter.bngl
bngl_backend = bngsim

job_type = de

# The whole-fit default noise model: Gaussian, sigma from the _SD columns. It
# applies to every observable that does NOT have its own override below.
noise_model = normal, sigma = read_exp_file _SD

# The override, keyed by observable name: Obs_C gets a robust Laplace model whose
# scale is estimated (b_C, a nuisance parameter). This line applies ONLY to Obs_C;
# Obs_A keeps the Gaussian default above.
noise_model Obs_C = laplace, scale = fit b_C

experiment: timecourse, data: reporters.exp

uniform_var = k1  0.05  3.0
uniform_var = k2  0.02  2.0

# The estimated Laplace scale for Obs_C (a nuisance, searched on a log scale).
loguniform_var = b_C  0.01  100

population_size = 30
max_iterations = 60
refine = 1
verbosity = 1
