# =============================================================================
#  A multi-experiment JOINT FIT: two dosing routes, one shared rate set
# =============================================================================
#  You have plasma time courses from TWO experiments on the same drug: an IV
#  bolus into the central compartment, and a bolus into the peripheral one. The
#  two curves look nothing alike -- one decays biexponentially, the other rises
#  then falls -- but they are governed by the SAME three rate constants. Rather
#  than fit each alone and hope the answers agree, you fit them TOGETHER: one
#  objective, summed over both experiments, one shared {k12, k21, ke}.
#
#  This lesson uses TWO model files, one per dosing route (they differ only in
#  which compartment the dose starts in). In new-era PyBNF a free parameter binds
#  to a model parameter by its bare id -- so declaring `uniform_var = k12 ...`
#  once binds it to `k12` in BOTH models. That is all it takes to share a
#  parameter across experiments (ADR-0034/0041).
#
#        pybnf -c joint_fit.conf
# -----------------------------------------------------------------------------

output_dir = output/joint_fit

edition = 2

# Two models -- the same kinetics, dosed two ways. Each experiment names the one
# it runs against; both share the free parameters below.
model: central_bolus.bngl
model: peripheral_bolus.bngl
bngl_backend = bngsim

job_type = de
objective = sos

# Experiment 1: the central (IV) bolus -- plasma starts high and decays.
experiment: central,    model: central_bolus.bngl,    data: central_dose.exp
# Experiment 2: the peripheral bolus -- plasma starts at zero and rises, then falls.
experiment: peripheral, model: peripheral_bolus.bngl, data: peripheral_dose.exp

# One shared rate set. Each name binds to the identically-named parameter in BOTH
# models, so the fit explains both curves with a single {k12, k21, ke}. The central
# route mostly constrains k12 + ke; the peripheral route's rise pins k21 -- together
# they determine all three more tightly than either route alone.
uniform_var = k12  0.05  3.0
uniform_var = k21  0.05  3.0
uniform_var = ke   0.05  3.0

population_size = 24
max_iterations = 40
refine = 1
verbosity = 1
