# =============================================================================
#  Interop 1/3: fit the BNGL model                     model: decay.bngl
# =============================================================================
#  The baseline. A BNGL model, simulated in-process by bngsim, fit to decay.exp.
#  Its BNGL observable `Obs_A` matches the data column directly, so no measurement
#  model is needed. Compare the recovered k with the SBML and Antimony fits --
#  same dynamics, same data, same answer.
#
#        pybnf -c fit_bngl.conf
# -----------------------------------------------------------------------------

output_dir = output/fit_bngl

edition = 2
model: decay.bngl
bngl_backend = bngsim

job_type = de
objective = sos

experiment: timecourse, data: decay.exp

uniform_var = k  0.05  3.0

population_size = 20
max_iterations = 40
refine = 1
verbosity = 1
