# =============================================================================
#  Interop 2/3: fit the Antimony model                 model: decay.ant
# =============================================================================
#  The SAME dynamics, written in Antimony instead of BNGL. Two things change:
#
#    * `sbml_backend = bngsim` -- an Antimony (.ant) model is converted to SBML at
#      load and simulated by bngsim (the new-era backend). PyBNF selects this path
#      automatically from the `.ant` extension.
#    * `observable: Obs_A, formula: A` -- an SBML/Antimony model reports its
#      SPECIES (here `A`), not named observables, so we add a measurement model
#      (Lesson 14) to expose the species `A` as the `Obs_A` column the data uses.
#
#  Everything else is identical to fit_bngl.conf, and it recovers the same k.
#
#        pybnf -c fit_antimony.conf
# -----------------------------------------------------------------------------

output_dir = output/fit_antimony

edition = 2
model: decay.ant
# Antimony/SBML models simulate through bngsim in the new era.
sbml_backend = bngsim

job_type = de
objective = sos

# Map the model's species `A` onto the data's `Obs_A` column.
observable: Obs_A, formula: A

experiment: timecourse, data: decay.exp

# `k` is the Antimony model's rate parameter, bound by name.
uniform_var = k  0.05  3.0

population_size = 20
max_iterations = 40
refine = 1
verbosity = 1
