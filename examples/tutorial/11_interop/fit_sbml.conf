# =============================================================================
#  Interop 3/3: fit the SBML model                     model: decay.xml
# =============================================================================
#  The SAME dynamics again, this time as an SBML file (the community exchange
#  format, e.g. a model downloaded from BioModels). bngsim ingests the SBML
#  directly; as with the Antimony fit, a measurement model exposes the species
#  `A` as the `Obs_A` column. Same data, same recovered k as the other two.
#
#        pybnf -c fit_sbml.conf
# -----------------------------------------------------------------------------

output_dir = output/fit_sbml

edition = 2
model: decay.xml
# SBML (.xml) models simulate through bngsim in the new era.
sbml_backend = bngsim

job_type = de
objective = sos

# Expose the SBML species `A` as the data's `Obs_A` column.
observable: Obs_A, formula: A

experiment: timecourse, data: decay.exp

uniform_var = k  0.05  3.0

population_size = 20
max_iterations = 40
refine = 1
verbosity = 1
