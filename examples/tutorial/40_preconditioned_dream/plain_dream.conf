# =============================================================================
#  Plain DREAM  --  the contrast for preconditioned_dream.conf     job_type = dream
# =============================================================================
#  This is preconditioned_dream.conf with ONE line changed: job_type = dream
#  instead of p_dream (and no `precondition_adapt`, which only p_dream reads).
#  Run both on the same correlated (alpha, gamma) posterior and compare -- plain
#  DREAM samples the same ridge with its archive-based differential-evolution
#  proposals, while p_dream additionally whitens those proposals by the running
#  covariance so they move ALONG the tilt.
#
#      pybnf -c plain_dream.conf
# -----------------------------------------------------------------------------

output_dir = output/plain_dream

edition = 2
model: oscillator.bngl
bngl_backend = bngsim

job_type = dream
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: oscillator.exp

uniform_var = alpha  0.1  5.0
uniform_var = gamma  0.1  5.0

population_size = 8
max_iterations  = 1500
burn_in         = 500
sample_every    = 2

credible_intervals = 68 95
hist_bins = 20
output_hist_every = 100000
verbosity = 0
random_seed = 1234
