# =============================================================================
#  Preconditioned DREAM  --  sampling a strongly correlated posterior
#                                                             job_type = p_dream
# =============================================================================
#  Lessons 17/27/32 sampled posteriors with DREAM, and lesson 39 (`am`) showed
#  why a TILTED posterior is hard: a good proposal step along one axis is a bad
#  step along the correlated diagonal, so a fixed-shape proposal mixes slowly.
#
#  PRECONDITIONED DREAM (`p_dream`) is DREAM(ZS) with its differential-evolution
#  proposals computed in a COVARIANCE-WHITENED parameter space. It watches the
#  draws it has already taken, estimates their covariance, and transforms every
#  proposal through that covariance -- so its moves run ALONG the posterior's
#  ridge (big steps in the well-determined direction, small steps across it)
#  instead of fighting the tilt. Before it has seen enough samples to estimate
#  the covariance it behaves exactly like plain `dream`; after `precondition_adapt`
#  iterations, the whitening switches on.
#
#  THE POSTERIOR HERE IS DELIBERATELY CORRELATED.  The model is the linearized
#  Lotka-Volterra oscillator (lesson 07). Its oscillation frequency is
#  omega = sqrt(alpha*gamma), which the data pins down tightly (it is just the
#  period). But that leaves the two rates free to trade off along the hyperbola
#  alpha*gamma = const -- so the (alpha, gamma) posterior is a long, thin,
#  strongly ANTI-correlated ridge (correlation about -0.99). That tilt is what
#  preconditioning is built for, and what makes this a better showcase than a
#  round posterior.
#
#      pybnf -c preconditioned_dream.conf
#
#  Compare against plain_dream.conf (same everything, job_type = dream) to see the
#  two sample the same ridge -- p_dream just whitens its proposals to follow it.
# -----------------------------------------------------------------------------

output_dir = output/preconditioned_dream

edition = 2
model: oscillator.bngl
bngl_backend = bngsim

job_type = p_dream
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: oscillator.exp

# Uniform priors on the two rates. The frequency sqrt(alpha*gamma) is well
# constrained; the individual rates are correlated along it.
uniform_var = alpha  0.1  5.0
uniform_var = gamma  0.1  5.0

# --- Sampler settings ---
population_size = 8        # 8 chains draw donor differences from a shared ZS archive
max_iterations  = 1500
burn_in         = 500      # discard warm-up
sample_every    = 2        # thin every 2nd step

# --- The one knob p_dream adds beyond dream ---
# Iterations of plain DREAM before the covariance preconditioner switches on.
# The sampler needs some samples first to estimate the covariance it whitens by;
# the default is burn_in // 2, set here explicitly so the mechanic is visible.
precondition_adapt = 250

credible_intervals = 68 95
hist_bins = 20
output_hist_every = 100000
verbosity = 0
random_seed = 1234
