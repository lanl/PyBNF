# =============================================================================
#  State-dependent noise:  sigma = prediction_formula sd_abs + sd_rel*<obs>
# =============================================================================
#  You have a noisy decay curve whose scatter is BIGGER where the signal is bigger --
#  a combined additive+proportional error model. Neither of PyBNF's fixed sources fits:
#  it is not a constant sigma (lesson 36), not a data column (lesson 35's _SD), not a
#  constant-relative lognormal (lesson 42). The scatter is a FUNCTION OF THE PREDICTION:
#
#        sigma(t) = sd_abs + sd_rel * A(t)
#
#  an additive floor `sd_abs` plus a term proportional to the predicted signal `A`. The
#  new-era noise-model surface expresses this directly with the `prediction_formula`
#  sigma source, whose expression references a model observable (here `Obs_A`):
#
#        noise_model = gaussian, sigma = prediction_formula sd_abs + sd_rel*Obs_A
#        loguniform_var = sd_abs 0.1 50
#        loguniform_var = sd_rel 0.005 2
#
#  `sd_abs` and `sd_rel` are nuisance parameters you NAME yourself (not in the model, so
#  PyBNF logs a benign "could not set free parameter ..." while wiring them into the
#  objective instead). At each scored point sigma is evaluated with sd_abs / sd_rel from
#  the current parameter set and `Obs_A` read from the CURRENT SIMULATION -- so the noise
#  scale rides the fitted trajectory, not the raw data (a bug that read the measured value
#  would score a different likelihood). This is the noise-side peer of a measurement model
#  (ADR-0075): a Gaussian NLL whose scale depends on the model output.
#
#        pybnf -c state_dependent_noise.conf
#
#  The fit recovers the rate k tightly and the two noise coefficients loosely (a combined
#  error model's floor and slope are weakly identified: the high-signal early points pin
#  sd_rel, the low-signal tail pins sd_abs). There is no _SD column in decay.exp -- sigma is
#  estimated, not supplied.
#
#  NOTE: a prediction-dependent sigma couples the scale to the prediction, which the
#  gradient/EFIM path does not yet model, so use a gradient-free optimizer (de here); a
#  gradient fit (e.g. lbfgs) would raise GradientNotSupported (ADR-0075).
# -----------------------------------------------------------------------------

output_dir = output/state_dependent_noise

edition = 2
model: decay.bngl
bngl_backend = bngsim

job_type = de

# A Gaussian likelihood whose sigma is a FUNCTION OF THE PREDICTED STATE -- a combined
# additive floor + signal-proportional term, its two coefficients estimated as nuisances.
noise_model = gaussian, sigma = prediction_formula sd_abs + sd_rel*Obs_A

experiment: timecourse, data: decay.exp

uniform_var    = k       0.05   3.0
loguniform_var = sd_abs  0.1    200    # the additive noise floor        (a fitted nuisance)
loguniform_var = sd_rel  0.005  2      # the signal-proportional coefficient (a fitted nuisance)

population_size = 30
max_iterations  = 80
refine = 1

verbosity = 0
random_seed = 1234
