# =============================================================================
#  Fusing heterogeneous data in ONE fit: kinetics + equilibrium + qualitative
# =============================================================================
#  Real parameter estimation rarely rests on a single dataset. You have a time
#  course from one assay, a steady-state dose-response from another, and things
#  you qualitatively know to be true. PyBNF fits ONE parameter set to ALL of them
#  at once: list several `experiment:` lines, each with its own data file and its
#  own protocol, and every experiment shares the fitted parameters.
#
#  Here three DIFFERENT kinds of data constrain the reversible reaction A <-> B:
#
#    1. relaxation.exp  -- a TIME COURSE. B rises from 0 toward equilibrium; the
#       relaxation rate is kf + kr. (An ordinary time-course experiment.)
#    2. titration.exp   -- a STEADY-STATE dose-response. Its independent variable
#       is the total amount A0 (not time), so PyBNF runs each total to STEADY
#       STATE and reads the equilibrium B. This sees the ratio kf/kr only.
#    3. qualitative.prop -- QUALITATIVE facts (BPSL): B starts near 0, B overtakes
#       A, B plateaus high. Scored by how much a trajectory violates them.
#
#  Why fuse them? The equilibrium titration is STRUCTURALLY unable to separate kf
#  from kr -- it only constrains their ratio (the equilibrium constant). The
#  relaxation kinetics supply the missing timescale (kf + kr). Neither pins both
#  rates alone; together they do. (Try commenting out the `relax` line: the fit
#  keeps the right ratio but the individual rates drift -- see the README.)
#
#        pybnf -c data_fusion.conf
# -----------------------------------------------------------------------------

output_dir = output/data_fusion

edition = 2
model: reversible_conversion.bngl
bngl_backend = bngsim

job_type = de
objective = chi_sq

# Three experiments, three data types, one shared (kf, kr). Each has its own protocol,
# inferred from its data: relaxation.exp has a `time` column (a time course);
# titration.exp has an `A0` column (a steady-state parameter scan); qualitative.prop
# is BPSL constraints (needs a t_end to know how long to simulate before checking).
experiment: relax,       data: relaxation.exp
experiment: titration,   data: titration.exp
experiment: qualitative, data: qualitative.prop, t_end: 8

uniform_var = kf  0.05  3.0
uniform_var = kr  0.02  2.0

population_size = 24
max_iterations = 60
refine = 1
verbosity = 1
