# =============================================================================
#  The contrast: no head start          uniform priors + the same tiny budget
# =============================================================================
#  Same model, same data, same tiny budget (10 chains, 8 iterations, no refine) as
#  prior_seeded.conf -- but flat `uniform_var` priors over the whole wide box. With
#  no informative prior to draw from, the initial population is scattered uniformly
#  across [0.1, 5.0]^2, and eight iterations are nowhere near enough to climb out of
#  the oscillator's wrong-frequency local minima. The fit lands far from the truth.
#
#  That is the point of the pair: on a hard landscape with a small budget, WHERE the
#  initial population starts decides whether you find the basin. A good prior
#  (prior_seeded.conf) seeds it in the right place; flat bounds leave the optimizer
#  to search from scratch. (Give this conf a real budget + refine -- as in lesson 07
#  -- and it recovers too; the tiny budget here is what isolates the initialization
#  effect.)
#
#  Note: `initialization_distribution = bounds` would draw uniformly within each
#  parameter's FINITE bounds. That needs bounded priors (uniform_var / loguniform_var);
#  an unbounded prior like normal_var has no finite bounds to draw from, which is why
#  `prior` is the default.
#
#        pybnf -c uninformed.conf
# -----------------------------------------------------------------------------

output_dir = output/uninformed

edition = 2
model: oscillator.bngl
bngl_backend = bngsim

job_type = de
objective = sos

experiment: timecourse, data: oscillator.exp

# Flat uniform priors over the whole box -- no informative seeding.
uniform_var = alpha  0.1  5.0
uniform_var = gamma  0.1  5.0

initialization = lh
initialization_distribution = bounds       # uniform within the finite uniform_var bounds

population_size = 10
max_iterations  = 8       # same tiny budget as prior_seeded.conf, no refine
verbosity = 1
random_seed = 1234
