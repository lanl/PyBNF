# =============================================================================
#  Where the initial population comes from     initialization_distribution = prior
# =============================================================================
#  Before a population optimizer takes its first step, it has to DRAW an initial
#  population. Two config keys control that draw:
#
#    * `initialization`               -- HOW the points are spread: `lh` (Latin
#                                        hypercube, space-filling -- the default) or
#                                        `rand` (independent uniform draws).
#    * `initialization_distribution`  -- WHERE they are drawn FROM: `prior` (each
#                                        parameter's own prior distribution -- the
#                                        default) or `bounds` (uniform within finite
#                                        bounds).
#
#  This conf shows the payoff of drawing from an INFORMATIVE prior. We give each
#  rate a `normal_var` prior centred near the truth (a modeller's prior belief) --
#
#        normal_var = alpha  1.2  0.2      # prior mean 1.2, sd 0.2
#        normal_var = gamma  0.8  0.15
#
#  -- and, because `initialization_distribution = prior` is the default, the initial
#  population is drawn FROM those normals. That seeds the search right where you
#  believe the answer is, so even a TINY budget (10 chains, 8 iterations, no refine)
#  lands on (alpha, gamma) = (1.2, 0.8). Compare uninformed.conf, which searches the
#  same landscape from flat uniform priors on the same tiny budget and can't find it.
#
#  The prior still only SEEDS the optimizer -- the data (the sum-of-squares
#  objective) is what the fit actually minimizes; a wrong prior would just cost you
#  the head start, not bias the answer. (For a Bayesian sampler the prior also shapes
#  the posterior -- lessons 15/27/32.)
#
#        pybnf -c prior_seeded.conf
# -----------------------------------------------------------------------------

output_dir = output/prior_seeded

edition = 2
model: oscillator.bngl
bngl_backend = bngsim

job_type = de
objective = sos

experiment: timecourse, data: oscillator.exp

# Informative normal priors near the truth. With initialization_distribution =
# prior (the default), the initial population is drawn from these -> a head start.
normal_var = alpha  1.2  0.2
normal_var = gamma  0.8  0.15

initialization = lh                        # space-filling draw (the default)
initialization_distribution = prior        # draw from the priors above (the default)

population_size = 10
max_iterations  = 8       # a deliberately tiny budget, no refine -- the seed is what carries it
verbosity = 1
random_seed = 1234
