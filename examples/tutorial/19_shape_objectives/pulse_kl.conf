# =============================================================================
#  Fitting a SHAPE, not point values      (a column-joint KL objective)
# =============================================================================
#  Sometimes you know the SHAPE of a signal but not its absolute scale: a detector
#  reports fluorescence in arbitrary units, a readout is normalized, gain drifts
#  between runs. Least squares can't cope -- it compares point to point, so an
#  unknown multiplier on the data ruins every residual.
#
#  A PROFILE OBJECTIVE compares the shape of the whole column at once. It normalizes
#  both the simulated and the measured pulse to a probability distribution over time
#  and scores how different those distributions are -- so any overall multiplier on
#  the data cancels. In edition 2:
#
#        profile_objective = kl
#
#  `kl` is the Kullback-Leibler (cross-entropy) distance between the two normalized
#  profiles -- a statistical, likelihood-flavored shape match. Its sibling
#  `profile_objective = wasserstein` (see pulse_wasserstein.conf) is a geometric
#  earth-mover distance; the two span the family. Either one recovers k1 and k2 from
#  the pulse shape, even though the committed data is in ARBITRARY units (scaled up
#  by 1000 -- try scaling it by anything else and the fit is unchanged).
#
#        pybnf -c pulse_kl.conf
#
#  A profile objective is WHOLE-FIT and scale-free, so it takes NO per-point
#  `noise_model` and no `_SD` column -- it is its own objective. (One caveat: the
#  pulse shape is symmetric under swapping k1 and k2 -- the classic PK "flip-flop"
#  ambiguity -- so the bounds below encode the prior knowledge that the rise (k1) is
#  faster than the tail (k2), which picks the intended solution.)
# -----------------------------------------------------------------------------

output_dir = output/pulse_kl

edition = 2
model: pulse.bngl
bngl_backend = bngsim

job_type = de

# A column-joint SHAPE objective: normalize each observable to a distribution over
# time and match the shapes (KL cross-entropy). Scale-free, whole-fit -- no
# noise_model, no _SD.
profile_objective = kl

experiment: timecourse, data: pulse_shape.exp

# Bounds separated to resolve the k1<->k2 flip-flop symmetry: the rise is faster.
uniform_var = k1  0.3   3.0
uniform_var = k2  0.05  0.3

population_size = 40
max_iterations = 80
refine = 1
verbosity = 1
