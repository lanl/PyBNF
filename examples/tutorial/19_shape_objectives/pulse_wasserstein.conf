# =============================================================================
#  The other end of the shape family      (a Wasserstein / earth-mover objective)
# =============================================================================
#  Same pulse, same arbitrary-units data, same goal as pulse_kl.conf -- but a
#  different way to measure how far two shapes are apart:
#
#        profile_objective = wasserstein
#
#  Where `kl` is a statistical cross-entropy, the 1-Wasserstein (earth-mover)
#  distance is GEOMETRIC: normalize each profile to a distribution over time, then
#  measure the least total "mass transport" needed to morph the simulated pulse into
#  the measured one (the integral of the gap between their CDFs). It is forgiving of
#  small vertical wiggles and sensitive to where the pulse SITS in time -- a good
#  match when the peak's position and spread are what matter.
#
#        pybnf -c pulse_wasserstein.conf
#
#  Like `kl`, it is whole-fit and scale-free -- no per-point `noise_model`, no _SD
#  column -- and it recovers the same k1, k2 from the shape. Run it beside the KL
#  fit to see two members of the `profile_objective` family land on the same answer
#  from opposite definitions (likelihood vs distance).
# -----------------------------------------------------------------------------

output_dir = output/pulse_wasserstein

edition = 2
model: pulse.bngl
bngl_backend = bngsim

job_type = de

# The geometric end of the shape family: 1-Wasserstein (earth-mover) distance
# between the normalized profiles. Scale-free, whole-fit.
profile_objective = wasserstein

experiment: timecourse, data: pulse_shape.exp

# Bounds separated to resolve the k1<->k2 flip-flop symmetry: the rise is faster.
uniform_var = k1  0.3   3.0
uniform_var = k2  0.05  0.3

population_size = 40
max_iterations = 80
refine = 1
verbosity = 1
