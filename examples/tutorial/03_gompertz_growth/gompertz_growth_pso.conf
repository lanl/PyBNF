# =============================================================================
#  Particle swarm + a local polish        job_type = pso, refine = 1
# =============================================================================
#  Gompertz growth, dX/dt = r*X*ln(K/X). We recover r and K with Particle Swarm
#  Optimization, then REFINE the best particle with a local Simplex search -- the
#  standard two-stage recipe (global explore -> local polish) that PyBNF fits
#  usually finish with.
#
#        pybnf -c gompertz_growth_pso.conf
# -----------------------------------------------------------------------------

output_dir = output/gompertz_growth_pso

edition = 2
model: gompertz_growth.bngl
bngl_backend = bngsim

# pso = Particle Swarm Optimization. Each candidate ("particle") flies through
# parameter space, pulled toward its own and the swarm's best-seen point. It is
# asynchronous and parallel -- a good general-purpose global optimizer.
job_type = pso
objective = sos

experiment: timecourse, data: gompertz_growth.exp

uniform_var = r  0.05  3.0
uniform_var = K  20    400

population_size = 20
max_iterations = 50

# refine = 1 polishes the swarm's best point with a local optimizer once the
# global search finishes. `refine_method` chooses which -- sim (Nelder-Mead
# Simplex, the default), powell, or cmaes.
refine = 1
refine_method = sim

verbosity = 1
