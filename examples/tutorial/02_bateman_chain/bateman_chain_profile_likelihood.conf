# =============================================================================
#  How well is each rate pinned down? Profile likelihood
#                                              job_type = profile_likelihood
# =============================================================================
#  A fit gives a best value for each parameter -- but how confident should you
#  be in it? Profile likelihood (the Data2Dynamics method) answers that: for
#  each parameter it walks the value away from its optimum, re-optimizing all the
#  others at each step, and watches how fast the fit worsens. From that curve it
#  reads a confidence interval and an identifiability verdict.
#
#  With all three species observed, both rate constants are well-determined, so
#  each earns a finite two-sided confidence interval — classification
#  "identifiable". (Contrast bateman_A_only_profile_likelihood.conf.)
#
#        pybnf -c bateman_chain_profile_likelihood.conf
#
#  Outputs land in Results/: profile_likelihood_summary.txt (the CI + verdict
#  table) and profile_<param>.txt (the profile curve for each parameter).
# -----------------------------------------------------------------------------

output_dir = output/bateman_chain_profile_likelihood

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

# profile_likelihood first polishes to the best fit, then profiles each
# parameter around it. (Gradient-based inside, so it shares trf's requirements:
# a smooth model on the bngsim backend.)
job_type = profile_likelihood
objective = sos

experiment: timecourse, data: bateman_chain.exp

uniform_var = k1  0.05  3.0
uniform_var = k2  0.02  2.0

# Confidence level for the intervals: 0.95 -> a delta-chi-square threshold of 3.84.
profile_likelihood_confidence = 0.95
# Step size for walking each parameter, and the max points allowed per side.
profile_likelihood_step = 0.05
profile_likelihood_max_points = 20

population_size = 1
max_iterations = 100
verbosity = 1
