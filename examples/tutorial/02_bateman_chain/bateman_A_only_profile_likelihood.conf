# =============================================================================
#  Non-identifiability, made visible               job_type = profile_likelihood
# =============================================================================
#  The same chain A --k1--> B --k2--> C, but now we only observe A. Since
#
#        A(t) = A0 · exp(-k1 · t)
#
#  depends on k1 alone and NOT on k2, the data can say nothing about k2: you can
#  set it to anything and re-optimize k1 at no cost to the fit. Profile
#  likelihood detects exactly this — k2's profile is flat.
#
#  Expected verdicts (see Results/profile_likelihood_summary.txt):
#     k1 -> "identifiable"                    (a finite two-sided CI)
#     k2 -> "structurally non-identifiable"   (flat profile; CI spans the bounds)
#
#  This is the value of a profile-likelihood analysis: it tells you WHICH
#  parameters your data actually constrains, before you over-interpret a fit.
#
#        pybnf -c bateman_A_only_profile_likelihood.conf
# -----------------------------------------------------------------------------

output_dir = output/bateman_A_only_profile_likelihood

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

job_type = profile_likelihood
objective = sos

# Only A is measured (bateman_A_only.exp has a single Obs_A column).
experiment: timecourse, data: bateman_A_only.exp

uniform_var = k1  0.05  3.0
uniform_var = k2  0.02  2.0

profile_likelihood_confidence = 0.95
profile_likelihood_step = 0.05
profile_likelihood_max_points = 20

population_size = 1
max_iterations = 100
verbosity = 1
