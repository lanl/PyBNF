# =============================================================================
#  Fit a multi-species chain with differential evolution      job_type = de
# =============================================================================
#  A --k1--> B --k2--> C, observed as three time courses at once. We recover the
#  two rate constants k1 and k2 with differential evolution -- a population-based
#  GLOBAL optimizer that needs no gradients (so, unlike Lesson 1's trf, it makes
#  no smoothness demands on the model).
#
#        pybnf -c bateman_chain_de.conf
# -----------------------------------------------------------------------------

output_dir = output/bateman_chain_de

edition = 2
model: bateman_chain.bngl
bngl_backend = bngsim

# de = Differential Evolution. A population of candidate parameter sets is
# evolved toward lower objective values. Robust and general-purpose.
job_type = de

# No per-point _SD columns in the data -> plain sum of squares.
objective = sos

# One experiment binds all three observable columns (Obs_A, Obs_B, Obs_C). They
# are scored jointly -- the fit must reproduce every species at once.
experiment: timecourse, data: bateman_chain.exp

# The two rate constants, searched on a linear scale bracketing the truth.
uniform_var = k1  0.05  3.0
uniform_var = k2  0.02  2.0

# Differential evolution keeps a population of `population_size` candidates and
# runs for `max_iterations` generations.
population_size = 24
max_iterations = 50

# Finish with a local Simplex polish so the zero-noise fit lands exactly on the
# optimum (see Lesson 3 for more on refinement).
refine = 1

verbosity = 1
