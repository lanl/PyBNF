# =============================================================================
#  Moment equations:  fit the MEAN and the VARIANCE as observables
# =============================================================================
#  A linear birth-death-immigration process
#
#        0 -> X   (immigration, rate s)
#        X -> 2X  (birth,       rate b per individual)
#        X -> 0   (death,       rate d per individual)
#
#  has first- and second-moment ODEs that close exactly:
#
#        dMean/dt     = s + (b - d)*Mean
#        dVariance/dt = s + (b + d)*Mean + 2*(b - d)*Variance
#
#  So instead of running many stochastic trajectories and estimating moments, the
#  model IS the moment dynamics: its two ODE states are E[X](t) and Var[X](t).
#  `moments.bngl` encodes exactly those two equations, and `moments.exp` holds both
#  trajectories. We fit them JOINTLY -- two observables, three process rates.
#
#  Why both moments? The mean curve alone pins only the immigration rate s and the
#  NET growth rate b - d; it cannot separate birth from death (raise b and d
#  together and the mean is unchanged). The variance breaks that tie -- it depends
#  on the SUM b + d -- so mean + variance together identify all three rates.
#
#        pybnf -c moment_fit.conf
# -----------------------------------------------------------------------------

output_dir = output/moment_fit

edition = 2
model: moments.bngl
bngl_backend = bngsim

job_type = de
objective = sos

# Two observables: the modelled mean and variance trajectories.
experiment: timecourse, data: moments.exp

uniform_var = s           0.1   5.0
uniform_var = birth_rate  0.05  2.0
uniform_var = death_rate  0.05  3.0

population_size = 30
max_iterations = 30
refine = 1
verbosity = 1
