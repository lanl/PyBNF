# =============================================================================
#  Recover (r, K) by trust-region gradient descent            job_type = trf
# =============================================================================
#  A first taste of edition-2 PyBNF. We fit the logistic model
#
#        dN/dt = r * N * (1 - N/K)
#
#  to a single clean time course and recover the growth rate r and the carrying
#  capacity K. Because the data is noise-free the fit drives the objective to ~0
#  and lands on the true values.
#
#  Run it from this folder:
#
#        pybnf -c logistic_growth_trf.conf
#
#  Every key below is edition-2 (the modern "new era" surface). See the comments.
# -----------------------------------------------------------------------------

# Where PyBNF writes results (best fit, trajectory, per-iteration output).
output_dir = output/logistic_growth_trf

# Opt into the edition-2 configuration language. Without this line PyBNF reads
# the file as a legacy (edition-1) config and the keys below would be rejected.
edition = 2

# The model. Notice we do NOT bind data here -- the experiment below does. The
# model file has no `begin actions` block; PyBNF synthesizes the simulation from
# the experiment's measurement times.
model: logistic_growth.bngl

# Simulate with the in-process bngsim backend. Gradient fitting needs bngsim,
# because it supplies the forward output sensitivities (d output / d parameter)
# that trust-region least-squares consumes.
bngl_backend = bngsim

# The algorithm: `trf` = Trust-Region Reflective least-squares (a
# Levenberg-Marquardt-style gradient optimizer). It is the fastest, most precise
# choice for a smooth model fit to Gaussian data.
job_type = trf

# The objective. `sos` = plain sum of squared residuals, the right choice when
# the data carries no per-point standard-deviation (_SD) columns. (Use `chi_sq`
# when it does.)
objective = sos

# The experiment: a named time course bound to its measurement file. The .exp
# file's `time` column becomes the simulation output grid, and its `Obs_N`
# column (which matches the model observable name) is the data to fit.
experiment: timecourse, data: logistic_growth.exp

# The free parameters. Edition-2 binds each to the model parameter of the SAME
# name (here r and K) -- no `__FREE` suffix. `uniform_var` searches a linear
# scale between the given lower and upper bounds.
uniform_var = r  0.1  5.0
uniform_var = K  20   300

# Gradient optimizers are local, so we run a few independent starts and keep the
# global best. `population_size` sets how many; `max_iterations` caps each start.
population_size = 3
max_iterations = 100

# How chatty to be on the terminal (0 = silent, 3 = very verbose).
verbosity = 1
