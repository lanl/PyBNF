# =============================================================================
#  Fit to QUALITATIVE data (no numbers!)      constraints via a .prop file
# =============================================================================
#  Sometimes you don't have a measured time course, only qualitative facts:
#  "it starts small", "it reaches capacity", "it never overshoots". PyBNF can fit
#  to statements like these directly, using its Biological Property Specification
#  Language (BPSL). Each property becomes a penalty term; a parameter set that
#  satisfies every property scores 0.
#
#  Here we fit the logistic model to four qualitative properties
#  (logistic_growth.prop) with no quantitative data at all.
#
#        pybnf -c logistic_growth_constraints.conf
# -----------------------------------------------------------------------------

output_dir = output/logistic_growth_constraints

edition = 2
model: logistic_growth.bngl
bngl_backend = bngsim

# Gradient-free (constraint penalties aren't a smooth least-squares objective).
job_type = de
objective = sos

# A CONSTRAINT-ONLY experiment: `data:` is a .prop (not an .exp), so there is no
# measurement grid -- we give the simulation a `t_end:` to integrate to instead.
experiment: qualitative, data: logistic_growth.prop, t_end: 8

uniform_var = r  0.1  5.0
uniform_var = K  20   300

population_size = 12
max_iterations = 30
refine = 1
verbosity = 1
