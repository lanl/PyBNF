# =============================================================================
#  The same fit by a different gradient method             job_type = lbfgs
# =============================================================================
#  logistic_growth_trf.conf fits this model with `trf` -- Trust-Region Reflective
#  LEAST SQUARES, which exploits the sum-of-squares structure (it works with the
#  residual vector and its Jacobian). `lbfgs` is the other edition-2 gradient
#  optimizer: L-BFGS-B, a quasi-Newton method that works with the OBJECTIVE and its
#  gradient directly. The practical differences:
#
#    * trf is usually fastest and most precise for least-squares (`sos` / `chi_sq`)
#      fits of smooth models to Gaussian data -- its specialty;
#    * lbfgs is more GENERAL: because it only needs the scalar objective and its
#      gradient (not a residual vector), it applies to objectives that are not a sum
#      of squares -- a likelihood noise model, for instance.
#
#  On this smooth logistic fit both land on the same (r, K). Run them side by side:
#
#        pybnf -c logistic_growth_trf.conf
#        pybnf -c logistic_growth_lbfgs.conf
#
#  Both need the same ingredients as any gradient fit: edition 2, the bngsim backend
#  (for forward sensitivities), a smooth model, and LINEAR (`uniform_var`) bounds.
# -----------------------------------------------------------------------------

output_dir = output/logistic_growth_lbfgs

edition = 2
model: logistic_growth.bngl
bngl_backend = bngsim

# L-BFGS-B: a bound-constrained quasi-Newton gradient optimizer. Like trf it is
# local, so we run a few independent starts (population_size) and keep the best.
job_type = lbfgs

objective = sos

experiment: timecourse, data: logistic_growth.exp

uniform_var = r  0.1  5.0
uniform_var = K  20   300

population_size = 3
max_iterations = 100
verbosity = 1
