# =============================================================================
#  Model checking: does a model satisfy the properties?      job_type = check
# =============================================================================
#  The flip side of constraint fitting. Instead of searching for parameters that
#  satisfy the properties, `check` takes the model AS GIVEN (its current
#  parameter values, no free parameters) and reports how many properties hold.
#  It runs one simulation and no search.
#
#        pybnf -c logistic_growth_check.conf
#
#  Output (terminal + Results/): "Satisfied N out of M constraints".
# -----------------------------------------------------------------------------

output_dir = output/logistic_growth_check

edition = 2
model: logistic_growth.bngl
bngl_backend = bngsim

# The checking "algorithm" -- evaluates constraint satisfaction, no fitting.
job_type = check
objective = sos

# The same qualitative properties; the model's built-in r = 1.2, K = 100 satisfy
# all four, so a check reports 4 of 4.
experiment: qualitative, data: logistic_growth.prop, t_end: 8

# No free parameters: `check` evaluates the model exactly as written.

verbosity = 1
