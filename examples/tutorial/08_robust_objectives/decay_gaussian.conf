# =============================================================================
#  Outliers, part 1: a GAUSSIAN noise model gets dragged off      (the mistake)
# =============================================================================
#  The data is a clean exponential decay with three gross OUTLIERS spliced in
#  (a mispipetted well, a detector glitch). This fit makes the DEFAULT assumption
#  -- that the measurement noise is Gaussian:
#
#        noise_model = normal, sigma = read_exp_file _SD
#
#  A Gaussian likelihood is a least-squares fit, and least squares is dominated by
#  the largest residuals: to reduce the huge squared errors at the three bad
#  points, the optimizer bends the whole curve toward them, biasing the decay rate
#  k well away from its true value. Run this and its Laplace sibling side by side:
#
#        pybnf -c decay_gaussian.conf
#        pybnf -c decay_laplace.conf
#
#  You will see this fit recover k roughly 25-30% off the truth of 0.5 -- broken
#  by three bad points out of twenty-one. The fix is in decay_laplace.conf.
# -----------------------------------------------------------------------------

output_dir = output/decay_gaussian

edition = 2
model: contaminated_decay.bngl
bngl_backend = bngsim

job_type = de

# The NOISE MODEL is how you tell PyBNF what the residuals are assumed to look
# like. `normal` = Gaussian (the classic least-squares / chi-square assumption);
# `sigma = read_exp_file _SD` takes the per-point standard deviation from the
# data's Obs_A_SD column. This is the right choice ONLY when the noise really is
# Gaussian -- which outliers violate.
noise_model = normal, sigma = read_exp_file _SD

experiment: timecourse, data: contaminated_decay.exp

uniform_var = k   0.05  3.0
uniform_var = A0  20    400

population_size = 30
max_iterations = 60
refine = 1
verbosity = 1
