# =============================================================================
#  Outliers, part 2: a LAPLACE noise model is robust             (the fix)
# =============================================================================
#  Same model, same contaminated data as decay_gaussian.conf -- but a different
#  assumption about the noise. Instead of a Gaussian, we assume the residuals
#  follow a LAPLACE (double-exponential) distribution:
#
#        noise_model = laplace, scale = fit noise_scale
#
#  The Laplace distribution has HEAVY TAILS, so a residual ten sigmas out is far
#  less surprising than it would be under a Gaussian -- the fit is not compelled
#  to chase it. Maximizing a Laplace likelihood is least-ABSOLUTE-deviation
#  fitting, whose optimum is median-like and famously resistant to outliers. The
#  three bad points are shrugged off and k comes back on the truth.
#
#        pybnf -c decay_laplace.conf
#
#  Notice `scale = fit noise_scale`: the Laplace distribution has a scale
#  parameter (its spread), and here we ESTIMATE it -- `fit` declares `noise_scale`
#  as a free parameter, whose bounds are given by the `loguniform_var` line below.
#  It is a nuisance parameter: reported in the fit, not part of the model.
# -----------------------------------------------------------------------------

output_dir = output/decay_laplace

edition = 2
model: contaminated_decay.bngl
bngl_backend = bngsim

job_type = de

# A heavy-tailed noise model. `scale = fit noise_scale` estimates the Laplace
# spread as a free parameter (contrast decay_gaussian.conf, which read a fixed
# sigma from the data). The _SD column in the data is simply ignored here.
noise_model = laplace, scale = fit noise_scale

experiment: timecourse, data: contaminated_decay.exp

uniform_var = k   0.05  3.0
uniform_var = A0  20    400

# The estimated Laplace scale (a nuisance parameter, searched on a log scale
# because a spread can span orders of magnitude). No `__FREE` suffix, no special
# naming -- it is an ordinary free parameter that the noise model consumes.
loguniform_var = noise_scale  0.01  100

population_size = 30
max_iterations = 60
refine = 1
verbosity = 1
