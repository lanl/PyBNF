# =============================================================================
#  Outliers, part 3: a STUDENT-t noise model, with a robustness DIAL
# =============================================================================
#  The Laplace model (part 2) is robust because its tails are heavier than a
#  Gaussian's. The Student-t takes that idea and gives you a KNOB for it -- the
#  degrees of freedom, df:
#
#        noise_model = student_t, sigma = read_exp_file _SD, df = fix_at 4
#
#  df controls how heavy the tails are, and so how hard the fit tries to chase a
#  surprising residual:
#
#        df -> infinity   the Student-t IS a Gaussian (least squares, not robust)
#        df  = 4          heavy tails: outliers are tolerated, not chased
#        df -> 1          a Cauchy: extremely heavy tails, very forgiving
#
#  With df = 4 the three gross outliers in the data are shrugged off and the decay
#  rate k comes back on the truth of 0.5 -- like the Laplace fit, but now the
#  degree of robustness is an explicit, tunable choice.
#
#        pybnf -c decay_student_t.conf
#
#  Two Student-t specifics: `sigma` (the scale) is REQUIRED -- here we read it from
#  the data's _SD column, as the Gaussian fit did; `df` has a default of 4 if you
#  omit it. You CAN estimate df instead (`df = fit nu`, declaring `nu` a free
#  parameter) to let the data choose its own robustness, but df is only weakly
#  identified, so fixing it to a sensible small value is the usual choice.
# -----------------------------------------------------------------------------

output_dir = output/decay_student_t

edition = 2
model: contaminated_decay.bngl
bngl_backend = bngsim

job_type = de

# A heavy-tailed Student-t noise model. `sigma = read_exp_file _SD` takes the
# per-point scale from the data (like the Gaussian fit); `df = fix_at 4` sets the
# tail heaviness -- small df = robust. A larger df would slide back toward the
# non-robust Gaussian.
noise_model = student_t, sigma = read_exp_file _SD, df = fix_at 4

experiment: timecourse, data: contaminated_decay.exp

uniform_var = k   0.05  3.0
uniform_var = A0  20    400

population_size = 30
max_iterations = 60
refine = 1
verbosity = 1
