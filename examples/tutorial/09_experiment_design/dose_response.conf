# =============================================================================
#  Experiment design 1: a steady-state DOSE-RESPONSE          parameter_scan
# =============================================================================
#  Instead of a time course, this experiment sweeps the STIMULUS STRENGTH k_prod
#  across a set of doses and reads the STEADY-STATE level A_ss = k_prod/k_deg at
#  each one. PyBNF recognizes the design automatically from the data file: its
#  independent-variable column is `k_prod` (not `time`), so PyBNF synthesizes a
#  PARAMETER SCAN, and because no measurement time is given it runs each dose to
#  STEADY STATE (bngsim solves for the fixed point directly -- no long transient
#  integration). From the slope of A_ss vs dose we recover the degradation rate.
#
#        pybnf -c dose_response.conf
# -----------------------------------------------------------------------------

output_dir = output/dose_response

edition = 2
model: inducible_gene.bngl
bngl_backend = bngsim

job_type = de
objective = sos

# The data's first column is `k_prod` (see dose_response.exp) -- a MODEL PARAMETER,
# not time -- so PyBNF sweeps it as the dose and reads the steady-state A_tot at
# each value. No `t_end`, so every dose is taken to steady state.
experiment: doseresponse, data: dose_response.exp

# Only the degradation rate is fitted; k_prod is set per dose by the scan.
uniform_var = k_deg  0.1  10.0

population_size = 12
max_iterations = 30
refine = 1
verbosity = 1
