# =============================================================================
#  Experiment design 2: a two-phase WASHOUT           preequilibrate + condition
# =============================================================================
#  A classic protocol: pre-incubate the system with the stimulus ON until it
#  reaches steady state, THEN remove the stimulus and watch the species relax.
#  A(t) starts at the equilibrated level A_ss = k_prod/k_deg and decays as
#  A(t) = A_ss * exp(-k_deg t) -- so the whole measurement is a readout of the
#  degradation rate, provided the state CARRIES OVER from the equilibration phase.
#
#  PyBNF builds the two-phase protocol from the two lines below: a `condition`
#  defines a parameter setting, `preequilibrate:` runs one condition to steady
#  state first (unmeasured), and the experiment's own `condition:` is applied for
#  the measurement -- with state carried across the switch (no reset).
#
#        pybnf -c washout.conf
# -----------------------------------------------------------------------------

output_dir = output/washout

edition = 2
model: inducible_gene.bngl
bngl_backend = bngsim

job_type = de
objective = sos

# Two conditions, each a parameter perturbation: stimulus ON (to equilibrate) and
# stimulus OFF (the measurement).
condition: stim_on,  perturbations: Stimulus_isOn = 1
condition: stim_off, perturbations: Stimulus_isOn = 0

# The experiment: equilibrate under `stim_on` to steady state, then measure under
# `stim_off` over the data's time grid. State carries from the first phase into
# the second, so the measurement starts at the equilibrated level (not the seed A=0).
experiment: washout, preequilibrate: stim_on, condition: stim_off, data: washout.exp

uniform_var = k_deg  0.1  10.0

population_size = 12
max_iterations = 30
refine = 1
verbosity = 1
