# EGFR activation fit on the new-era (edition 2) config surface (ADR-0028).
#
# Edition-2 twin of egfr_ode.conf: the same EGFR model (Kozer et al. 2013) fit to
# BOTH a time course and a dose-response in a single job, written on the modern
# surface (`model:` / `experiment:` / `data:`, `job_type` not `fit_type`,
# `objective` not `objfunc`, free parameters bound by id -- no `__FREE`).
#
# Two independent experiments are synthesized from the data (no hand-written
# `begin actions` block -- ADR-0028; egfr_ode_v2.bngl carries none):
#
#   * timecourse   -- a time course (independent variable `time`): cluster density
#                     (pre2_time) and phospho-EGFR (pre4_time) vs. time at LT = 30 nM.
#   * doseresponse -- a parameter scan over the ligand dose LT (ADR-0046, #426):
#                     cluster density (pre1_dose) and phospho-EGFR (pre3_dose) vs.
#                     EGF dose, each dose run to a fixed endpoint t_end = 1200 s.
#
# Both data files carry per-point _SD columns, scored with chi_sq (Gaussian, sigma
# from the data). This is the highest-coverage Tier-1 example: multi-observable,
# both action kinds (time course + dose-response), and exportable priors.
#
# Run from the PyBNF root directory:
#   pybnf -c examples/egfr_ode/egfr_ode_v2.conf

#############
### PATHS ###
#############

# The directory to which job output will be written
output_dir = output/egfr_ode_v2

# BNG command - Uncomment and edit this line if you have not set the BNGPATH environment variable
# bng_command = /path/to/bng2/BNG2.pl

# Opt into the new era (select-and-freeze; ADR-0031)
edition = 2

# Model declaration (no data binds here; the experiments below introduce the data)
model: egfr_ode_v2.bngl

#######################
### General Options ###
#######################

# Delete files that are no longer needed so that the job output directory doesn't get too large
delete_old_files = 1

# Kill a simulation and move on without it if it goes over one hour
wall_time_sim = 3600

#######################
### Fitting Options ###
#######################

# Fit using differential evolution
job_type = de

# The chi-square objective (Gaussian noise, sigma read per point from the _SD columns)
objective = chi_sq

# Fitting run will use 50 iterations
max_iterations = 50

# Population of size 12
population_size = 12

# Print extra output to the terminal
verbosity = 2

###################
### Experiments ###
###################

# Time course (independent variable `time`): observables pre2_time, pre4_time at LT = 30 nM.
experiment: timecourse, data: timecourse.exp

# Dose-response: a parameter scan over the ligand dose LT (the data's independent-variable
# column). Each dose runs to a fixed endpoint t_end = 1200 s (the original used a finite
# scan endpoint, not steady state; ADR-0046). Observables pre1_dose, pre3_dose.
experiment: doseresponse, type: parameter_scan, t_end: 1200, data: doseresponse.exp

##################
### Parameters ###
##################

# Scaling factors, generated on a linear scale from 0x to 200x the published value.
uniform_var = alpha2_pre 0 60.428898
uniform_var = alpha4_pre 0 57.459326
uniform_var = alpha1_pre 0 52.4578514
uniform_var = alpha3_pre 0 82.9043918

# Rate constants, generated on a uniform log scale between 0.01x and 100x the published values.
loguniform_var = k_o 0.06 600
loguniform_var = k_c 0.016 160
loguniform_var = kaf 0.154 1540
loguniform_var = kar 0.0889 889
loguniform_var = chi_r 437 4370000
