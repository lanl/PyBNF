# multimodal benchmark - shared target (problem + budget; fit_type/output_dir + per-sampler knobs added by the harness)
model = multimodal.target : target.exp
objfunc = direct_pass

uniform_var = x1 -10 10
uniform_var = x2 -10 10

population_size = 20
max_iterations = 7000
burn_in = 5000
sample_every = 10
output_hist_every = 50
hist_bins = 50
verbosity = 2
delete_old_files = 1
wall_time_sim = 0
