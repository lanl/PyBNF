name: Set up pybnf
description: >-
  Install BioNetGen (BNG2.pl) plus pybnf and its runtime/test dependencies into
  a uv venv. bngsim comes from public PyPI by default (`bngsim` input), so the
  bngsim-marked suites actually run on hosted runners; pass `bngsim: 'false'`
  for a leg that must stay bngsim-less (a python with no cp wheel, or a job
  that does not simulate at all), and run it under PYBNF_NO_BNGSIM=1 so the
  bngsim-marked tests skip cleanly (see tests/conftest.py). BNG2.pl is required
  either way: Configuration validation execs `BNG2.pl -v` for any BNGLModel
  regardless of bngsim, and the analytical tests aside, most of the suite
  builds such configs.

inputs:
  python-version:
    description: Python version for the venv (e.g. "3.11", "3.12").
    required: true
  bngsim:
    description: >-
      Install bngsim (from public PyPI) alongside the rest of the deps.
      Default "true". Set "false" on a leg where bngsim must be absent:
      bngsim publishes manylinux_2_28_x86_64 wheels for cp310-cp313 only, so a
      newer interpreter would fall back to building the sdist (C++17 toolchain,
      CMake, Ninja) -- and jobs that never simulate (docs) do not need it. A
      "false" leg must also set PYBNF_NO_BNGSIM=1 when it runs pytest.
    required: false
    default: 'true'
  jax:
    description: >-
      Install the optional pybnf[jax] extra (jax + jaxlib + blackjax). Default
      "false": jaxlib is a large install relative to the rest of the dep set, so
      rather than pay it on every matrix leg only the dedicated HMC/gradient job
      turns it on. When "true", the jax-gated suites run for real instead of
      importorskip-skipping -- tests/test_hmc.py (the whole ADR-0059 HMC oracle,
      skipif-gated on the extra) and the jax gradient tests in
      tests/test_gradient_assembly.py. Keep the pins in sync with pyproject.toml's
      [jax] extra.
    required: false
    default: 'false'
  petab-spec:
    description: >-
      The petab requirement to install. Defaults to stock PyPI petab. A CI leg
      overrides it with upstream libpetab-python main
      (git+…/PEtab-dev/libpetab-python@main), where the native BnglModel loader
      landed (PEtab-dev/libpetab-python#508), so the exporter oracle validates
      `language: bngl` problems through petab's OWN native loader rather than the
      register_bngl() monkeypatch (ADR-0026).
    required: false
    default: 'petab>=0.8,<1'
  cache-suffix:
    description: >-
      uv cache namespace suffix. Two jobs that run the SAME python version
      through this action share one content-addressed cache key (os/arch/python/
      pyproject hash + this suffix) and race to save it -- a benign "another job
      may be creating this cache" warning. Override per job to give each its own
      namespace (e.g. the native-BNGL leg also runs 3.12, colliding with the
      matrix 3.12 job under a shared suffix).
    required: false
    default: 'pybnf'

runs:
  using: composite
  steps:
    # Provision the interpreter with setup-python rather than uv's managed
    # (python-build-standalone) builds: libroadrunner is a C++ extension that
    # dlopen's libpython, and uv's standalone builds have not reliably exposed
    # libpython on the loader path. setup-python's Pythons are built
    # --enable-shared with libpython discoverable, so roadrunner imports on
    # every matrix leg.
    - uses: actions/setup-python@v6
      id: python
      with:
        python-version: ${{ inputs.python-version }}

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        # No uv.lock in this repo; key the cache on pyproject.toml so it can
        # invalidate when deps change.
        cache-dependency-glob: pyproject.toml
        # Namespace this action's uv cache (default "pybnf") so it does not
        # collide with the lint workflow, and so a job on the same python
        # version can override it to avoid racing the matrix job's save (see the
        # cache-suffix input).
        cache-suffix: ${{ inputs.cache-suffix }}

    - name: Install BioNetGen 2.9.3
      shell: bash
      run: |
        # BioNetGen is free/open-source and provides BNG2.pl (Perl is
        # preinstalled on ubuntu runners). It is NOT vendored into the repo or
        # the pybnf wheel -- it is fetched onto the ephemeral runner each run,
        # mirroring the developer prerequisite (BNGPATH on a local machine).
        curl -fsSL \
          https://github.com/RuleWorld/bionetgen/releases/download/BioNetGen-2.9.3/BioNetGen-2.9.3-linux.tar.gz \
          -o "$RUNNER_TEMP/bionetgen.tar.gz"
        tar -xzf "$RUNNER_TEMP/bionetgen.tar.gz" -C "$RUNNER_TEMP"
        echo "BNGPATH=$RUNNER_TEMP/BioNetGen-2.9.3" >> "$GITHUB_ENV"

    - name: Create venv and install pybnf
      shell: bash
      env:
        BNGSIM: ${{ inputs.bngsim }}
        JAX: ${{ inputs.jax }}
        PETAB_SPEC: ${{ inputs.petab-spec }}
      run: |
        # Build the venv from the setup-python interpreter (see note above), not
        # a uv-managed one.
        uv venv --python "${{ steps.python.outputs.python-path }}"
        # bngsim is on public PyPI (manylinux_2_28_x86_64 + macOS + win wheels,
        # cp310-cp313), so hosted runners get the real simulation backend --
        # NFsim, RuleMonkey, libsbml, codegen and output sensitivities are all
        # compiled into the published wheel. The [antimony] extra is the one
        # capability that needs a companion PyPI package (antimony>=3.1.1, pure
        # python wheel), and it is what unskips the bngsim_antimony-marked
        # tests, so install the extra rather than bare bngsim. Keep the pin in
        # sync with pyproject.toml -- and note that asking is no longer the only
        # thing holding it there. This pin was set to 0.11.35 on 2026-07-24, when
        # that was also pyproject's floor. pyproject then moved to 0.12.0 and to
        # 0.12.2, on 2026-08-02 and 2026-08-04, and this line did not follow, so
        # for three weeks CI tested against a bngsim older than PyBNF declared it
        # needed and nothing said so. tests/test_packaging_metadata.py::
        # test_ci_action_installs_every_dependency_pyproject_declares now reads
        # both files and fails when they disagree.
        BNGSIM_SPEC=()
        if [ "$BNGSIM" = 'true' ]; then
          BNGSIM_SPEC=('bngsim[antimony]>=0.15.0,<1')
        fi
        # The optional pybnf[jax] extra (jax + jaxlib + blackjax) -- the ADR-0059
        # HMC reference sampler and the jax-gated gradient-assembly tests. Heavy
        # (jaxlib), so gated behind the `jax` input and installed only on the
        # dedicated HMC/gradient job rather than every matrix leg (#516). Keep the
        # pins in sync with pyproject.toml's [jax]/[tests] extras.
        JAX_SPEC=()
        if [ "$JAX" = 'true' ]; then
          JAX_SPEC=('jax>=0.4' 'jaxlib>=0.4' 'blackjax>=1.2')
        fi
        # Mirror pyproject.toml's runtime deps, plus the test stack (pytest,
        # hypothesis, pytest-xdist), petab, and the optional test extras that
        # otherwise leave whole suites importorskip-skipping on the runner (#516).
        # petab is BOTH the PEtab v2 export/BnglModel oracle (ADR-0025/0026 --
        # BNG2.pl is installed above, so model-level validation runs here too) AND
        # the runtime math translator backing the expression observableFormula
        # path (pybnf[petab], ADR-0035, petab.v2.math); stock PyPI petab carries
        # the math grammar, so one install covers both. The exact petab
        # requirement is the `petab-spec` input (default stock PyPI; a CI leg
        # overrides it with upstream libpetab-python main to run the NATIVE BNGL
        # loader, PEtab-dev/libpetab-python#508).
        # arviz/h5netcdf/h5py unskip the ArviZ InferenceData bridge oracle
        # (ADR-0055; tests/test_inference_data.py + the tutorial diagnostics beat)
        # and matplotlib unskips the profile-likelihood plot oracle (#467). These
        # are cheap (pure-python or small wheels) so every leg installs them; the
        # heavy jax stack is instead gated behind the `jax` input above. Keep ALL
        # of these version bounds in sync with pyproject.toml's [tests] extra --
        # anything declared there but missing here silently reverts to a skip.
        # tests/test_packaging_metadata.py checks that, for every requirement in
        # this file and in pyproject.toml, both name the same version range.
        uv pip install \
          "${BNGSIM_SPEC[@]}" \
          "${JAX_SPEC[@]}" \
          'dask>=2024.1.0' \
          'distributed>=2024.1.0' \
          'libroadrunner>=1.6.0' \
          'msgpack>=0.6.2' \
          'numpy>=1.24' \
          'paramiko>=2.7' \
          'pydantic>=2,<3' \
          'pyparsing>=2.4,<4' \
          'scipy>=1.10' \
          'tornado>=6.1' \
          'pytest>=7,<10' \
          'hypothesis>=6,<7' \
          'pytest-xdist' \
          'arviz>=0.17' \
          'h5netcdf>=1' \
          'h5py' \
          'matplotlib>=3.5' \
          "$PETAB_SPEC"
        # Install pybnf itself without re-resolving deps: on a bngsim: 'false'
        # leg a re-resolve would pull bngsim in through pyproject.toml and
        # defeat the point, and everywhere it would re-derive a dependency set
        # this step just pinned.
        uv pip install --no-deps .
