name: Set up pybnf (bngsim-less)
description: >-
  Install BioNetGen (BNG2.pl) plus pybnf and its public runtime/test
  dependencies into a uv venv, deliberately omitting the private, macOS-only
  bngsim wheel. Tests run under PYBNF_NO_BNGSIM=1 so bngsim-marked tests skip
  (see tests/conftest.py). BNG2.pl is still required: Configuration validation
  execs `BNG2.pl -v` for any BNGLModel regardless of bngsim, and the analytical
  tests aside, most of the suite builds such configs.

inputs:
  python-version:
    description: Python version for the venv (e.g. "3.11", "3.12").
    required: true
  petab-spec:
    description: >-
      The petab requirement to install. Defaults to stock PyPI petab. A CI leg
      overrides it with the #420 Step B fork
      (git+…/libpetab-python@bngl_model_support) so the exporter oracle
      validates `language: bngl` problems through petab's OWN native BnglModel
      loader rather than the register_bngl() monkeypatch (ADR-0026).
    required: false
    default: 'petab>=0.8,<1'

runs:
  using: composite
  steps:
    # Provision the interpreter with setup-python rather than uv's managed
    # (python-build-standalone) builds: libroadrunner is a C++ extension that
    # dlopen's libpython, and uv's standalone builds have not reliably exposed
    # libpython on the loader path. setup-python's Pythons are built
    # --enable-shared with libpython discoverable, so roadrunner imports on
    # every matrix leg.
    - uses: actions/setup-python@v6
      id: python
      with:
        python-version: ${{ inputs.python-version }}

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        # No uv.lock in this repo; key the cache on pyproject.toml so it can
        # invalidate when deps change.
        cache-dependency-glob: pyproject.toml
        # Namespace this action's uv cache (tests + integration) so it does not
        # collide with the lint workflow's cache on the same push -- see the
        # matching note in lint.yml.
        cache-suffix: pybnf

    - name: Install BioNetGen 2.9.3
      shell: bash
      run: |
        # BioNetGen is free/open-source and provides BNG2.pl (Perl is
        # preinstalled on ubuntu runners). It is NOT vendored into the repo or
        # the pybnf wheel -- it is fetched onto the ephemeral runner each run,
        # mirroring the developer prerequisite (BNGPATH on a local machine).
        curl -fsSL \
          https://github.com/RuleWorld/bionetgen/releases/download/BioNetGen-2.9.3/BioNetGen-2.9.3-linux.tar.gz \
          -o "$RUNNER_TEMP/bionetgen.tar.gz"
        tar -xzf "$RUNNER_TEMP/bionetgen.tar.gz" -C "$RUNNER_TEMP"
        echo "BNGPATH=$RUNNER_TEMP/BioNetGen-2.9.3" >> "$GITHUB_ENV"

    - name: Create venv and install pybnf without bngsim
      shell: bash
      run: |
        # Build the venv from the setup-python interpreter (see note above), not
        # a uv-managed one.
        uv venv --python "${{ steps.python.outputs.python-path }}"
        # Mirror pyproject.toml's runtime deps MINUS bngsim (private, mac-only
        # wheel, not on PyPI), plus the test stack (pytest, hypothesis,
        # pytest-xdist) and petab. petab is BOTH the PEtab v2 export/BnglModel
        # oracle (ADR-0025/0026 -- BNG2.pl is installed above, so model-level
        # validation runs here too) AND the runtime math translator backing the
        # expression observableFormula path (pybnf[petab], ADR-0035, petab.v2.math);
        # stock PyPI petab carries the math grammar, so one install covers both.
        # The exact petab requirement is the `petab-spec` input (default stock
        # PyPI; a CI leg overrides it with the Step B fork to run the NATIVE
        # BNGL loader). Keep these version bounds in sync with pyproject.toml;
        # bngsim is the only intentional omission.
        uv pip install \
          'dask>=2024.1.0' \
          'distributed>=2024.1.0' \
          'libroadrunner>=1.6.0' \
          'msgpack>=0.6.2' \
          'numpy>=1.24' \
          'paramiko>=2.7' \
          'pydantic>=2,<3' \
          'pyparsing>=2.4,<4' \
          'scipy>=1.10' \
          'tornado>=6.1' \
          'pytest>=7,<10' \
          'hypothesis>=6,<7' \
          'pytest-xdist' \
          '${{ inputs.petab-spec }}'
        # Install pybnf itself without re-resolving deps (which would pull
        # bngsim and fail).
        uv pip install --no-deps .
