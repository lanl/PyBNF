name: integration

# The home for the test tiers too slow for the per-push gate. Two jobs:
#
#   slow     -- the 4 statistical-recovery tests against analytical targets
#               (AnalyticalModel), bngsim-free and BNG2.pl-free, ~32 min. Runs
#               nightly AND on manual dispatch.
#   recovery -- the `recovery` tier: real parameter-recovery fits through the
#               bngsim backend (164 tests, 91 min on a hosted runner, measured
#               2026-11-04). Runs nightly AND on manual dispatch (#1026). It was
#               dispatch-only from #517 until then, and two of its tests broke
#               unnoticed in that time (#1024, #1025).
#
# NOTE: the fast bngsim *simulation* suites (true NFsim/RuleMonkey/SBML runs)
# DO run in hosted CI -- tests.yml installs bngsim from public PyPI (#514).
on:
  workflow_dispatch:
  schedule:
    # 08:00 UTC daily. GitHub cron is fixed UTC (no DST), so this is ~02:00 in
    # Denver during Mountain Daylight Time and ~01:00 during Mountain Standard
    # Time -- middle of the night either way.
    - cron: '0 8 * * *'

jobs:
  slow:
    runs-on: ubuntu-latest
    name: slow recovery tests
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-pybnf
        with:
          python-version: '3.12'
          # The slow tier is analytical (AnalyticalModel): no simulation
          # backend, so no bngsim install, and PYBNF_NO_BNGSIM=1 below keeps it
          # honest about that.
          bngsim: 'false'

      - name: Run slow analytical recovery tests
        env:
          PYBNF_NO_BNGSIM: '1'
        run: uv run --no-sync pytest -m slow -n auto

  recovery:
    runs-on: ubuntu-latest
    name: recovery tier (bngsim fits)
    # Nightly and on dispatch (#1026). #517 kept it dispatch-only until its run
    # time was measured and a flake policy was set. Both are settled:
    #
    #   * Run time: 91 min for 164 tests on 2026-11-04. --durations below names
    #     the slowest tests in every log, and the timeout stops a hung test from
    #     holding the runner for GitHub's 6-hour default.
    #   * Flakes: the harness runs every fit inline with a synchronous stand-in
    #     for dask and a pinned seed (tests/recovery_harness.py), so on one runner
    #     image and one set of dependency versions each test gives the same answer
    #     every time. A new red means a code or dependency change, which is what
    #     the tier is for. A test that varies between identical runs is a defect in
    #     that test: file it, do not gate the tier again. A seed-pinned test whose
    #     fit only usually succeeds is the same defect in slow motion, so each one
    #     records its measured pass rate over many seeds (#1024).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-pybnf
        with:
          python-version: '3.12'
          # The whole point of this tier: real fits through the simulation
          # backend, so bngsim must be present (and PYBNF_NO_BNGSIM stays unset).
          bngsim: 'true'
          # The recovery tier includes gradient-path fits (test_gradient_*,
          # and the Rijal-2025 real-world cases in test_real_world_examples.py)
          # whose LOG-SCALED parameters route the gradient into sampling space
          # via jax -- without the extra those tests raise PybnfError rather than
          # skip, so a recovery run without jax fails deterministically (2 hard
          # failures the first dispatch, #517). A complete recovery environment
          # provisions jax; install it here (as the pytest-jax job in tests.yml
          # does for the same gradient path).
          jax: 'true'
          # Also a 3.12 setup-pybnf run; give it its own uv-cache namespace so it
          # does not race the `slow` job's save on a dispatch (both run then).
          cache-suffix: pybnf-recovery

      - name: Run the recovery tier
        # -m recovery: the ~130 synthetic-data parameter-recovery fits through
        # the backend (test_recovery.py, the tutorial suites, profile-likelihood,
        # the gradient/SBML fits, ...). -n auto parallelizes across the runner's
        # cores -- fewer here than on a dev box, so expect this to be the slow leg.
        # --durations=25 lists the 25 slowest tests at the end of the log.
        #
        # --no-sync: the composite action already populated .venv; do not let
        # `uv run` re-resolve it from pyproject.toml.
        run: uv run --no-sync pytest -m recovery -n auto --durations=25
